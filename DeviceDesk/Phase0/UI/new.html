<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>DeviceDesk — NEW Stock Intake</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background:#f7f9fc; }
    .brandbar { background:linear-gradient(90deg,#2155ff,#6aa7ff); }
    .brandbar .navbar-brand { font-weight:700; }
    .card { border:0; border-radius:16px; box-shadow:0 6px 18px rgba(16,24,40,.06); }
    .help { color:#6b7280; }
  </style>
</head>
<body>
<nav class="navbar navbar-dark brandbar">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">DeviceDesk</a>
    <span class="text-white-50 small">Phase 0 · NEW Stock Intake</span>
  </div>
</nav>

<div class="container my-4">
  <div class="row g-4">
    <div class="col-lg-8">
      <div class="card">
        <div class="card-body">
          <h5>Upload NEW Devices (CSV)</h5>
          <div class="help mb-2">
            Columns: <b>Serial</b> or <b>IMEI</b> (required), optional <b>Brand</b>, <b>Model</b>, <b>Qty</b>, <b>EMIS</b>.
          </div>
          <div class="row g-2 align-items-end">
            <div class="col-md-9"><input type="file" id="csvFile" accept=".csv" class="form-control"></div>
            <div class="col-md-3 d-grid"><button id="btnImport" class="btn btn-primary" disabled><i class="bi bi-upload"></i> Import</button></div>
          </div>
          <div id="summary" class="mt-3 text-muted"></div>
        </div>
      </div>
    </div>
    <div class="col-lg-4">
      <div class="card">
        <div class="card-body">
          <h5>Purchase Documents</h5>
          <div class="help mb-2">Uploads are saved loose (not linked to a batch).</div>
          <div class="row g-2 align-items-end">
            <div class="col-8"><input type="file" id="docFile" class="form-control"></div>
            <div class="col-4 d-grid"><button id="btnDoc" class="btn btn-outline-secondary"><i class="bi bi-paperclip"></i> Upload PO</button></div>
          </div>
          <div id="docMsg" class="mt-2 text-muted"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const csvFile = document.getElementById('csvFile');
  const btnImport = document.getElementById('btnImport');
  const summary = document.getElementById('summary');
  const docFile = document.getElementById('docFile');
  const btnDoc = document.getElementById('btnDoc');
  const docMsg = document.getElementById('docMsg');

  csvFile.addEventListener('change', () => {
    btnImport.disabled = !(csvFile.files && csvFile.files[0]);
  });

  btnImport.addEventListener('click', async () => {
    const file = csvFile.files[0];
    if (!file) return;
    btnImport.disabled = true;
    summary.textContent = 'Importing…';
    const form = new FormData(); form.append('file', file);
    try {
      const res = await fetch('/api/phase0/new/import', { method: 'POST', body: form });
      const data = await res.json();
      if (!res.ok) throw new Error(data?.message || 'Import failed');
      summary.innerHTML = `Batch <code>${data.batchId}</code> · Added ${data.added} / Total ${data.total} · Duplicates ${data.duplicates} · Invalid ${data.invalid}`;
    } catch (e) {
      summary.textContent = e.message || 'Error importing CSV';
    } finally { btnImport.disabled = false; }
  });

  btnDoc.addEventListener('click', async () => {
    const file = docFile.files[0];
    if (!file) { docMsg.textContent = 'Pick a file first.'; return; }
    btnDoc.disabled = true; docMsg.textContent = 'Uploading…';
    const form = new FormData(); form.append('file', file);
    try {
      const res = await fetch(`/api/phase0/new/documents?docType=PO`, { method: 'POST', body: form });
      const data = await res.json();
      if (!res.ok) throw new Error(data?.message || 'Upload failed');
      docMsg.textContent = `Uploaded ${data.fileName} (id ${data.documentId})`;
    } catch (e) { docMsg.textContent = e.message || 'Error uploading'; }
    finally { btnDoc.disabled = false; }
  });
</script>
</body>
</html>
