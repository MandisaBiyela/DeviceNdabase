<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>DeviceDesk — Phase 0 Hub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background:#f7f9fc; }
    .brandbar { background:linear-gradient(90deg,#2155ff,#6aa7ff); }
    .brandbar .navbar-brand { font-weight:700; }
    .card { border:0; border-radius:16px; box-shadow:0 6px 18px rgba(16,24,40,.06); }
    .lead { color:#58627a; }
  </style>
</head>
<body>
<nav class="navbar navbar-dark brandbar">
  <div class="container-fluid">
    <span class="navbar-brand">DeviceDesk</span>
    <span class="text-white-50 small">Phase 0 · Hub</span>
  </div>
</nav>

<div class="container my-5">
  <div class="row mb-4">
    <div class="col">
      <h2 class="mb-1">Device Intake</h2>
      <p class="lead">Choose an intake flow to begin.</p>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-md-6">
      <a href="rnr.html" class="text-decoration-none">
        <div class="card h-100">
          <div class="card-body">
            <h4 class="card-title"><i class="bi bi-arrow-repeat me-2"></i>RNR (Return & Repair)</h4>
            <p class="card-text">Import handover CSVs and upload signed handover packs linked to a batch.</p>
          </div>
        </div>
      </a>
    </div>
    <div class="col-md-6">
      <a href="new.html" class="text-decoration-none">
        <div class="card h-100">
          <div class="card-body">
            <h4 class="card-title"><i class="bi bi-box-seam me-2"></i>NEW Stock</h4>
            <p class="card-text">Import supplier CSVs and upload loose purchase documents (e.g. PO).</p>
          </div>
        </div>
      </a>
    </div>
  </div>

  <div class="mt-5">
    <a class="btn btn-outline-secondary" href="/dev/swagger" target="_blank"><i class="bi bi-braces"></i> API Docs</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
