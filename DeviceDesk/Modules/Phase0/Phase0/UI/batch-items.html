<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Batch Items - Phase 0</title>
  <link rel="stylesheet" href="/lib/bootstrap/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="/css/dashboard-shell.css" />
  <link rel="stylesheet" href="css/phase0.css" />
  <style>
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .header { display: flex; align-items: center; justify-content: space-between; }
    .controls { display: flex; gap: 12px; align-items: center; }
    .table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    .table th, .table td { border: 1px solid #ddd; padding: 8px; }
    .table th { background: #f7f7f7; text-align: left; }
    .pager { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
    .pager button { padding: 6px 10px; }
    .muted { color: #666; }
    .btn { display: inline-block; padding: 8px 12px; border: 1px solid #333; border-radius: 4px; text-decoration: none; color: #333; }
    .btn-primary { background: #333; color: #fff; }
  </style>
</head>
<body class="app-shell">
  <aside class="app-sidebar">
    <div class="sidebar-brand-global">
      <img src="/img/ndabase-icon.png" class="sidebar-brand-icon" alt="Ndabase Logo Icon" />
    </div>
    
    <nav class="sidebar-nav">
      <span class="sidebar-section">DEVICE DESK</span>
      <a href="/phase0/index.html" class="sidebar-link"><i class="bi bi-house-door"></i><span>Overview</span></a>
      <span class="sidebar-section">RNR</span>
      <a href="/phase0/rnr.html" class="sidebar-link"><i class="bi bi-arrow-up-circle"></i><span>Upload RNR</span></a>
      <a href="/phase0/rnr-all.html" class="sidebar-link"><i class="bi bi-laptop"></i><span>All RNR Devices</span></a>
      <a href="/phase0/rnr-batches.html" class="sidebar-link"><i class="bi bi-collection"></i><span>RNR Batches</span></a>
      <span class="sidebar-section">NEW</span>
      <a href="/phase0/new.html" class="sidebar-link"><i class="bi bi-arrow-bar-up"></i><span>Upload NEW</span></a>
      <a href="/phase0/new-all.html" class="sidebar-link"><i class="bi bi-phone"></i><span>All NEW Devices</span></a>
      <a href="/phase0/new-batches.html" class="sidebar-link active"><i class="bi bi-collection-play"></i><span>NEW Batches</span></a>
      <a href="/phase0/new-readiness.html" class="sidebar-link"><i class="bi bi-clipboard-check"></i><span>School Readiness</span></a>
      <a href="/phase0/readiness-reports.html" class="sidebar-link"><i class="bi bi-file-earmark-text"></i><span>Readiness Reports</span></a>
      <span class="sidebar-section">SYSTEM</span>
      <a href="/logout" class="sidebar-link danger"><i class="bi bi-box-arrow-right"></i><span>Logout</span></a>
    </nav>
  </aside>

  <div class="app-main">
    <header class="app-header">
      <div>
        <div class="welcome-line">Phase 0 · NEW Stock</div>
        <div class="welcome-date">Batch Items</div>
      </div>
      <div class="header-right">
        <button class="avatar-btn"><span class="avatar-initials">P0</span></button>
      </div>
    </header>

    <main class="app-content">
      <div class="container">
        <div class="header">
          <h1>Batch Items</h1>
          <div class="controls">
            <a class="btn" href="index.html">Back to Phase 0</a>
            <label>
              Page size
              <select id="pageSize">
                <option value="25" selected>25</option>
                <option value="50">50</option>
                <option value="100">100</option>
              </select>
            </label>
          </div>
        </div>

        <div id="alert"></div>

        <table class="table" id="itemsTable">
          <thead>
            <tr>
              <th>#</th>
              <th>Serial</th>
              <th>IMEI</th>
              <th>Brand</th>
              <th>Model</th>
              <th class="text-end">Qty</th>
              <th>Batch File</th>
              <th>Imported At</th>
            </tr>
          </thead>
          <tbody id="itemsBody">
            <tr><td colspan="8" class="muted">Loading...</td></tr>
          </tbody>
        </table>

        <div class="pager">
          <button id="prevBtn">Prev</button>
          <span id="pageInfo">Page 1</span>
          <button id="nextBtn">Next</button>
        </div>
      </div>
    </main>
  </div>

  <script src="/lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/phase0.api.js"></script>
  <script>
    const {API_BASE, fetchJson, rowsOrEmpty, q} = PHASE0;
    let page = 1;
    let pageSize = 25;

    const itemsBody = document.getElementById('itemsBody');
    const pageInfo = document.getElementById('pageInfo');
    const pageSizeEl = document.getElementById('pageSize');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    function getQuery(k){ return new URLSearchParams(location.search).get(k); }
    const batchId = getQuery('id') || getQuery('batchId');
    const printParam = (getQuery('print')||'').toLowerCase();
    const isPrint = printParam === '1' || printParam === 'true' || printParam === 'yes';
    if (isPrint) {
      pageSize = 10000;
      document.querySelector('.controls')?.setAttribute('style','display:none');
      document.querySelector('.pager')?.setAttribute('style','display:none');
    }

    pageSizeEl.addEventListener('change', () => { pageSize = parseInt(pageSizeEl.value, 10); page = 1; loadItems(); });
    prevBtn.addEventListener('click', () => { if (page > 1) { page -= 1; loadItems(); } });
    nextBtn.addEventListener('click', () => { page += 1; loadItems(); });

    async function loadItems(){
      if (!batchId){ itemsBody.innerHTML = '<tr><td colspan="8" class="muted">Missing batchId</td></tr>'; return; }
      pageInfo.textContent = `Page ${page}`;
      itemsBody.innerHTML = '<tr><td colspan="8" class="muted">Loading...</td></tr>';
      try {
        const data = await fetchJson(`${API_BASE}/batches/${encodeURIComponent(batchId)}/items?page=${page}&pageSize=${pageSize}`);
        renderRows(rowsOrEmpty(data));
        if (isPrint) { setTimeout(()=>window.print(), 250); }
      } catch (err) {
        itemsBody.innerHTML = `<tr><td colspan="8" class="muted">${err.message}</td></tr>`;
      }
    }

    function renderRows(rows){
      if (!rows || rows.length === 0){ itemsBody.innerHTML = '<tr><td colspan="8" class="muted">No items found.</td></tr>'; return; }
      const start = (page-1)*pageSize;
      const html = rows.map((r,i)=>{
        const serial = r.serial ?? '';
        const imei = r.imei ?? '';
        const brand = r.brand ?? '';
        const model = r.model ?? '';
        const qty = typeof r.qty === 'number' ? r.qty : (r.quantity ?? 1);
        const file = r.batchFile ?? '-';
        const imported = r.importedAt ? PHASE0.localDateTime(r.importedAt) : '-';
        return `
          <tr>
            <td>${start+i+1}</td>
            <td>${serial}</td>
            <td>${imei}</td>
            <td>${brand}</td>
            <td>${model}</td>
            <td class="text-end">${qty}</td>
            <td>${file}</td>
            <td>${imported}</td>
          </tr>
        `;
      }).join('');
      itemsBody.innerHTML = html;
    }

    document.addEventListener('DOMContentLoaded', loadItems);
  </script>
</body>
</html>
