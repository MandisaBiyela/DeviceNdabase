<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>RNR Batches</title>
  <link rel="stylesheet" href="/lib/bootstrap/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="/css/dashboard-shell.css" />
  <link rel="stylesheet" href="/css/theme.css?v=2025" />
  <link rel="stylesheet" href="css/phase0.css" />
  <script src="js/phase0.api.js"></script>
  <style>
    .container{ max-width: 1000px; }
    .toolbar{ display:flex; gap:8px; align-items:center; margin-bottom:12px; }
    table td, table th{ vertical-align: middle; }
  </style>
</head>
<body class="app-shell">
  <aside class="app-sidebar">
  <div class="sidebar-brand-global">
    <img src="/img/ndabase-icon.png" class="sidebar-brand-icon" alt="Ndabase Logo Icon" />
  </div>
  
  <!-- Profile Block -->
  <div class="sidebar-profile" id="sidebarProfile">
    <div class="profile-avatar">
      <span class="avatar-initials" id="profileInitials">U</span>
    </div>
    <div class="profile-info">
      <div class="profile-name" id="profileName">Loading...</div>
      <div class="profile-role" id="profileRole">User</div>
    </div>
  </div>
    
    <nav class="sidebar-nav">
      <span class="sidebar-section">RNR</span>
      <a href="/phase0/rnr.html" class="sidebar-link"><i class="bi bi-arrow-up-circle"></i><span>Upload RNR</span></a>
      <a href="/phase0/rnr-all.html" class="sidebar-link"><i class="bi bi-laptop"></i><span>All RNR Devices</span></a>
      <a href="/phase0/rnr-batches.html" class="sidebar-link active"><i class="bi bi-collection"></i><span>RNR Batches</span></a>
      <span class="sidebar-section">NEW</span>
      <a href="/phase0/new.html" class="sidebar-link"><i class="bi bi-arrow-bar-up"></i><span>Upload NEW</span></a>
      <a href="/phase0/new-all.html" class="sidebar-link"><i class="bi bi-phone"></i><span>All NEW Devices</span></a>
      <a href="/phase0/new-batches.html" class="sidebar-link"><i class="bi bi-collection-play"></i><span>NEW Batches</span></a>
      <a href="/phase0/new-readiness.html" class="sidebar-link"><i class="bi bi-clipboard-check"></i><span>School Readiness</span></a>
      <a href="/phase0/readiness-reports.html" class="sidebar-link"><i class="bi bi-file-earmark-text"></i><span>Readiness Reports</span></a>
      <span class="sidebar-section">SYSTEM</span>
      <a href="/logout" class="sidebar-link danger"><i class="bi bi-box-arrow-right"></i><span>Logout</span></a>
    </nav>
  </aside>
  <div class="app-main">
    <header class="app-header"><div><div class="welcome-line">Phase 0 · RNR</div><div class="welcome-date">RNR Batches</div></div><div class="header-right"><button class="avatar-btn"><span class="avatar-initials">P0</span></button></div></header>
    <main class="app-content">
      <div class="container mt-3">
        <h3>RNR Intake Batches</h3>
        <div id="alert"></div>
        <div class="toolbar">
          <button id="refresh" class="btn btn-sm btn-primary">Refresh</button>
          <a class="btn btn-sm btn-secondary" href="rnr.html">Back to RNR Intake</a>
        </div>
        <table class="table table-striped">
          <thead>
            <tr>
              <th>Created</th>
              <th>Source File</th>
              <th>Items</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script>
  (function(){
    const { API_BASE, fetchJson, byId, localDateTime } = window.PHASE0;
    async function load(){
      try{
        const data = await fetchJson(`${API_BASE}/rnr/batches?page=1&pageSize=50`);
        const rows = (data && data.rows) || [];
        const tbody = byId('rows');
        tbody.innerHTML = rows.map(r => `
          <tr>
            <td>${localDateTime(r.createdAt)}</td>
            <td>${r.sourceFileName || ''}</td>
            <td>${r.items || 0}</td>
            <td>
              <a class="btn btn-sm btn-outline-primary" href="rnr-batch.html?batchId=${r.id}">Open</a>
              <a class="btn btn-sm btn-outline-secondary" href="batch-items.html?id=${r.id}&print=1">Export CSV</a>
            </td>
          </tr>`).join('');
      }catch(err){ PHASE0.toast(err.message); }
    }
    byId('refresh').addEventListener('click', load);
    load();
  })();
  </script>
  <script src="/lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script>
  async function loadProfile() {
    try {
      const response = await fetch('/api/auth/current-user');
      if (response.ok) {
        const user = await response.json();
        const initials = user.fullName ? user.fullName.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase() : 'U';
        document.getElementById('profileInitials').textContent = initials;
        document.getElementById('profileName').textContent = user.fullName || 'User';
        document.getElementById('profileRole').textContent = user.role || 'User';
      }
    } catch (error) {
      console.error('Error loading profile:', error);
    }
  }
  document.addEventListener('DOMContentLoaded', loadProfile);
  </script>
</body>
</html>
