<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page 2: Transport & Handover</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/dashboard-shell.css" />
    <link rel="stylesheet" href="/css/theme.css?v=2025" />
</head>
<body class="app-shell">
    <aside class="app-sidebar">
        <div class="sidebar-brand-global">
            <img src="/img/ndabase-icon.png" class="sidebar-brand-icon" alt="Logo" />
        </div>
        
        <!-- Profile Block -->
        <div class="sidebar-profile" id="sidebarProfile">
            <div class="profile-avatar">
                <span class="avatar-initials" id="profileInitials">U</span>
            </div>
            <div class="profile-info">
                <div class="profile-name" id="profileName">Loading...</div>
                <div class="profile-role" id="profileRole">User</div>
            </div>
        </div>
        
        <nav class="sidebar-nav">
            <span class="sidebar-section">DISPATCH WORKFLOW</span>
            <a href="/dispatch/preparation" class="sidebar-link">
                <i class="bi bi-box-seam"></i><span>Preparation</span>
            </a>
            <a href="/dispatch/pod-management" class="sidebar-link">
                <i class="bi bi-file-earmark-text"></i><span>POD Management</span>
            </a>
            <a href="/dispatch/transport" class="sidebar-link active">
                <i class="bi bi-truck"></i><span>Transport</span>
            </a>
            <a href="/dispatch/debriefing" class="sidebar-link">
                <i class="bi bi-clipboard-check"></i><span>Debriefing</span>
            </a>
            <a href="/dispatch/signoff" class="sidebar-link">
                <i class="bi bi-pen"></i><span>Sign-Off</span>
            </a>
            <span class="sidebar-section">SYSTEM</span>
            <a href="/logout" class="sidebar-link danger">
                <i class="bi bi-box-arrow-right"></i><span>Logout</span>
            </a>
        </nav>
    </aside>

    <div class="app-main">
        <header class="app-header">
            <div>
                <div class="welcome-line">Phase 3 – Dispatch</div>
                <div class="welcome-date">Page 2: Transport & Handover (Driver Dashboard)</div>
            </div>
            <div class="header-right">
                <span class="text-muted small" id="userDisplay"></span>
            </div>
        </header>

        <main class="app-content">
            <div class="container-fluid my-4">
                <!-- Pending Acceptance -->
                <div class="card mb-4">
                    <div class="card-header bg-warning">
                        <h5 class="mb-0"><i class="bi bi-hourglass-split"></i> Trips Pending Your Acceptance</h5>
                    </div>
                    <div class="card-body" id="pendingTrips">
                        <div class="text-center py-3">
                            <div class="spinner-border"></div>
                        </div>
                    </div>
                </div>

                <!-- Active Trips -->
                <div class="card mb-4">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0"><i class="bi bi-geo-alt"></i> Active Trips (In Transit)</h5>
                    </div>
                    <div class="card-body" id="activeTrips">
                        <div class="text-center py-3">
                            <div class="spinner-border"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- POD Delivery Modal -->
    <div class="modal fade" id="deliveryModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Record Delivery</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="deliveryForm">
                        <input type="hidden" id="deliveryPODId">
                        <div class="mb-3">
                            <h6 id="deliveryPODDetails"></h6>
                        </div>
                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="schoolSigned">
                                <label class="form-check-label" for="schoolSigned">
                                    <strong>School Representative Signed POD</strong>
                                </label>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Signatory Name</label>
                            <input type="text" id="signatoryName" class="form-control" 
                                   placeholder="Name of person who signed">
                        </div>
                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="hasExceptions" 
                                       onchange="toggleExceptions()">
                                <label class="form-check-label" for="hasExceptions">
                                    <strong class="text-danger">Report Exceptions (Damage/Refusal)</strong>
                                </label>
                            </div>
                        </div>
                        <div class="mb-3" id="exceptionsSection" style="display:none;">
                            <label class="form-label">Exception Notes</label>
                            <textarea id="exceptionNotes" class="form-control" rows="3"
                                      placeholder="Describe the issue (damage, refused items, etc.)"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Upload Signed POD Photo</label>
                            <input type="file" id="signedPODFile" class="form-control" accept="image/*,application/pdf">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-success" onclick="submitDelivery()">
                        <i class="bi bi-check-circle"></i> Submit Delivery
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentUser = null;
        let deliveryModal = null;

        document.addEventListener('DOMContentLoaded', async () => {
            deliveryModal = new bootstrap.Modal(document.getElementById('deliveryModal'));
            await loadCurrentUser();
            await loadMyTrips();
            
            // Auto-refresh every 30 seconds
            setInterval(loadMyTrips, 30000);
        });

        async function loadCurrentUser() {
            try {
                const response = await fetch('/api/auth/current-user', { credentials: 'include' });
                if (response.ok) {
                    currentUser = await response.json();
                    document.getElementById('userDisplay').textContent = currentUser.fullName || currentUser.email;
                    
                    // Update profile block
                    const initials = currentUser.fullName ? currentUser.fullName.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase() : 'U';
                    document.getElementById('profileInitials').textContent = initials;
                    document.getElementById('profileName').textContent = currentUser.fullName || currentUser.email || 'User';
                    document.getElementById('profileRole').textContent = currentUser.role || 'User';
                }
            } catch (error) {
                console.error('Failed to load user', error);
            }
        }

        async function loadMyTrips() {
            const pendingContainer = document.getElementById('pendingTrips');
            const activeContainer = document.getElementById('activeTrips');

            try {
                const response = await fetch('/api/phase3/driver/my-trips', { credentials: 'include' });
                if (!response.ok) {
                    const errorText = response.status === 403 ? 'Access denied. Please login as a Driver.' : 'Failed to load trips';
                    throw new Error(errorText);
                }

                const trips = await response.json();

                // Filter pending vs active
                const pending = trips.filter(t => t.status === 1); // PendingAcceptance
                const active = trips.filter(t => t.status === 2);  // InTransit

                // Render pending trips
                if (pending.length === 0) {
                    pendingContainer.innerHTML = '<div class="alert alert-info">No pending trips</div>';
                } else {
                    let html = '';
                    pending.forEach(trip => {
                        html += `<div class="card mb-3">
                            <div class="card-body">
                                <h5 class="card-title">${trip.tripRef}</h5>
                                <p class="mb-2"><strong>Vehicle:</strong> ${trip.vehicleReg}</p>
                                <p class="mb-2"><strong>PODs:</strong> ${trip.poDs?.length || 0} deliveries</p>
                                <button class="btn btn-primary" onclick="acceptTrip('${trip.tripId}')">
                                    <i class="bi bi-check-circle"></i> Accept Trip
                                </button>
                            </div>
                        </div>`;
                    });
                    pendingContainer.innerHTML = html;
                }

                // Render active trips
                if (active.length === 0) {
                    activeContainer.innerHTML = '<div class="alert alert-info">No active trips</div>';
                } else {
                    let html = '';
                    active.forEach(trip => {
                        html += `<div class="card mb-3">
                            <div class="card-header bg-success text-white">
                                <h5 class="mb-0">${trip.tripRef} - ${trip.vehicleReg}</h5>
                            </div>
                            <div class="card-body">
                                <h6 class="mb-3">Deliveries:</h6>`;
                        
                        if (trip.poDs && trip.poDs.length > 0) {
                            trip.poDs.forEach(pod => {
                                const statusIcon = pod.status === 3 ? 'check-circle-fill text-success' : 
                                                  pod.status === 4 ? 'check-circle-fill text-success' :
                                                  pod.status === 5 ? 'exclamation-triangle-fill text-warning' : 
                                                  'circle text-muted';
                                const statusText = pod.status === 3 ? 'Delivered' :
                                                  pod.status === 4 ? 'Delivered' :
                                                  pod.status === 5 ? 'Exception' : 'Pending';
                                
                                html += `<div class="d-flex justify-content-between align-items-center mb-2 p-2 border rounded">
                                    <div>
                                        <i class="bi bi-${statusIcon}"></i>
                                        <strong>${pod.podNumber}</strong> - ${pod.schoolName}
                                        <span class="badge bg-secondary">${statusText}</span>
                                    </div>
                                    ${pod.status === 3 ? '' : `
                                        <button class="btn btn-sm btn-success" onclick="openDeliveryModal('${pod.podId}', '${pod.podNumber}', '${pod.schoolName}')">
                                            <i class="bi bi-pencil"></i> Record Delivery
                                        </button>
                                    `}
                                </div>`;
                            });
                        }

                        // Check if all PODs are delivered
                        const allDelivered = trip.poDs && trip.poDs.every(p => p.status >= 3);
                        
                        html += `</div>
                            <div class="card-footer">
                                ${allDelivered ? `
                                    <button class="btn btn-primary btn-lg w-100" onclick="completeTrip('${trip.tripId}')">
                                        <i class="bi bi-flag-fill"></i> Complete Trip & Submit for Debriefing
                                    </button>
                                ` : `
                                    <p class="text-muted mb-0"><i class="bi bi-info-circle"></i> Complete all deliveries to finish trip</p>
                                `}
                            </div>
                        </div>`;
                    });
                    activeContainer.innerHTML = html;
                }
            } catch (error) {
                pendingContainer.innerHTML = '<div class="alert alert-danger">Error loading trips</div>';
                activeContainer.innerHTML = '<div class="alert alert-danger">Error loading trips</div>';
                console.error(error);
            }
        }

        async function acceptTrip(tripId) {
            if (!confirm('Accept this trip and begin delivery?')) return;

            try {
                const response = await fetch(`/api/phase3/driver/trips/${tripId}/accept`, {
                    method: 'POST',
                    credentials: 'include'
                });

                const data = await response.json();

                if (response.ok) {
                    alert(data.message);
                    await loadMyTrips();
                } else {
                    alert('Error: ' + data.message);
                }
            } catch (error) {
                alert('Error accepting trip');
                console.error(error);
            }
        }

        function openDeliveryModal(podId, podNumber, schoolName) {
            document.getElementById('deliveryPODId').value = podId;
            document.getElementById('deliveryPODDetails').textContent = `${podNumber} - ${schoolName}`;
            document.getElementById('schoolSigned').checked = false;
            document.getElementById('signatoryName').value = '';
            document.getElementById('hasExceptions').checked = false;
            document.getElementById('exceptionNotes').value = '';
            document.getElementById('signedPODFile').value = '';
            document.getElementById('exceptionsSection').style.display = 'none';
            deliveryModal.show();
        }

        function toggleExceptions() {
            const checked = document.getElementById('hasExceptions').checked;
            document.getElementById('exceptionsSection').style.display = checked ? 'block' : 'none';
        }

        async function submitDelivery() {
            const podId = document.getElementById('deliveryPODId').value;
            const schoolSigned = document.getElementById('schoolSigned').checked;
            const signatoryName = document.getElementById('signatoryName').value.trim();
            const hasExceptions = document.getElementById('hasExceptions').checked;
            const exceptionNotes = document.getElementById('exceptionNotes').value.trim();
            const file = document.getElementById('signedPODFile').files[0];

            if (!schoolSigned && !hasExceptions) {
                alert('Please indicate if school signed or if there are exceptions');
                return;
            }

            try {
                // Mark as delivered
                const deliveryResponse = await fetch(`/api/phase3/driver/pods/${podId}/deliver`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        schoolSigned,
                        signatoryName,
                        hasExceptions,
                        exceptionNotes
                    })
                });

                if (!deliveryResponse.ok) {
                    const data = await deliveryResponse.json();
                    alert('Error: ' + data.message);
                    return;
                }

                // Upload file if provided
                if (file) {
                    const formData = new FormData();
                    formData.append('file', file);

                    await fetch(`/api/phase3/driver/pods/${podId}/upload-signed-pod`, {
                        method: 'POST',
                        credentials: 'include',
                        body: formData
                    });
                }

                alert('Delivery recorded successfully!');
                deliveryModal.hide();
                await loadMyTrips();
            } catch (error) {
                alert('Error submitting delivery');
                console.error(error);
            }
        }

        async function completeTrip(tripId) {
            if (!confirm('Complete this trip and send for debriefing?')) return;

            try {
                const response = await fetch(`/api/phase3/driver/trips/${tripId}/complete`, {
                    method: 'POST',
                    credentials: 'include'
                });

                const data = await response.json();

                if (response.ok) {
                    alert(data.message);
                    await loadMyTrips();
                } else {
                    alert('Error: ' + data.message);
                }
            } catch (error) {
                alert('Error completing trip');
                console.error(error);
            }
        }
    </script>
</body>
</html>
