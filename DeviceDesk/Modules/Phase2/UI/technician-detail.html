<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Technician Device Detail</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container-fluid py-3">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">
      <i class="bi bi-eye"></i> Technician Device Detail
    </h4>
    <div class="d-flex align-items-center gap-2">
      <span class="text-muted small" id="detail_status">Idle</span>
      <button class="btn btn-outline-secondary btn-sm" onclick="history.back()">
        ← Back to My Work
      </button>
    </div>
  </div>

  <div id="detail_body"></div>
</div>

<script>
(function() {
  // If this page is opened directly (not embedded in dashboard), redirect to index
  if (!document.getElementById('mainContent')) {
    const qs = new URLSearchParams(location.search);
    const deviceId = qs.get('deviceId') || '';
    const readOnly = qs.get('readOnly') === '1' ? '1' : '';
    const search = deviceId
      ? `?view=technician-detail&deviceId=${encodeURIComponent(deviceId)}${readOnly ? '&readOnly=1' : ''}`
      : '?view=technician-detail';
    location.replace(`/phase2/index.html${search}`);
    return;
  }
})();
</script>
<script src="/js/helpers/time.js"></script>
<!-- Shared Phase 2 utilities -->
<script src="/phase2/js/phase2-utils.js"></script>
<script>
(function () {
  const statusEl = document.getElementById('detail_status');
  const container = document.getElementById('detail_body');

  // Figure out which device to load
  const qs = new URLSearchParams(location.search);
  const qsDeviceId = qs.get('deviceId');
  const deviceId = window.currentDetailedDeviceId || (qsDeviceId ? parseInt(qsDeviceId, 10) : null);
  const readOnly = window.currentDetailedReadOnly === true || qs.get('readOnly') === '1';

  if (!deviceId) {
    statusEl.textContent = 'No device selected.';
    container.innerHTML = '<div class="alert alert-warning">No device id provided.</div>';
    return;
  }

  statusEl.textContent = `Loading device #${deviceId}…`;

  async function load() {
    try {
      // Use the detailed assessment endpoint – richer DTO including notes
      const res = await fetch(`/api/phase2/assessment/detailed/${encodeURIComponent(deviceId)}`, {
        credentials: 'include',
        headers: { 'Accept': 'application/json' }
      });

      if (!res.ok) {
        statusEl.textContent = `Failed to load details (HTTP ${res.status})`;
        container.innerHTML =
          `<div class="alert alert-danger">Could not load device details (HTTP ${res.status}).</div>`;
        return;
      }

      const contentType = res.headers.get('content-type') || '';
      if (!contentType.includes('application/json')) {
        statusEl.textContent = 'Unexpected response (not JSON).';
        container.innerHTML =
          '<div class="alert alert-danger">Unexpected response from server.</div>';
        return;
      }

      const raw = await res.json();
      renderDetail(raw);
      statusEl.textContent = '';
    } catch (err) {
      statusEl.textContent = `Error: ${err.message}`;
      container.innerHTML =
        `<div class="alert alert-danger">Error loading device: ${escapeHtml(err.message)}</div>`;
    }
  }

  function renderDetail(raw) {
    if (!raw) {
      container.innerHTML =
        '<div class="alert alert-info">No details found for this device.</div>';
      return;
    }

    // Normalise both PascalCase and camelCase
    const d = {
      id:                 raw.Id                 ?? raw.id,
      serial:             raw.Serial             ?? raw.serial             ?? '',
      stage:              raw.Stage              ?? raw.stage              ?? '',
      stageName:          raw.StageName          ?? raw.stageName          ?? '',
      zone:               raw.Zone               ?? raw.zone               ?? '',
      zoneName:           raw.ZoneName           ?? raw.zoneName           ?? '',
      technicianId:       raw.TechnicianId       ?? raw.technicianId       ?? '',
      inspectionDate:     raw.InspectionDate     ?? raw.inspectionDate     ?? '',
      repairCategory:     raw.RepairCategory     ?? raw.repairCategory     ?? '',
      underWarranty:      raw.UnderWarranty      ?? raw.underWarranty,
      disposalRequested:  raw.DisposalRequested  ?? raw.disposalRequested,
      qaPassed:           raw.QaPassed           ?? raw.qaPassed,
      reworkCount:        raw.ReworkCount        ?? raw.reworkCount,
      receiptId:          raw.ReceiptId          ?? raw.receiptId,
      updatedAt:          raw.UpdatedAt          ?? raw.updatedAt          ?? '',
      preAssessmentNotes: raw.PreAssessmentNotes ?? raw.preAssessmentNotes ?? '',
      notes:              Array.isArray(raw.Notes) ? raw.Notes : []
    };

    const underWarrantyText =
      d.underWarranty === true ? 'Yes' :
      d.underWarranty === false ? 'No' : '';

    const disposalText =
      d.disposalRequested === true ? 'Yes' :
      d.disposalRequested === false ? 'No' : '';

    const qaText =
      d.qaPassed === true ? 'Yes' :
      d.qaPassed === false ? 'No' : '';

    const notesHtml =
      d.notes.length
        ? d.notes.map(n => `
            <div class="border rounded p-2 mb-2">
              <div class="small fw-semibold">
                ${escapeHtml(n.summary ?? '')}
                <span class="text-muted">(${escapeHtml(n.noteType ?? '')})</span>
              </div>
              <div class="small text-muted mb-1">
                ${n.createdAt ? formatLocalTime(n.createdAt) : ''}
                ${n.createdBy ? ' · ' + escapeHtml(String(n.createdBy)) : ''}
              </div>
              <div>${escapeHtml(n.details ?? '')}</div>
            </div>
          `).join('')
        : (d.preAssessmentNotes
            ? `<div>${escapeHtml(d.preAssessmentNotes)}</div>`
            : '<div class="text-muted">No notes available.</div>');

    container.innerHTML = `
      <div class="card shadow-sm">
        <div class="card-body">
          <div class="row g-3 mb-3">
            <div class="col-md-3">
              <div class="text-muted small">Serial</div>
              <div class="fw-semibold">${escapeHtml(d.serial)}</div>
            </div>
            <div class="col-md-3">
              <div class="text-muted small">Stage</div>
              <div class="fw-semibold">${formatStageValue(d.stage, d.stageName)}</div>
            </div>
            <div class="col-md-3">
              <div class="text-muted small">Zone</div>
              <div class="fw-semibold">${formatZoneValue(d.zone, d.zoneName)}</div>
            </div>
            <div class="col-md-3">
              <div class="text-muted small">Device ID</div>
              <div>${escapeHtml(String(d.id ?? deviceId))}</div>
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-3">
              <div class="text-muted small">Technician</div>
              <div>${escapeHtml(String(d.technicianId ?? ''))}</div>
            </div>
            <div class="col-md-3">
              <div class="text-muted small">Inspection Date</div>
              <div>${d.inspectionDate ? formatLocalTime(d.inspectionDate) : ''}</div>
            </div>
            <div class="col-md-3">
              <div class="text-muted small">Repair Category</div>
              <div>${escapeHtml(String(d.repairCategory ?? ''))}</div>
            </div>
            <div class="col-md-3 text-end"></div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-3">
              <div class="text-muted small">Under Warranty</div>
              <div>${underWarrantyText}</div>
            </div>
            <div class="col-md-3">
              <div class="text-muted small">Disposal Requested</div>
              <div>${disposalText}</div>
            </div>
            <div class="col-md-3">
              <div class="text-muted small">QA Passed</div>
              <div>${qaText}</div>
            </div>
            <div class="col-md-3">
              <div class="text-muted small">Rework Count</div>
              <div>${escapeHtml(String(d.reworkCount ?? ''))}</div>
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-3">
              <div class="text-muted small">Receipt ID</div>
              <div>${escapeHtml(String(d.receiptId ?? ''))}</div>
            </div>
            <div class="col-md-3">
              <div class="text-muted small">Last Updated</div>
              <div>${d.updatedAt ? formatLocalTime(d.updatedAt) : ''}</div>
            </div>
            <div class="col-md-6">
              <div class="text-muted small mb-1">Notes</div>
              ${notesHtml}
            </div>
          </div>
        </div>
      </div>
    `;
  }

  function formatStageValue(stage, name) {
    const sNum = stage !== undefined && stage !== null && String(stage) !== '' ? String(stage) : '';
    const sName = name ? String(name) : '';
    if (sNum && sName) return `Stage ${escapeHtml(sNum)}: ${escapeHtml(sName)}`;
    if (sName) return `Stage: ${escapeHtml(sName)}`;
    if (sNum) return `Stage ${escapeHtml(sNum)}`;
    return '';
  }

  function formatZoneValue(zone, name) {
    const zNum = zone !== undefined && zone !== null && String(zone) !== '' ? String(zone) : '';
    const zName = name ? String(name) : '';
    if (zNum && zName) return `Zone ${escapeHtml(zNum)}: ${escapeHtml(zName)}`;
    if (zName) return `Zone: ${escapeHtml(zName)}`;
    if (zNum) return `Zone ${escapeHtml(zNum)}`;
    return '';
  }

  function escapeHtml(value) {
    if (value === null || value === undefined) return '';
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  load();
})();
</script>
</body>
</html>
