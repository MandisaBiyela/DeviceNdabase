<div class="container-fluid">
    <h2 class="mb-4"><i class="bi bi-list-ul"></i> Device Tracking</h2>
    
    <div class="row mb-3">
        <div class="col-md-12">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-4">
                            <label for="filterStage" class="form-label">Filter by Stage</label>
                            <select class="form-select" id="filterStage" onchange="loadDevices()">
                                <option value="">All Stages</option>
                                <option value="0">Received</option>
                                <option value="2">Detailed Inspection</option>
                                <option value="3">Hardware Dept</option>
                                <option value="4">Software Dept</option>
                                <option value="6">Dispatch</option>
                                <option value="7">School Allocation</option>
                                <option value="8">Warranty Return</option>
                                <option value="9">Quarantine</option>
                                <option value="10">Disposal</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="filterZone" class="form-label">Filter by Zone</label>
                            <select class="form-select" id="filterZone" onchange="loadDevices()">
                                <option value="">All Zones</option>
                                <option value="0">New Stock</option>
                                <option value="1">R&R</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="searchSerial" class="form-label">Search by Serial</label>
                            <input type="text" class="form-control" id="searchSerial" placeholder="Enter serial number" onkeyup="loadDevices()">
                        </div>
                        <div class="col-md-4 mt-3">
                            <label for="filterAttention" class="form-label">Filter by Attention</label>
                            <select class="form-select" id="filterAttention" onchange="loadDevices()">
                                <option value="">All</option>
                                <option value="0">None</option>
                                <option value="1">Hardware</option>
                                <option value="2">Software</option>
                                <option value="3">Quarantine</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Devices</h5>
        </div>
        <div class="card-body">
            <div id="devicesList">
                <div class="text-center py-3">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/js/helpers/time.js"></script>
<!-- Shared Phase 2 utilities -->
<script src="/phase2/js/phase2-utils.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        loadDevices();
    });

    async function loadDevices() {
        const stageEl = document.getElementById('filterStage');
        const zoneEl = document.getElementById('filterZone');
        const serialEl = document.getElementById('searchSerial');
        const attentionEl = document.getElementById('filterAttention');

        // Guard for when this function is called outside of the Devices view
        if (!stageEl || !zoneEl || !serialEl) {
            return;
        }

        const stage = stageEl.value;
        const zone = zoneEl.value;
        const serial = serialEl.value;
        const attention = attentionEl ? attentionEl.value : '';

        let url = '/api/phase2/devices?';
        if (stage) url += `stage=${stage}&`;
        if (zone) url += `zone=${zone}&`;
        if (serial) url += `serial=${serial}&`;

        try {
            const response = await fetch(url);
            if (response.ok) {
                const devices = await response.json();
                let filtered = devices;
                if (attention !== '') {
                    const attVal = parseInt(attention, 10);
                    filtered = devices.filter(d => ((d.attentionRequired ?? 0) === attVal));
                }
                displayDevices(filtered);
            } else {
                document.getElementById('devicesList').innerHTML = `
                    <div class="alert alert-danger">Failed to load devices</div>
                `;
            }
        } catch (error) {
            document.getElementById('devicesList').innerHTML = `
                <div class="alert alert-danger">Error: ${error.message}</div>
            `;
        }
    }

    function displayDevices(devices) {
        const container = document.getElementById('devicesList');
        
        if (devices.length === 0) {
            container.innerHTML = `
                <div class="alert alert-info">
                    <i class="bi bi-info-circle"></i> No devices found.
                </div>
            `;
            return;
        }

        const stageNames = {
            0: 'Received', 1: 'Pre-Assessment', 2: 'Detailed Inspection',
            3: 'Hardware Dept', 4: 'Software Dept', 5: 'Quality Assessment',
            6: 'Dispatch', 7: 'School Allocation', 8: 'Warranty Return',
            9: 'Quarantine', 10: 'Disposal'
        };

        const stageBadges = {
            0: 'secondary', 2: 'warning', 3: 'danger', 4: 'info',
            6: 'success', 7: 'primary', 8: 'dark', 9: 'warning', 10: 'danger'
        };

        const attentionNames = {
            0: 'None', 1: 'Hardware', 2: 'Software', 3: 'Quarantine'
        };
        const attentionBadges = {
            0: 'secondary', 1: 'danger', 2: 'info', 3: 'warning'
        };

        container.innerHTML = `
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Serial</th>
                            <th>Zone</th>
                            <th>Stage</th>
                            <th>Attention</th>
                            <th>Warranty</th>
                            <th>QA Status</th>
                            <th>Rework Count</th>
                            <th>Last Actor</th>
                            <th>Last Updated</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${devices.map(device => `
                            <tr>
                                <td><strong>${device.serial}</strong></td>
                                <td>${device.zone === 0 ? 'New Stock' : 'R&R'}</td>
                                <td><span class="badge bg-${stageBadges[device.stage] || 'secondary'}">${stageNames[device.stage] || 'Unknown'}</span></td>
                                <td>${(() => { const ar = (device.attentionRequired ?? 0); return `<span class="badge bg-${attentionBadges[ar] || 'secondary'}">${attentionNames[ar] || 'None'}</span>`; })()}</td>
                                <td>${device.underWarranty === true ? 'Yes' : device.underWarranty === false ? 'No' : 'N/A'}</td>
                                <td>${device.qaPassed === true ? '✅ Passed' : device.qaPassed === false ? '❌ Failed' : 'Pending'}</td>
                                <td>${device.reworkCount || 0}</td>
                                <td>${(() => {
                                    const lastActor =
                                        (device.stage === 0 && device.ictClerkId) ? device.ictClerkId :
                                        (device.stage === 1 && device.preAssessmentInspectorId) ? device.preAssessmentInspectorId :
                                        (device.stage === 2 && device.technicianId) ? device.technicianId :
                                        (device.stage === 5 && device.qaInspectorId) ? device.qaInspectorId :
                                        (device.qaInspectorId || device.technicianId || device.preAssessmentInspectorId || device.ictClerkId || '');
                                    return lastActor || '-';
                                })()}</td>
                                <td>${formatLocalTime(device.updatedAt)}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        `;
    }
</script>
