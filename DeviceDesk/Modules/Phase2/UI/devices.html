<style>
  .p2-track-title{font-size:30px;font-weight:800;color:#111827;margin:0 0 18px;}
  .p2-filter-card{background:#fff;border:1px solid #E5E7EB;border-radius:16px;box-shadow:0 1px 2px rgba(16,24,40,.06);padding:20px;margin-bottom:24px;}
  .p2-filter-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;}
  @media (max-width:960px){.p2-filter-grid{grid-template-columns:repeat(1,minmax(0,1fr));}}
  .p2-filter-field{display:flex;flex-direction:column;gap:4px;}
  .p2-filter-label{font-size:11px;font-weight:700;color:#6B7280;letter-spacing:.06em;text-transform:uppercase;margin:0;}
  .p2-input,.p2-select{width:100%;height:40px;border:1px solid #D1D5DB;border-radius:10px;padding:0 12px;font-size:13px;color:#111827;background:#fff;}
  .p2-input:focus,.p2-select:focus{outline:none;border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,.12);}
  .p2-search-wrap{position:relative;}
  .p2-clear-btn{position:absolute;right:9px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#9CA3AF;font-size:14px;display:none;}
  .p2-clear-btn.show{display:block;}
  .p2-action-row{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px;flex-wrap:wrap;}
  .p2-meta{font-size:13px;color:#6B7280;}
  .p2-btn{height:32px;border-radius:10px;border:1px solid #D1D5DB;background:#fff;color:#4B5563;font-size:13px;padding:0 12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
  .p2-btn:hover{background:#F9FAFB;}
  .p2-btn-reset{border:0;background:transparent;color:#6B7280;padding:0 4px;}
  .p2-btn-reset:hover{color:#374151;text-decoration:underline;background:transparent;}

  .p2-dev-head{background:#fff;border:1px solid #E5E7EB;border-radius:16px 16px 0 0;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;}
  .p2-dev-title{display:flex;align-items:center;font-size:15px;font-weight:700;color:#1F2937;}
  .p2-dev-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .p2-live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#16A34A;}
  .p2-live-dot{width:8px;height:8px;background:#22C55E;border-radius:999px;animation:p2Pulse 1.2s ease-in-out infinite;}
  .p2-live-updated{font-size:10px;color:#9CA3AF;}
  .p2-total-pill{display:inline-flex;align-items:center;background:#EFF6FF;border:1px solid #BFDBFE;color:#1D4ED8;border-radius:999px;font-size:12px;font-weight:700;padding:3px 12px;}
  @keyframes p2Pulse{0%,100%{opacity:.4}50%{opacity:1}}

  .p2-table-wrap{background:#fff;border:1px solid #E5E7EB;border-top:0;border-radius:0 0 16px 16px;overflow:hidden;}
  .p2-table{width:100%;border-collapse:collapse;table-layout:fixed;}
  .p2-table thead th{position:sticky;top:0;z-index:10;background:#F9FAFB;border-bottom:1px solid #E5E7EB;color:#6B7280;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;height:40px;padding:0 10px;text-align:left;}
  .p2-table tbody td{height:48px;border-bottom:1px solid #F3F4F6;padding:0 10px;vertical-align:middle;font-size:13px;color:#374151;}
  .p2-table tbody tr:hover{background:rgba(37,99,235,.08);transition:background .1s ease;}
  .p2-col-num{width:50px;text-align:right;color:#9CA3AF;font-family:ui-monospace,Consolas,monospace;font-size:12px;padding-right:16px !important;}
  .p2-col-serial{font-family:ui-monospace,Consolas,monospace;font-size:12px;font-weight:600;color:#111827;}
  .p2-col-batch{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:#9CA3AF;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  .p2-badge{display:inline-flex;align-items:center;border-radius:8px;font-size:12px;font-weight:600;padding:2px 8px;line-height:1;}
  .p2-zone-new{background:#F1F5F9;color:#334155;}
  .p2-zone-a{background:#FAF5FF;color:#7E22CE;border:1px solid #E9D5FF;}
  .p2-zone-b{background:#EEF2FF;color:#4338CA;border:1px solid #C7D2FE;}
  .p2-zone-rnr{background:#FEF2F2;color:#B91C1C;border:1px solid #FECACA;}
  .p2-zone-emer{background:#FFF7ED;color:#C2410C;border:1px solid #FED7AA;}
  .p2-stage-received{background:#EFF6FF;color:#1D4ED8;border:1px solid #BFDBFE;}
  .p2-stage-scanning{background:#FFFBEB;color:#B45309;border:1px solid #FDE68A;}
  .p2-stage-zone{background:#ECFEFF;color:#0E7490;border:1px solid #A5F3FC;}
  .p2-stage-out{background:#F5F3FF;color:#6D28D9;border:1px solid #DDD6FE;}
  .p2-stage-dispatched{background:#ECFDF5;color:#15803D;border:1px solid #BBF7D0;}
  .p2-stage-delivered{background:#ECFDF5;color:#065F46;border:1px solid #86EFAC;}
  .p2-stage-dot{width:6px;height:6px;background:#EAB308;border-radius:999px;animation:p2Pulse 1.2s infinite;display:inline-block;margin-right:6px;}
  .p2-att-ok{background:#ECFDF5;color:#16A34A;}
  .p2-att-needs{background:#FFFBEB;color:#B45309;}
  .p2-att-flag{background:#FEF2F2;color:#B91C1C;}
  .p2-source{display:inline-flex;align-items:center;background:#F3F4F6;border-radius:999px;padding:2px 8px;font-size:11px;color:#4B5563;font-weight:600;}
  .p2-view-btn{height:24px;border-radius:7px;border:1px solid #BFDBFE;color:#2563EB;background:#fff;font-size:11px;padding:0 8px;display:inline-flex;align-items:center;gap:4px;}
  .p2-view-btn:hover{background:#EFF6FF;}

  .p2-empty{min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;}
  .p2-empty-title{margin-top:10px;color:#6B7280;font-weight:600;}
  .p2-empty-sub{margin-top:4px;color:#9CA3AF;font-size:12px;}
  .p2-empty-btn{margin-top:14px;height:34px;border-radius:10px;border:1px solid #93C5FD;color:#2563EB;background:#fff;font-size:13px;padding:0 14px;font-weight:600;}
  .p2-empty-btn:hover{background:#EFF6FF;}

  .p2-loading-head{display:flex;justify-content:center;align-items:center;gap:6px;font-size:11px;color:#9CA3AF;padding:8px 0;border-bottom:1px solid #F3F4F6;}
  .p2-loader-spin{animation:p2Spin 1s linear infinite;}
  @keyframes p2Spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  .p2-skeleton-row{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid #F3F4F6;}
  .p2-sk{
    height:14px;border-radius:6px;
    background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);
    background-size:200% 100%;animation:p2Shimmer 1.5s infinite;
  }
  @keyframes p2Shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .w-1{width:40px}.w-2{width:170px}.w-3{width:90px}.w-4{width:110px}.w-5{width:100px}.w-6{width:80px}
</style>

<div class="container-fluid">
  <h2 class="p2-track-title">
    <i data-lucide="align-justify" style="width:20px;height:20px;color:#4B5563;margin-right:8px;display:inline-block;vertical-align:middle;"></i>Device Tracking
  </h2>

  <div class="p2-filter-card">
    <div class="p2-filter-grid">
      <div class="p2-filter-field">
        <label for="filterStage" class="p2-filter-label">Filter by Stage</label>
        <select class="p2-select" id="filterStage">
          <option value="">All Stages</option>
          <option value="Received">Received</option>
          <option value="Scanning">Scanning</option>
          <option value="ZoneAssigned">Zone Assigned</option>
          <option value="ScanOut">Scan Out</option>
          <option value="Dispatched">Dispatched</option>
          <option value="Delivered">Delivered</option>
        </select>
      </div>

      <div class="p2-filter-field">
        <label for="filterZone" class="p2-filter-label">Filter by Zone</label>
        <select class="p2-select" id="filterZone">
          <option value="">All Zones</option>
          <option value="ZoneA">Zone A</option>
          <option value="ZoneB">Zone B</option>
          <option value="ZoneC">Zone C</option>
          <option value="NewStock">New Stock</option>
          <option value="RnR">R&amp;R</option>
          <option value="Emergency">Emergency</option>
        </select>
      </div>

      <div class="p2-filter-field">
        <label for="searchSerial" class="p2-filter-label">Search by Serial</label>
        <div class="p2-search-wrap">
          <input type="text" class="p2-input" id="searchSerial" placeholder="Enter serial number">
          <button type="button" id="searchClearBtn" class="p2-clear-btn" aria-label="Clear search">✕</button>
        </div>
      </div>

      <div class="p2-filter-field">
        <label for="filterAttention" class="p2-filter-label">Filter by Attention</label>
        <select class="p2-select" id="filterAttention">
          <option value="">All</option>
          <option value="NeedsAttention">Needs Attention</option>
          <option value="OK">OK</option>
          <option value="Flagged">Flagged</option>
        </select>
      </div>
    </div>

    <div class="p2-action-row">
      <div id="p2Showing" class="p2-meta">Showing 0–0 of 0 devices</div>
      <div class="d-flex align-items-center gap-2">
        <label for="pageSizeSelect" class="p2-meta">Page size</label>
        <select id="pageSizeSelect" class="p2-select" style="height:32px;width:84px;padding:0 8px;">
          <option value="25">25</option>
          <option value="50" selected>50</option>
          <option value="100">100</option>
        </select>
        <button id="resetBtn" class="p2-btn p2-btn-reset" type="button"><i data-lucide="rotate-ccw" style="width:14px;height:14px;"></i>Reset Filters</button>
        <button id="exportBtn" class="p2-btn" type="button"><i data-lucide="download" style="width:14px;height:14px;"></i>Export</button>
      </div>
    </div>
  </div>

  <div class="p2-dev-head">
    <div class="p2-dev-title"><i data-lucide="monitor" style="width:16px;height:16px;color:#3B82F6;margin-right:8px;"></i>Devices</div>
    <div class="p2-dev-right">
      <span class="p2-live"><span class="p2-live-dot"></span>Live</span>
      <span id="p2UpdatedAgo" class="p2-live-updated">Updated —</span>
      <span id="p2TotalPill" class="p2-total-pill">0 total</span>
    </div>
  </div>

  <div class="p2-table-wrap" id="devicesList"></div>
</div>

<script>
(() => {
  let pollTimer = null;
  let updatedTicker = null;
  let debounceTimer = null;
  let lastUpdatedAt = null;
  let isLoading = false;
  const state = {
    page: 1,
    pageSize: 50,
    total: 0,
    rows: [],
  };

  const el = {
    stage: document.getElementById('filterStage'),
    zone: document.getElementById('filterZone'),
    serial: document.getElementById('searchSerial'),
    att: document.getElementById('filterAttention'),
    searchClear: document.getElementById('searchClearBtn'),
    reset: document.getElementById('resetBtn'),
    exportBtn: document.getElementById('exportBtn'),
    list: document.getElementById('devicesList'),
    showing: document.getElementById('p2Showing'),
    totalPill: document.getElementById('p2TotalPill'),
    updated: document.getElementById('p2UpdatedAgo'),
    pageSize: document.getElementById('pageSizeSelect'),
  };

  const stageMap = {
    Received: 0,
    Scanning: 2,
    ZoneAssigned: 7,
    ScanOut: 6,
    Dispatched: 6,
    Delivered: 7,
  };
  const zoneMap = {
    NewStock: 0,
    RnR: 1,
  };

  function updateUpdatedAgo() {
    if (!el.updated) return;
    if (!lastUpdatedAt) {
      el.updated.textContent = 'Updated —';
      return;
    }
    const sec = Math.max(0, Math.floor((Date.now() - lastUpdatedAt) / 1000));
    el.updated.textContent = sec < 2 ? 'Updated just now' : `Updated ${sec}s ago`;
  }

  function showSkeleton() {
    const rows = Array.from({ length: 8 }).map(() => `
      <div class="p2-skeleton-row">
        <div class="p2-sk w-1"></div>
        <div class="p2-sk w-2"></div>
        <div class="p2-sk w-3"></div>
        <div class="p2-sk w-4"></div>
        <div class="p2-sk w-5"></div>
        <div class="p2-sk w-6"></div>
      </div>
    `).join('');
    el.list.innerHTML = `
      <div class="p2-loading-head"><i data-lucide="loader-2" class="p2-loader-spin" style="width:12px;height:12px;"></i>Fetching devices...</div>
      ${rows}
    `;
    try { if (window.lucide) window.lucide.createIcons(); } catch {}
  }

  function fmtDate(v) {
    if (!v) return '—';
    const d = new Date(v);
    if (Number.isNaN(d.getTime())) return '—';
    const s = d.toLocaleString('en-GB', {
      day: '2-digit', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true
    });
    return s.replace(/\b(am|pm)\b/i, (m) => m.toUpperCase());
  }

  function badgeZone(zoneLabel) {
    const z = String(zoneLabel || '').toLowerCase();
    if (z.includes('new')) return `<span class="p2-badge p2-zone-new">New Stock</span>`;
    if (z.includes('rnr') || z.includes('r&r')) return `<span class="p2-badge p2-zone-rnr">R&amp;R</span>`;
    if (z.includes('a')) return `<span class="p2-badge p2-zone-a">Zone A</span>`;
    if (z.includes('b')) return `<span class="p2-badge p2-zone-b">Zone B</span>`;
    if (z.includes('c')) return `<span class="p2-badge p2-zone-b">Zone C</span>`;
    if (z.includes('emer')) return `<span class="p2-badge p2-zone-emer">Emergency</span>`;
    return `<span class="p2-badge p2-zone-new">${zoneLabel || 'New Stock'}</span>`;
  }

  function stageDisplay(stage) {
    const s = Number(stage);
    if (s === 0) return `<span class="p2-badge p2-stage-received">Received</span>`;
    if (s === 2 || s === 3 || s === 4 || s === 5) return `<span class="p2-badge p2-stage-scanning"><span class="p2-stage-dot"></span>Scanning</span>`;
    if (s === 7) return `<span class="p2-badge p2-stage-zone">Zone Assigned</span>`;
    if (s === 6) return `<span class="p2-badge p2-stage-out">Scan Out</span>`;
    if (s === 11) return `<span class="p2-badge p2-stage-dispatched">Dispatched</span>`;
    if (s === 12) return `<span class="p2-badge p2-stage-delivered">Delivered</span>`;
    return `<span class="p2-badge p2-stage-zone">Zone Assigned</span>`;
  }

  function attentionDisplay(att) {
    const v = Number(att ?? 0);
    if (v === 0) return `<span class="p2-badge p2-att-ok"><i data-lucide="check-circle" style="width:12px;height:12px;margin-right:4px;"></i>OK</span>`;
    if (v === 3) return `<span class="p2-badge p2-att-flag"><i data-lucide="flag" style="width:12px;height:12px;margin-right:4px;"></i>Flagged</span>`;
    return `<span class="p2-badge p2-att-needs"><i data-lucide="alert-circle" style="width:12px;height:12px;margin-right:4px;"></i>Needs Attention</span>`;
  }

  function sourceDisplay(zone) {
    const z = Number(zone);
    return `<span class="p2-source">${z === 1 ? 'RnR' : 'NewStock'}</span>`;
  }

  function renderEmpty() {
    el.list.innerHTML = `
      <div class="p2-empty">
        <i data-lucide="search-x" style="width:40px;height:40px;color:#D1D5DB;"></i>
        <div class="p2-empty-title">No devices match your filters</div>
        <div class="p2-empty-sub">Try adjusting the stage, zone, or search term</div>
        <button class="p2-empty-btn" id="p2ResetEmptyBtn" type="button">Reset Filters</button>
      </div>
    `;
    document.getElementById('p2ResetEmptyBtn')?.addEventListener('click', resetFilters);
    try { if (window.lucide) window.lucide.createIcons(); } catch {}
  }

  function renderTable(rows) {
    if (!rows.length) {
      renderEmpty();
      return;
    }
    const start = (state.page - 1) * state.pageSize + 1;
    const html = `
      <div class="table-responsive">
        <table class="p2-table">
          <colgroup>
            <col style="width:50px;" />
            <col style="width:200px;" />
            <col style="width:120px;" />
            <col style="width:140px;" />
            <col style="width:110px;" />
            <col style="width:110px;" />
            <col style="width:180px;" />
            <col style="width:100px;" />
          </colgroup>
          <thead>
            <tr>
              <th>#</th><th>Serial</th><th>Zone</th><th>Stage</th><th>Attention</th><th>Source</th><th>Batch</th><th>Actions</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map((d, idx) => `
              <tr>
                <td class="p2-col-num">${start + idx}</td>
                <td class="p2-col-serial">${d.serial || '—'}</td>
                <td>${badgeZone(d.zoneLabel || (Number(d.zone) === 1 ? 'R&R' : 'New Stock'))}</td>
                <td>${stageDisplay(d.stage)}</td>
                <td>${attentionDisplay(d.attentionRequired)}</td>
                <td>${sourceDisplay(d.zone)}</td>
                <td class="p2-col-batch">${d.batch || '—'}</td>
                <td><button class="p2-view-btn" type="button" data-view-id="${d.id}"><i data-lucide="eye" style="width:12px;height:12px;"></i>View</button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
    el.list.innerHTML = html;
    el.list.querySelectorAll('[data-view-id]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-view-id');
        if (!id) return;
        if (typeof window.loadInspectorDetailFromHistory === 'function') {
          window.loadInspectorDetailFromHistory(id, true);
        }
      });
    });
    try { if (window.lucide) window.lucide.createIcons(); } catch {}
  }

  function queryUrl() {
    const params = new URLSearchParams();
    const stageKey = el.stage?.value || '';
    const zoneKey = el.zone?.value || '';
    const serial = (el.serial?.value || '').trim();
    const attention = el.att?.value || '';
    if (stageKey && stageMap[stageKey] !== undefined) params.set('stage', String(stageMap[stageKey]));
    if (zoneKey && zoneMap[zoneKey] !== undefined) params.set('zone', String(zoneMap[zoneKey]));
    if (serial) params.set('serial', serial);
    if (attention) params.set('attention', attention);
    params.set('page', String(state.page));
    params.set('pageSize', String(state.pageSize));
    return `/api/phase2/devices?${params.toString()}`;
  }

  async function loadDevices() {
    if (isLoading) return;
    isLoading = true;
    showSkeleton();
    try {
      const res = await fetch(queryUrl(), { headers: { Accept: 'application/json' } });
      if (!res.ok) throw new Error('Failed to load devices');
      const data = await res.json();
      const rows = Array.isArray(data) ? data : (data.rows || []);
      state.total = Number(data.total ?? rows.length ?? 0);
      state.rows = rows;
      const start = rows.length ? ((state.page - 1) * state.pageSize + 1) : 0;
      const end = rows.length ? (start + rows.length - 1) : 0;
      el.showing.textContent = `Showing ${start}–${end} of ${state.total.toLocaleString('en-US')} devices`;
      el.totalPill.textContent = `${state.total.toLocaleString('en-US')} total`;
      renderTable(rows);
      lastUpdatedAt = Date.now();
      updateUpdatedAgo();
    } catch (e) {
      el.list.innerHTML = `<div class="alert alert-danger m-3">${e.message}</div>`;
      el.showing.textContent = 'Showing 0–0 of 0 devices';
      el.totalPill.textContent = '0 total';
    } finally {
      isLoading = false;
    }
  }

  function debouncedLoad() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      state.page = 1;
      loadDevices();
    }, 300);
  }

  function resetFilters() {
    if (el.stage) el.stage.value = '';
    if (el.zone) el.zone.value = '';
    if (el.serial) el.serial.value = '';
    if (el.att) el.att.value = '';
    if (el.pageSize) el.pageSize.value = '50';
    state.pageSize = 50;
    state.page = 1;
    syncClearButton();
    loadDevices();
  }

  function syncClearButton() {
    if (!el.searchClear || !el.serial) return;
    const has = (el.serial.value || '').length > 0;
    el.searchClear.classList.toggle('show', has);
  }

  function exportRows() {
    const rows = state.rows || [];
    const header = ['Serial','Zone','Stage','Attention','Source','Batch','UpdatedAt'];
    const lines = [header.join(',')];
    rows.forEach((d) => {
      const zone = d.zoneLabel || (Number(d.zone) === 1 ? 'R&R' : 'New Stock');
      const stage = Number(d.stage);
      const stageLabel = stage === 0 ? 'Received' : stage === 6 ? 'Scan Out' : stage === 7 ? 'Zone Assigned' : 'Scanning';
      const att = Number(d.attentionRequired ?? 0);
      const attLabel = att === 0 ? 'OK' : att === 3 ? 'Flagged' : 'Needs Attention';
      const source = Number(d.zone) === 1 ? 'RnR' : 'NewStock';
      const vals = [d.serial || '', zone, stageLabel, attLabel, source, d.batch || '', fmtDate(d.updatedAt)];
      lines.push(vals.map((v) => `"${String(v).replaceAll('"','""')}"`).join(','));
    });
    const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `phase2-devices-${new Date().toISOString().slice(0,19).replaceAll(':','-')}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function startRealtime() {
    clearInterval(pollTimer);
    clearInterval(updatedTicker);
    pollTimer = setInterval(() => loadDevices(), 20000);
    updatedTicker = setInterval(updateUpdatedAgo, 1000);
  }

  // Expose for loader logic in index.html
  window.loadDevices = loadDevices;

  el.stage?.addEventListener('change', () => { state.page = 1; loadDevices(); });
  el.zone?.addEventListener('change', () => { state.page = 1; loadDevices(); });
  el.att?.addEventListener('change', () => { state.page = 1; loadDevices(); });
  el.serial?.addEventListener('input', () => { syncClearButton(); debouncedLoad(); });
  el.searchClear?.addEventListener('click', () => { if (el.serial) el.serial.value = ''; syncClearButton(); state.page = 1; loadDevices(); });
  el.reset?.addEventListener('click', resetFilters);
  el.exportBtn?.addEventListener('click', exportRows);
  el.pageSize?.addEventListener('change', () => {
    state.pageSize = Number(el.pageSize.value || '50') || 50;
    state.page = 1;
    loadDevices();
  });

  syncClearButton();
  loadDevices();
  startRealtime();
  try { if (window.lucide) window.lucide.createIcons(); } catch {}
})();
</script>
