<div class="container">
  <h4 class="mb-3"><i class="bi bi-box-arrow-right"></i> Scan-Out to Dispatch</h4>

  <div class="row g-3">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header">Ready Devices</div>
        <div class="card-body">
          <div class="input-group mb-2">
            <input id="filterSerial" type="text" class="form-control" placeholder="Filter by serial (optional)">
            <button class="btn btn-primary" onclick="window.loadReady()">Refresh</button>
          </div>
          <div class="table-responsive" style="max-height: 320px; overflow:auto;">
            <table class="table table-sm" id="readyTable">
              <thead>
                <tr>
                  <th>Serial</th>
                  <th>Receipt</th>
                  <th>QA Passed</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="readyList">
                <tr><td colspan="4" class="text-muted">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="card mb-3">
        <div class="card-header">Scan Single Serial</div>
        <div class="card-body">
          <div class="input-group">
            <input id="scanSerialInput" type="text" class="form-control" placeholder="Enter or scan serial">
            <button class="btn btn-success" onclick="window.scanOutSerial()">Scan-Out</button>
          </div>
          <small class="text-muted">
            Shows devices in <strong>ReadyForDispatchScanOut</strong> (set at QA Pass). Scan-out moves them to <strong>DispatchReady</strong>.
          </small>
        </div>
      </div>

      <div class="card">
        <div class="card-header">Batch Scan-Out</div>
        <div class="card-body">
          <textarea id="batchSerials" class="form-control" rows="6" placeholder="Paste serials (one per line)"></textarea>
          <div class="mt-2 d-flex gap-2">
            <button class="btn btn-outline-success" onclick="window.scanOutBatch()">Process Batch</button>
            <button class="btn btn-outline-secondary" onclick="document.getElementById('batchSerials').value='';">Clear</button>
          </div>
          <div id="batchResults" class="mt-2"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="row mt-3">
    <div class="col-12">
      <div class="card">
        <div class="card-header">Recent Scan-Out History</div>
        <div class="card-body">
          <div class="table-responsive" style="max-height: 260px; overflow:auto;">
            <table class="table table-sm">
              <thead>
                <tr>
                  <th>Serial</th>
                  <th>Scanned Out At</th>
                  <th>Scanned Out By</th>
                </tr>
              </thead>
              <tbody id="historyList">
                <tr><td colspan="3" class="text-muted">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // Helper API wrappers
  async function apiGet(url) {
    const r = await fetch(url, { credentials: 'include' });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  }
  async function apiPost(url, body) {
    const r = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify(body)
    });
    if (!r.ok) {
      try { const e = await r.json(); throw new Error(e.message || 'Request failed'); }
      catch { throw new Error('Request failed'); }
    }
    return r.json();
  }

  function showToast(msg, variant) {
    const el = document.createElement('div');
    el.className = `alert alert-${variant||'info'} py-2 my-2`;
    el.textContent = msg;
    document.querySelector('.container').prepend(el);
    setTimeout(() => el.remove(), 3000);
  }

  // Ready devices
  async function loadReady() {
    const filter = document.getElementById('filterSerial').value.trim();
    try {
      const items = await apiGet(`/api/phase2/dispatch/ready${filter ? ('?filter=' + encodeURIComponent(filter)) : ''}`);
      const tbody = document.getElementById('readyList');
      if (!items || items.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-muted">No devices ready.</td></tr>`;
        return;
      }
      tbody.innerHTML = items.map(d => `
        <tr>
          <td>${d.serial}</td>
          <td>${d.receiptId ?? ''}</td>
          <td>${d.qaPassed ? 'Yes' : 'No'}</td>
          <td class="text-end"><button class="btn btn-sm btn-outline-primary" onclick="window.scanOutById(${d.id})">Scan-Out</button></td>
        </tr>
      `).join('');
    } catch (e) {
      document.getElementById('readyList').innerHTML = `<tr><td colspan="4" class="text-danger">${e.message}</td></tr>`;
    }
  }

  // Single serial scan-out
  async function scanOutSerial() {
    const serial = document.getElementById('scanSerialInput').value.trim();
    if (!serial) { showToast('Enter a serial first', 'warning'); return; }
    try {
      const res = await apiPost('/api/phase2/dispatch/scanout/by-serial', { Serial: serial });
      showToast(`Scanned out ${res.serial}`, 'success');
      document.getElementById('scanSerialInput').value = '';
      await loadReady();
      await loadHistory();
    } catch (e) {
      showToast(e.message, 'danger');
    }
  }

  // Scan-out by device id from ready list
  async function scanOutById(id) {
    try {
      const res = await apiPost('/api/phase2/dispatch/scanout/by-id', { DeviceId: id });
      showToast(`Scanned out ${res.serial}`, 'success');
      await loadReady();
      await loadHistory();
    } catch (e) {
      showToast(e.message, 'danger');
    }
  }

  // Batch scan: client-side loop calling by-serial endpoint
  async function scanOutBatch() {
    const text = document.getElementById('batchSerials').value;
    const lines = (text || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    if (lines.length === 0) { showToast('Paste serials first', 'warning'); return; }
    const out = [];
    for (const s of lines) {
      try {
        const res = await apiPost('/api/phase2/dispatch/scanout/by-serial', { Serial: s });
        out.push(`<div class="text-success">${s}: OK</div>`);
      } catch (e) {
        out.push(`<div class="text-danger">${s}: ${e.message}</div>`);
      }
    }
    document.getElementById('batchResults').innerHTML = out.join('');
    await loadReady();
    await loadHistory();
  }

  // History
  async function loadHistory() {
    try {
      const items = await apiGet('/api/phase2/dispatch/history');
      const tbody = document.getElementById('historyList');
      if (!items || items.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" class="text-muted">No history yet.</td></tr>`;
        return;
      }
      tbody.innerHTML = items.map(d => {
        // Format date properly - parse ISO string and display in local format
        let dateStr = '';
        if (d.scannedOutAt) {
          try {
            const date = new Date(d.scannedOutAt);
            // Check if date is valid and not in the future (2026 when we're in 2025)
            if (!isNaN(date.getTime()) && date.getFullYear() <= new Date().getFullYear() + 1) {
              dateStr = date.toLocaleString('en-ZA', { 
                year: 'numeric', 
                month: '2-digit', 
                day: '2-digit', 
                hour: '2-digit', 
                minute: '2-digit',
                hour12: false
              });
            } else {
              // If date seems invalid, show raw value
              dateStr = d.scannedOutAt;
            }
          } catch {
            dateStr = d.scannedOutAt;
          }
        }
        return `
        <tr>
          <td>${d.serial}</td>
          <td>${dateStr}</td>
          <td>${d.scannedOutBy ?? 'Unknown'}</td>
        </tr>
      `;
      }).join('');
    } catch (e) {
      document.getElementById('historyList').innerHTML = `<tr><td colspan="3" class="text-danger">${e.message}</td></tr>`;
    }
  }

  // Auto-init when fragment loads via renderWithScripts
  window.initScanOutView = async function() {
    await loadReady();
    await loadHistory();
  };
  // Immediately start
  (async () => { try { await window.initScanOutView(); } catch (e) { console.error(e); } })();
</script>
