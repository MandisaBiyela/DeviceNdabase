<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-0">Schools in Storage</h2>
            <small class="text-muted">
                View schools that have devices currently in storage.
            </small>
        </div>
        <button class="btn btn-outline-primary" id="btnRefresh">
            <i class="bi bi-arrow-clockwise me-1"></i> Refresh
        </button>
    </div>

    <div class="row mb-3">
        <div class="col-md-6">
            <input type="text" id="searchInput" class="form-control" 
                   placeholder="Search by school name..." />
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle" id="schoolsTable">
                    <thead class="table-light">
                        <tr>
                            <th>School Name</th>
                            <th class="text-end">Total Devices</th>
                            <th>By Stage</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="3" class="text-center text-muted py-4">
                                <div class="spinner-border spinner-border-sm me-2" role="status"></div>
                                Loading schools...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="mt-3">
        <div class="card bg-light">
            <div class="card-body">
                <h6 class="mb-2">Summary</h6>
                <div class="row">
                    <div class="col-md-6">
                        <strong>Total Schools:</strong> <span id="totalSchools">0</span>
                    </div>
                    <div class="col-md-6">
                        <strong>Total Devices in Storage:</strong> <span id="totalDevices">0</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let allData = [];

    async function loadSchoolsInStorage() {
        const tbody = document.querySelector('#schoolsTable tbody');
        tbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted py-4"><div class="spinner-border spinner-border-sm me-2"></div>Loading...</td></tr>';

        try {
            const response = await fetch('/api/phase2/allocation/schools-in-storage');
            if (!response.ok) {
                throw new Error('Failed to load schools in storage');
            }

            allData = await response.json();
            applyFilters();
        } catch (error) {
            console.error('Error loading schools in storage:', error);
            tbody.innerHTML = `
                <tr>
                    <td colspan="3" class="text-center text-danger py-4">
                        <i class="bi bi-exclamation-triangle me-2"></i>
                        Error loading schools: ${error.message}
                    </td>
                </tr>
            `;
        }
    }

    function applyFilters() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();

        let filtered = allData;

        if (searchTerm) {
            filtered = filtered.filter(item =>
                (item.schoolName || '').toLowerCase().includes(searchTerm)
            );
        }

        renderTable(filtered);
        updateSummary(filtered);
    }

    function renderTable(data) {
        const tbody = document.querySelector('#schoolsTable tbody');
        
        if (data.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="3" class="text-center text-muted py-4">
                        No schools with devices in storage found.
                    </td>
                </tr>
            `;
            return;
        }

        tbody.innerHTML = '';
        data.forEach(item => {
            const tr = document.createElement('tr');
            
            // Format stage breakdown
            const stageBadges = Object.entries(item.byStage || {})
                .map(([stage, count]) => `<span class="badge bg-secondary me-1">${stage}: ${count}</span>`)
                .join('') || '<span class="text-muted">-</span>';
            
            tr.innerHTML = `
                <td><strong>${item.schoolName || 'Unknown'}</strong></td>
                <td class="text-end">
                    <span class="badge bg-primary fs-6">${item.totalDevices}</span>
                </td>
                <td>${stageBadges}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function updateSummary(data) {
        const totalDevices = data.reduce((sum, item) => sum + item.totalDevices, 0);

        document.getElementById('totalSchools').textContent = data.length;
        document.getElementById('totalDevices').textContent = totalDevices;
    }

    document.getElementById('btnRefresh').addEventListener('click', loadSchoolsInStorage);
    document.getElementById('searchInput').addEventListener('input', applyFilters);

    // Initial load
    loadSchoolsInStorage();
</script>
