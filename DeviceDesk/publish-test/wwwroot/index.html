<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>DeviceDesk — Phase 0 Intake</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="icon" href="/favicon.ico" />
  <style>
    body { background:#f7f9fc; }
    .brandbar { background:linear-gradient(90deg,#2155ff,#6aa7ff); }
    .brandbar .navbar-brand { font-weight:700; }
    .card { border:0; border-radius:16px; box-shadow:0 6px 18px rgba(16,24,40,.06); }
    .help { color:#6b7280; }
  </style>
</head>
<body>
<nav class="navbar navbar-dark brandbar">
  <div class="container-fluid">
    <span class="navbar-brand">DeviceDesk</span>
    <span class="text-white-50 small">Phase 0 · Device Intake</span>
  </div>
</nav>

<div class="container my-4">
  <ul class="nav nav-tabs mb-3">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#rnr" type="button">RNR (Handover)</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#new" type="button">NEW Stock</button></li>
  </ul>

  <div class="tab-content">
    <!-- RNR -->
    <section class="tab-pane fade show active" id="rnr">
      <div class="row g-4">
        <div class="col-lg-8">
          <div class="card">
            <div class="card-body">
              <h5>Upload Handover Spreadsheet (CSV)</h5>
              <div class="help mb-2">
                Columns: <b>Serial</b> or <b>IMEI</b> (required), optional <b>Brand</b>, <b>Model</b>, <b>Qty</b>, <b>EMIS</b>.
              </div>
              <div class="row g-2 align-items-end">
                <div class="col-md-9"><input type="file" id="rnrFile" accept=".csv" class="form-control"></div>
                <div class="col-md-3 d-grid"><button id="btnRnrImport" class="btn btn-success" disabled><i class="bi bi-upload"></i> Import</button></div>
              </div>
              <div id="rnrSummary" class="mt-3 text-muted"></div>
            </div>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="card">
            <div class="card-body">
              <h5>Handover Pack</h5>
              <div class="row g-2 align-items-end">
                <div class="col-8"><input type="file" id="rnrDoc" class="form-control" disabled></div>
                <div class="col-4 d-grid"><button id="btnRnrDoc" class="btn btn-outline-secondary" disabled><i class="bi bi-paperclip"></i> Upload</button></div>
              </div>
              <div id="rnrDocMsg" class="mt-2 text-muted"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- NEW -->
    <section class="tab-pane fade" id="new">
      <div class="row g-4">
        <div class="col-lg-8">
          <div class="card">
            <div class="card-body">
              <h5>Upload NEW Devices (CSV)</h5>
              <div class="help mb-2">
                Columns: <b>Serial</b> or <b>IMEI</b> (required), optional <b>Brand</b>, <b>Model</b>, <b>Qty</b>, <b>EMIS</b>.
              </div>
              <div class="row g-2 align-items-end">
                <div class="col-md-9"><input type="file" id="newFile" accept=".csv" class="form-control"></div>
                <div class="col-md-3 d-grid"><button id="btnNewImport" class="btn btn-primary" disabled><i class="bi bi-upload"></i> Import</button></div>
              </div>
              <div id="newSummary" class="mt-3 text-muted"></div>
            </div>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="card">
            <div class="card-body">
              <h5>Purchase Documents</h5>
              <div class="row g-2 align-items-end">
                <div class="col-8"><input type="file" id="newDoc" class="form-control" disabled></div>
                <div class="col-4 d-grid"><button id="btnNewDoc" class="btn btn-outline-secondary" disabled><i class="bi bi-paperclip"></i> Upload</button></div>
              </div>
              <div id="newDocMsg" class="mt-2 text-muted"></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const rnrFile = document.getElementById('rnrFile');
  const btnRnr = document.getElementById('btnRnrImport');
  const rnrSummary = document.getElementById('rnrSummary');
  const rnrDoc = document.getElementById('rnrDoc');
  const btnRnrDoc = document.getElementById('btnRnrDoc');
  const rnrDocMsg = document.getElementById('rnrDocMsg');

  const newFile = document.getElementById('newFile');
  const btnNew = document.getElementById('btnNewImport');
  const newSummary = document.getElementById('newSummary');
  const newDoc = document.getElementById('newDoc');
  const btnNewDoc = document.getElementById('btnNewDoc');
  const newDocMsg = document.getElementById('newDocMsg');

  let lastRnrBatchId = null;

  rnrFile.addEventListener('change', () => btnRnr.disabled = !rnrFile.files.length);
  newFile.addEventListener('change', () => btnNew.disabled = !newFile.files.length);

  btnRnr.addEventListener('click', async () => {
    const fd = new FormData(); fd.append('file', rnrFile.files[0]);
    const res = await fetch('/api/phase0/rnr/import', { method:'POST', body:fd });
    const json = await res.json();
    if(res.ok){
      lastRnrBatchId = json.batchId; rnrDoc.disabled = true; btnRnrDoc.disabled = true;
      rnrSummary.textContent = `Imported: ${json.added} / ${json.total} (duplicates: ${json.duplicates}, invalid: ${json.invalid})`;
      rnrDoc.disabled = false; btnRnrDoc.disabled = false;
    } else { rnrSummary.textContent = 'Import failed: ' + (json?.message || res.statusText); }
  });

  btnRnrDoc.addEventListener('click', async () => {
    if(!lastRnrBatchId){ rnrDocMsg.textContent = 'Import first to get a batchId.'; return; }
    const fd = new FormData(); fd.append('file', rnrDoc.files[0]);
    const res = await fetch(`/api/phase0/rnr/documents?batchId=${lastRnrBatchId}`, { method:'POST', body:fd });
    const json = await res.json();
    rnrDocMsg.textContent = res.ok ? `Uploaded: ${json.fileName}` : 'Upload failed';
  });

  btnNew.addEventListener('click', async () => {
    const fd = new FormData(); fd.append('file', newFile.files[0]);
    const res = await fetch('/api/phase0/new/import', { method:'POST', body:fd });
    const json = await res.json();
    newSummary.textContent = res.ok ? `Imported: ${json.added} / ${json.total} (duplicates: ${json.duplicates}, invalid: ${json.invalid})` : 'Import failed';
    newDoc.disabled = !res.ok; btnNewDoc.disabled = !res.ok;
  });

  btnNewDoc.addEventListener('click', async () => {
    const fd = new FormData(); fd.append('file', newDoc.files[0]);
    const res = await fetch('/api/phase0/new/documents', { method:'POST', body:fd });
    const json = await res.json();
    newDocMsg.textContent = res.ok ? `Uploaded: ${json.fileName}` : 'Upload failed';
  });
</script>
</body>
</html>
