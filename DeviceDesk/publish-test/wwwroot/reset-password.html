<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeviceDesk - Set Your Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-reset {
            max-width: 480px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .brand-header {
            background: linear-gradient(135deg, #0DCAF0 0%, #17A2B8 100%);
            color: white;
            border-radius: 12px 12px 0 0;
            padding: 1.25rem 1.5rem;
        }
    </style>
</head>
<body>
    <div class="card card-reset">
        <div class="brand-header">
            <h5 class="mb-0"><i class="bi bi-box-seam"></i> DeviceDesk</h5>
        </div>
        <div class="card-body">
            <h4 class="card-title mb-3">Set your password</h4>
            <p class="text-muted small mb-4">Create your password to activate your DeviceDesk account.</p>

            <form id="resetForm">
                <input type="hidden" id="userId">
                <input type="hidden" id="token">

                <div class="mb-3">
                    <label class="form-label">New password</label>
                    <input type="password" id="password" class="form-control" required autocomplete="new-password">
                </div>
                <div class="mb-3">
                    <label class="form-label">Confirm password</label>
                    <input type="password" id="confirmPassword" class="form-control" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-primary w-100">Save password</button>
                <div id="message" class="mt-3 small"></div>
            </form>
        </div>
    </div>

    <script>
        // Read query params and populate hidden inputs
        const params = new URLSearchParams(window.location.search);
        document.getElementById("userId").value = params.get("userId") || "";
        document.getElementById("token").value = params.get("token") || "";

        const form = document.getElementById('resetForm');
        const msg = document.getElementById('message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            msg.className = 'mt-3 small';
            msg.textContent = '';

            const userId = document.getElementById('userId').value;
            const token = document.getElementById('token').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!userId || !token) {
                msg.classList.add('text-danger');
                msg.textContent = 'Invalid or missing reset link parameters.';
                return;
            }

            if (password !== confirmPassword) {
                msg.classList.add('text-danger');
                msg.textContent = 'Passwords do not match.';
                return;
            }

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, token, password })
                });

                const data = await res.json().catch(() => ({}));

                if (res.ok) {
                    msg.classList.add('text-success');
                    msg.textContent = 'Password set successfully. You can now log in.';
                    setTimeout(() => window.location.href = '/index.html', 2000);
                } else {
                    msg.classList.add('text-danger');
                    msg.textContent = data.error || 'Failed to set password. Please try again.';
                }
            } catch (err) {
                msg.classList.add('text-danger');
                msg.textContent = 'Network error. Please try again.';
            }
        });
    </script>
</body>
</html>
