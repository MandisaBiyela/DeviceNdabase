<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Ndabase Printing Solutions - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="icon" href="/favicon.ico" />
  <style>
    body {
      background: #f4f7fb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.08);
      max-width: 1050px;
      width: 100%;
      overflow: hidden;
    }

    .login-left {
      background: #ffffff;
      padding: 48px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: left;
    }

    .login-right {
      padding: 48px 40px;
      border-left: 1px solid #e3ebf6;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .login-logo {
      max-width: 260px;
      margin-bottom: 32px;
    }

    .login-title-main {
      font-size: 28px;
      font-weight: 700;
      color: #2c7edb;
    }

    .login-subtitle {
      font-size: 14px;
      color: #8a96a3;
      margin-top: 4px;
    }

    .login-heading {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .login-caption {
      font-size: 14px;
      color: #8a96a3;
      margin-bottom: 24px;
    }

    .form-label {
      font-weight: 600;
      font-size: 14px;
    }

    .input-group-text {
      background: #f5f7fb;
      border-right: 0;
    }

    .form-control {
      border-left: 0;
      background: #f7f9fc;
    }

    .form-control:focus {
      box-shadow: 0 0 0 0.2rem rgba(48, 127, 255, 0.25);
      border-color: #2e8cfb;
    }

    .btn-login {
      width: 100%;
      margin-top: 16px;
      padding: 10px;
      font-weight: 600;
      border-radius: 6px;
      background: linear-gradient(135deg, #3f8df4, #2d81f5);
      border: none;
    }

    .btn-login i {
      margin-right: 6px;
    }

    /* Responsive – stack on smaller screens */
    @media (max-width: 992px) {
      .login-card {
        max-width: 600px;
      }
      .login-right {
        border-left: none;
        border-top: 1px solid #e3ebf6;
      }
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card row g-0">
      <!-- LEFT SIDE -->
      <div class="login-left col-lg-6 col-md-5">
        <img src="/img/ndabase-full-logo.png" alt="Ndabase Printing Solutions" class="login-logo" />
        <h1 class="login-title-main">Ndabase Printing Solutions</h1>
        <p class="login-subtitle">Device Tracking & Management System</p>
      </div>

      <!-- RIGHT SIDE -->
      <div class="login-right col-lg-6 col-md-7">
        <h2 class="login-heading">Welcome Back</h2>
        <p class="login-caption">Please login to your account</p>

        <div id="alert" class="alert d-none" role="alert"></div>
        <form id="loginForm">
          <!-- Email -->
          <div class="mb-3">
            <label class="form-label" for="email">Email Address</label>
            <div class="input-group">
              <span class="input-group-text">
                <i class="bi bi-envelope"></i>
              </span>
              <input type="email"
                     class="form-control"
                     id="email"
                     name="Email"
                     placeholder="you@ndabaseprinting.co.za"
                     required />
            </div>
          </div>

          <!-- Password -->
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <div class="input-group">
              <span class="input-group-text">
                <i class="bi bi-lock-fill"></i>
              </span>
              <input type="password"
                     class="form-control"
                     id="password"
                     name="Password"
                     placeholder="Enter your password"
                     required />
            </div>
          </div>

          <!-- Login button -->
          <button id="btnLogin" type="submit" class="btn btn-primary btn-login">
            <span class="spinner-border spinner-border-sm me-2 d-none" id="spinner"></span>
            <i class="bi bi-box-arrow-in-right"></i> Login
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    async function checkAuth() {
      try {
        const res = await fetch('/api/auth/current-user', { credentials: 'include' });
        if (res.ok) { window.location.href = '/'; }
      } catch {}
    }
    checkAuth();

    const form = document.getElementById('loginForm');
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const alertEl = document.getElementById('alert');
    const spinner = document.getElementById('spinner');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertEl.className = 'alert d-none';
      spinner.classList.remove('d-none');
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ Email: email.value.trim(), Password: password.value })
        });
        const json = await res.json().catch(() => ({}));
        if (!res.ok) {
          alertEl.textContent = json?.error || 'Invalid email or password.';
          alertEl.className = 'alert alert-danger';
        } else {
          const target = json?.redirectUrl || '/';
          window.location.href = target;
        }
      } catch (err) {
        alertEl.textContent = 'Login failed. Please try again.';
        alertEl.className = 'alert alert-danger';
      } finally {
        spinner.classList.add('d-none');
      }
    });
  </script>
</body>
</html>
