<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeviceDesk – Audit Logs</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="/css/dashboard-shell.css" />
    <link rel="stylesheet" href="/css/theme.css?v=2025" />
    <link rel="icon" href="/favicon.ico" />
</head>
<body class="app-shell" style="font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
    <aside class="app-sidebar">
        <div class="sidebar-brand-global">
            <img src="/img/ndabase-icon.png" class="sidebar-brand-icon" alt="Logo Icon">
            <div class="sidebar-brand-text">
                <span class="brand-line-1"></span>
                <span class="brand-line-2"></span>
            </div>
        </div>
        
        <!-- Profile Block -->
        <div class="sidebar-profile" id="sidebarProfile">
            <div class="profile-avatar">
                <span class="avatar-initials" id="profileInitials">U</span>
            </div>
            <div class="profile-info">
                <div class="profile-name" id="profileName">Loading...</div>
                <div class="profile-role" id="profileRole">User</div>
            </div>
        </div>
        
        <nav class="sidebar-nav">
            <span class="sidebar-section">MAIN MENU</span>
            <a href="/superadmin/dashboard.html" class="sidebar-link"><i class="bi bi-grid-fill"></i><span>Dashboard</span></a>
            <a href="/superadmin/dashboard.html#devices" class="sidebar-link"><i class="bi bi-device-hdd"></i><span>All Devices</span></a>
            <a href="/superadmin/user-management.html" class="sidebar-link"><i class="bi bi-people"></i><span>User Management</span></a>
            <a href="/superadmin/audit-logs.html" class="sidebar-link active"><i class="bi bi-journal-text"></i><span>Audit Logs</span></a>
            <a href="/superadmin/export-center.html" class="sidebar-link"><i class="bi bi-download"></i><span>Export Center</span></a>
            <span class="sidebar-section">SYSTEM</span>
            <a href="/logout" class="sidebar-link danger"><i class="bi bi-box-arrow-right"></i><span>Logout</span></a>
        </nav>
    </aside>

    <div class="app-main">
        <header class="app-header">
            <div>
                <div class="welcome-line">Audit Logs</div>
                <div class="welcome-date">System Activity Tracking</div>
            </div>
            <div class="header-right">
                <button class="btn-export" onclick="exportAuditLogs()">
                    <i class="bi bi-download"></i>
                    <span>Export</span>
                </button>
                <button class="avatar-btn"><span class="avatar-initials" id="userInitials">SA</span></button>
            </div>
        </header>

        <main class="app-content">
            <div class="mb-2">
                <div class="text-muted small">Super Admin / Audit Logs</div>
                <h1 class="h4 fw-semibold mt-1">Audit Logs</h1>
            </div>

            <!-- Filters -->
            <div class="panel mb-3">
                <div class="panel-body">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label small">User ID</label>
                            <input type="text" class="form-control form-control-sm" id="filterUserId" placeholder="Search user...">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small">Action</label>
                            <input type="text" class="form-control form-control-sm" id="filterAction" placeholder="Search action...">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label small">From Date</label>
                            <input type="date" class="form-control form-control-sm" id="filterFromDate">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label small">To Date</label>
                            <input type="date" class="form-control form-control-sm" id="filterToDate">
                        </div>
                        <div class="col-md-2 d-flex align-items-end">
                            <button class="btn btn-primary btn-sm w-100" onclick="loadAuditLogs()">
                                <i class="bi bi-search"></i> Filter
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Audit Logs Table -->
            <div class="panel">
                <div class="panel-header">
                    <span>Audit Logs</span>
                    <div>
                        <span class="text-muted small me-3" id="totalCount">Total: 0</span>
                        <button class="btn btn-sm btn-outline-primary" onclick="exportAuditLogs()">
                            <i class="bi bi-download"></i> Export
                        </button>
                    </div>
                </div>
                <div class="panel-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Timestamp</th>
                                    <th>User</th>
                                    <th>Action</th>
                                    <th>Source</th>
                                    <th>Entity/Device</th>
                                    <th>Details</th>
                                </tr>
                            </thead>
                            <tbody id="auditLogsBody">
                                <tr><td colspan="6" class="text-center">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <nav>
                        <ul class="pagination justify-content-center" id="auditPagination"></ul>
                    </nav>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentPage = 1;
        const pageSize = 50;

        document.addEventListener('DOMContentLoaded', async () => {
            await loadUserInfo();
            await loadAuditLogs();
        });

        async function loadUserInfo() {
            try {
                const res = await fetch('/api/auth/current-user');
                if (res.ok) {
                    const user = await res.json();
                    const initials = user.fullName ? user.fullName.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase() : 'SA';
                    if (document.getElementById('userInitials')) {
                        document.getElementById('userInitials').textContent = initials;
                    }
                    
                    // Update profile block
                    document.getElementById('profileInitials').textContent = initials;
                    document.getElementById('profileName').textContent = user.fullName || user.email || 'User';
                    document.getElementById('profileRole').textContent = user.role || 'Super Admin';
                }
            } catch (err) {
                console.error('Failed to load user info:', err);
            }
        }

        async function loadAuditLogs(page = 1) {
            try {
                const params = new URLSearchParams({
                    page: page.toString(),
                    pageSize: pageSize.toString()
                });

                const userId = document.getElementById('filterUserId').value.trim();
                const action = document.getElementById('filterAction').value.trim();
                const fromDate = document.getElementById('filterFromDate').value;
                const toDate = document.getElementById('filterToDate').value;

                if (userId) params.append('userId', userId);
                if (action) params.append('action', action);
                if (fromDate) params.append('fromDate', fromDate);
                if (toDate) params.append('toDate', toDate);

                const res = await fetch(`/api/superadmin/audit?${params}`, {
                    credentials: 'include'
                });
                
                if (res.ok) {
                    const data = await res.json();
                    renderAuditLogs(data);
                    currentPage = page;
                } else {
                    const error = await res.json().catch(() => ({ error: 'Failed to load audit logs' }));
                    console.error('API error:', error);
                    document.getElementById('auditLogsBody').innerHTML = 
                        `<tr><td colspan="6" class="text-center text-danger">Error: ${error.error || 'Failed to load audit logs'}</td></tr>`;
                }
            } catch (err) {
                console.error('Failed to load audit logs:', err);
                document.getElementById('auditLogsBody').innerHTML = 
                    `<tr><td colspan="6" class="text-center text-danger">Error: ${err.message}</td></tr>`;
            }
        }

        function renderAuditLogs(data) {
            const tbody = document.getElementById('auditLogsBody');
            const total = data.total || 0;
            document.getElementById('totalCount').textContent = `Total: ${total.toLocaleString()}`;

            if (data.items && data.items.length > 0) {
                tbody.innerHTML = data.items.map(log => {
                    const timestamp = log.timestamp ? new Date(log.timestamp).toLocaleString('en-ZA', {
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit',
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit'
                    }) : '-';
                    
                    const userDisplay = log.userId || '-';
                    const actionDisplay = log.action || '-';
                    const deviceDisplay = log.deviceSerial || (log.deviceId ? `Device #${log.deviceId}` : '-');
                    const detailsDisplay = log.details || '-';
                    
                    // Color code actions
                    let actionBadgeClass = 'bg-secondary';
                    if (actionDisplay.toLowerCase().includes('scan')) actionBadgeClass = 'bg-primary';
                    else if (actionDisplay.toLowerCase().includes('pass') || actionDisplay.toLowerCase().includes('approve')) actionBadgeClass = 'bg-success';
                    else if (actionDisplay.toLowerCase().includes('fail') || actionDisplay.toLowerCase().includes('reject')) actionBadgeClass = 'bg-danger';
                    else if (actionDisplay.toLowerCase().includes('update') || actionDisplay.toLowerCase().includes('edit')) actionBadgeClass = 'bg-warning';
                    
                    return `
                        <tr>
                            <td><small class="text-muted">${timestamp}</small></td>
                            <td>
                                <div class="fw-semibold">${userDisplay}</div>
                            </td>
                            <td><span class="badge ${actionBadgeClass}">${actionDisplay}</span></td>
                            <td><span class="badge bg-info">Phase 2</span></td>
                            <td><code class="text-primary">${deviceDisplay}</code></td>
                            <td class="text-truncate" style="max-width: 300px;" title="${detailsDisplay.replace(/"/g, '&quot;')}">${detailsDisplay}</td>
                        </tr>
                    `;
                }).join('');
            } else {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">No audit logs found matching your filters</td></tr>';
            }

            // Pagination
            const pagination = document.getElementById('auditPagination');
            const totalPages = data.totalPages || 1;
            
            if (totalPages > 1) {
                let paginationHtml = '';
                
                // Previous button
                if (data.page > 1) {
                    paginationHtml += `
                        <li class="page-item">
                            <a class="page-link" href="#" onclick="loadAuditLogs(${data.page - 1}); return false;">Previous</a>
                        </li>
                    `;
                }
                
                // Page numbers (show max 10 pages)
                const startPage = Math.max(1, data.page - 4);
                const endPage = Math.min(totalPages, startPage + 9);
                
                for (let i = startPage; i <= endPage; i++) {
                    paginationHtml += `
                        <li class="page-item ${i === data.page ? 'active' : ''}">
                            <a class="page-link" href="#" onclick="loadAuditLogs(${i}); return false;">${i}</a>
                        </li>
                    `;
                }
                
                // Next button
                if (data.page < totalPages) {
                    paginationHtml += `
                        <li class="page-item">
                            <a class="page-link" href="#" onclick="loadAuditLogs(${data.page + 1}); return false;">Next</a>
                        </li>
                    `;
                }
                
                pagination.innerHTML = paginationHtml;
            } else {
                pagination.innerHTML = '';
            }
        }

        async function exportAuditLogs() {
            try {
                const params = new URLSearchParams();
                const userId = document.getElementById('filterUserId').value.trim();
                const action = document.getElementById('filterAction').value.trim();
                const fromDate = document.getElementById('filterFromDate').value;
                const toDate = document.getElementById('filterToDate').value;

                if (userId) params.append('userId', userId);
                if (action) params.append('action', action);
                if (fromDate) params.append('fromDate', fromDate);
                if (toDate) params.append('toDate', toDate);

                // Show loading indicator
                const exportBtn = event?.target || document.querySelector('button[onclick="exportAuditLogs()"]');
                const originalText = exportBtn?.innerHTML;
                if (exportBtn) {
                    exportBtn.disabled = true;
                    exportBtn.innerHTML = '<i class="bi bi-hourglass-split"></i> Exporting...';
                }

                const res = await fetch(`/api/superadmin/export/audit?${params}`, {
                    credentials: 'include'
                });
                
                if (res.ok) {
                    const blob = await res.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    const timestamp = new Date().toISOString().slice(0, 19).replace(/:/g, '-');
                    a.download = `audit_export_${timestamp}.csv`;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    document.body.removeChild(a);
                    
                    // Show success message
                    const successMsg = document.createElement('div');
                    successMsg.className = 'alert alert-success alert-dismissible fade show position-fixed top-0 end-0 m-3';
                    successMsg.style.zIndex = '9999';
                    successMsg.innerHTML = `
                        <i class="bi bi-check-circle"></i> Export completed successfully!
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    `;
                    document.body.appendChild(successMsg);
                    setTimeout(() => successMsg.remove(), 3000);
                } else {
                    const error = await res.json().catch(() => ({ error: 'Failed to export audit logs' }));
                    alert(`Export failed: ${error.error || 'Unknown error'}`);
                }
                
                if (exportBtn) {
                    exportBtn.disabled = false;
                    exportBtn.innerHTML = originalText || '<i class="bi bi-download"></i> Export';
                }
            } catch (err) {
                console.error('Export failed:', err);
                alert(`Failed to export audit logs: ${err.message}`);
            }
        }

        function showDevicesTable() {
            window.location.href = '/superadmin/dashboard.html';
        }
    </script>
</body>
</html>
