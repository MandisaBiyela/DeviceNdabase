<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>New Stock · Batch</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="/css/dashboard-shell.css" />
  <link rel="stylesheet" href="css/phase0.css" />
  
</head>
<body class="app-shell">
<aside class="app-sidebar" id="phase0Sidebar"></aside>
<div class="app-main">
<header class="app-header"><div><div class="welcome-line">Phase 0 · NEW</div><div class="welcome-date">Batch Items</div></div><div class="header-right"><button class="avatar-btn"><span class="avatar-initials">P0</span></button></div></header>
<main class="app-content">
  <div class="container my-4">
    <div id="alert" class="alert d-none"></div>

    <div class="d-flex flex-wrap gap-2 align-items-end">
      <div>
        <label class="form-label">Search</label>
        <input id="q" type="text" class="form-control" placeholder="Serial / IMEI / Brand / Model">
      </div>
      <div>
        <label class="form-label">Page size</label>
        <select id="pageSize" class="form-select">
          <option>10</option><option selected>25</option><option>50</option><option>100</option>
        </select>
      </div>
      <div class="ms-auto">
        <button id="refreshBtn" class="btn btn-primary">Refresh</button>
        <a id="exportBtn" href="#" class="btn btn-success">Export to Excel</a>
        <a id="backBtn" href="new.html" class="btn btn-outline-secondary">Back</a>
      </div>
    </div>
  </div>

  <div class="row mt-3 g-3">
    <div class="col-md-3"><div class="card"><div class="card-body"><div class="text-muted">Devices</div><div id="statTotal" class="h4 mb-0">—</div></div></div></div>
    <div class="col-md-3"><div class="card"><div class="card-body"><div class="text-muted">Total Qty</div><div id="statQty" class="h4 mb-0">—</div></div></div></div>
    <div class="col-md-3"><div class="card"><div class="card-body"><div class="text-muted">Brands</div><div id="statBrands" class="h4 mb-0">—</div></div></div></div>
    <div class="col-md-3"><div class="card"><div class="card-body"><div class="text-muted">Models</div><div id="statModels" class="h4 mb-0">—</div></div></div></div>
  </div>

  <div class="card mt-3">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover table-sm mb-0 align-middle">
          <thead class="table-light">
            <tr>
              <th>#</th><th>Serial</th><th>IMEI</th><th>Brand</th><th>Model</th><th class="text-end">Qty</th><th>EMIS</th><th class="text-nowrap">Added</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <nav class="d-flex justify-content-between align-items-center mt-3">
    <div id="pagerText" class="text-muted small">—</div>
    <ul id="pager" class="pagination mb-0"></ul>
  </nav>
</div>

 

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/phase0.api.js"></script>
<script src="js/sidebar.js"></script>
<script>
const { API_BASE, fetchJson } = PHASE0;
const rowsEl = document.getElementById('rows');
const pagerEl = document.getElementById('pager');
const pagerText = document.getElementById('pagerText');
const statTotal = document.getElementById('statTotal');
const statQty = document.getElementById('statQty');
const statBrands = document.getElementById('statBrands');
const statModels = document.getElementById('statModels');
const alertEl = document.getElementById('alert');

const qs = new URLSearchParams(location.search);
const batchId = qs.get('batchId');

let page = 1;
function say(msg, type='info'){ alertEl.className='alert alert-'+type; alertEl.textContent=msg; alertEl.classList.remove('d-none'); }

async function load(){
  if(!batchId){ say('Missing batchId', 'danger'); return; }
  const pageSize = parseInt(document.getElementById('pageSize').value,10);
  const q = document.getElementById('q').value.trim();
  const url = `${API_BASE}/batches/${batchId}/items?page=${page}&pageSize=${pageSize}${q?`&q=${encodeURIComponent(q)}`:''}`;
  try {
    const data = await fetchJson(url);

    // Stats
    statTotal.textContent = data.total;
    statQty.textContent = data.total;
    statBrands.textContent = (data.stats && data.stats.brands) ?? '—';
    statModels.textContent = (data.stats && data.stats.models) ?? '—';

    // Rows
    rowsEl.innerHTML = '';
    const start = (data.page-1)*data.pageSize;
    (data.rows || []).forEach((r,i)=>{
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${start+i+1}</td>
        <td>${r.serial ?? ''}</td>
        <td>${r.imei ?? ''}</td>
        <td>${r.brand ?? ''}</td>
        <td>${r.model ?? ''}</td>
        <td class=\"text-end\">${r.qty}</td>
        <td>${r.emis ?? ''}</td>
        <td>${new Date(r.importedAt || r.createdAt).toLocaleString()}</td>`;
      rowsEl.appendChild(tr);
    });

    // Pager
    const pages = Math.max(1, Math.ceil(data.total / data.pageSize));
    pagerEl.innerHTML = '';
    pagerText.textContent = `Page ${data.page} of ${pages}`;
    const make = (n, label=n) => {
      const li = document.createElement('li');
      li.className = 'page-item'+(n===page?' active':'');
      const a = document.createElement('a'); a.className='page-link'; a.href='#'; a.textContent=label;
      a.onclick = (e)=>{ e.preventDefault(); page=n; load(); };
      li.appendChild(a); return li;
    };
    const prev = Math.max(1, page-1), next = Math.min(pages, page+1);
    pagerEl.appendChild(make(prev, '«'));
    for(let i=Math.max(1,page-2); i<=Math.min(pages,page+2); i++) pagerEl.appendChild(make(i));
    pagerEl.appendChild(make(next, '»'));
  } catch (e) {
    say(e.message || 'Failed to load batch items', 'danger');
  }
}

// Events
 document.getElementById('refreshBtn').onclick = ()=>{ page=1; load(); };
 document.getElementById('pageSize').onchange = ()=>{ page=1; load(); };
 document.getElementById('q').onkeyup = (e)=>{ if(e.key==='Enter'){ page=1; load(); }};
 document.getElementById('exportBtn').onclick = (e)=>{ 
   e.preventDefault(); 
   if(batchId) window.open(`${API_BASE}/batches/${batchId}/export`, '_blank'); 
 };

// Init
load();
</script>
 
</body>

<script>
async function logout(){
  try{ await fetch('/api/auth/logout', { method:'POST' }); }
  finally{ window.location.href = '/login.html?logout=1'; }
}
</script>
</html>
