<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Close-Out Report — Dispatch</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/dashboard-shell.css" />
    <link rel="stylesheet" href="/css/theme.css?v=2025" />
    <style>
        .pill-balanced { background:#d1f7e6; color:#0a7d4d; padding:.15rem .55rem; border-radius:999px; font-size:.75rem; font-weight:600; }
        .pill-unbalanced { background:#fff3cd; color:#7a5d00; padding:.15rem .55rem; border-radius:999px; font-size:.75rem; font-weight:600; }
        .pill-overpaid { background:#f8d7da; color:#842029; padding:.15rem .55rem; border-radius:999px; font-size:.75rem; font-weight:600; }
        .report-card { background:#fff; border:1px solid #e6e9ef; border-radius:14px; padding:1.25rem; }
        .report-card + .report-card { margin-top:1rem; }
        .report-meta { color:#5c6573; font-size:.85rem; }
        .navy { color:#1F4E79; }
    </style>
</head>
<body class="app-shell">
    <aside class="app-sidebar">
        <div class="sidebar-brand-global">
            <img src="/img/ndabase-icon.png" class="sidebar-brand-icon" alt="Logo" />
        </div>

        <div class="sidebar-profile" id="sidebarProfile">
            <div class="profile-avatar">
                <span class="avatar-initials" id="profileInitials">U</span>
            </div>
            <div class="profile-info">
                <div class="profile-name" id="profileName">Loading...</div>
                <div class="profile-role" id="profileRole">User</div>
            </div>
        </div>

        <nav class="sidebar-nav">
            <span class="sidebar-section">DISPATCH WORKFLOW</span>
            <a href="/dispatch/preparation.html" class="sidebar-link">
                <i class="bi bi-box-seam"></i><span>Preparation</span>
            </a>
            <a href="/dispatch/pod-management.html" class="sidebar-link">
                <i class="bi bi-file-earmark-text"></i><span>POD Management</span>
            </a>
            <a href="/dispatch/transport.html" class="sidebar-link">
                <i class="bi bi-truck"></i><span>Transport</span>
            </a>
            <a href="/dispatch/debriefing.html" class="sidebar-link">
                <i class="bi bi-clipboard-check"></i><span>Debriefing</span>
            </a>
            <a href="/dispatch/signoff.html" class="sidebar-link">
                <i class="bi bi-pen"></i><span>Sign-Off</span>
            </a>
            <span class="sidebar-section">REPORTS</span>
            <a href="/dispatch/close-out-report.html" class="sidebar-link active">
                <i class="bi bi-file-earmark-word"></i><span>Close-Out Report</span>
            </a>
            <span class="sidebar-section">SYSTEM</span>
            <a href="/logout" class="sidebar-link danger">
                <i class="bi bi-box-arrow-right"></i><span>Logout</span>
            </a>
        </nav>
    </aside>

    <div class="app-main">
        <header class="app-header">
            <div>
                <div class="welcome-line">Phase 3 – Dispatch</div>
                <div class="welcome-date">Close-Out &amp; Financial Report</div>
            </div>
            <div class="header-right">
                <span class="text-muted small" id="userDisplay"></span>
            </div>
        </header>

        <main class="app-content">
            <div class="container-fluid my-4" style="max-width: 1100px;">
                <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-3">
                    <div>
                        <h4 class="navy mb-1"><i class="bi bi-file-earmark-word"></i> Close-Out &amp; Financial Report</h4>
                        <p class="text-muted mb-0">Generate the KZN MST/ICT Close-Out report for any procurement order.</p>
                    </div>
                    <button class="btn btn-outline-primary btn-sm" onclick="loadOrders()">
                        <i class="bi bi-arrow-clockwise"></i> Refresh
                    </button>
                </div>

                <div class="report-card mb-3">
                    <div class="row g-2">
                        <div class="col-md-5">
                            <label class="form-label small text-muted mb-1">Search PO / project</label>
                            <input type="text" class="form-control form-control-sm" id="filterText" placeholder="PO number or project name" oninput="renderRows()" />
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small text-muted mb-1">Financial year</label>
                            <select class="form-select form-select-sm" id="filterFy" onchange="renderRows()">
                                <option value="">All years</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small text-muted mb-1">Status</label>
                            <select class="form-select form-select-sm" id="filterStatus" onchange="renderRows()">
                                <option value="">All</option>
                                <option value="Balanced">Balanced only</option>
                                <option value="Outstanding">Outstanding only</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div id="alert"></div>
                <div id="rows">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        let allOrders = [];

        document.addEventListener('DOMContentLoaded', async () => {
            await loadCurrentUser();
            await loadOrders();
        });

        async function loadCurrentUser() {
            try {
                const r = await fetch('/api/auth/current-user', { credentials: 'include' });
                if (!r.ok) return;
                const u = await r.json();
                document.getElementById('userDisplay').textContent = u.fullName || u.email || '';
                const initials = u.fullName ? u.fullName.split(' ').map(n => n[0]).join('').substring(0,2).toUpperCase() : 'U';
                document.getElementById('profileInitials').textContent = initials;
                document.getElementById('profileName').textContent = u.fullName || u.email || 'User';
                document.getElementById('profileRole').textContent = u.role || 'User';
            } catch {}
        }

        function fmtMoney(v) {
            const n = Number(v || 0);
            return 'R ' + n.toLocaleString('en-ZA', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function escape(s) {
            const d = document.createElement('div');
            d.textContent = s == null ? '' : String(s);
            return d.innerHTML;
        }

        function safeFilePart(s) {
            return String(s || '').replace(/[\\/:*?"<>|]/g, '_').trim() || 'order';
        }

        function statusPill(row) {
            const fin = String(row.financialBalanceStatus || '').toLowerCase() === 'balanced';
            const ob = Number(row.outstandingBalance || 0);
            if (fin && ob === 0) return '<span class="pill-balanced">Balanced</span>';
            if (ob < 0) return '<span class="pill-overpaid">Overpaid</span>';
            if (!row.isBalanced) return '<span class="pill-unbalanced">School totals</span>';
            return '<span class="pill-unbalanced">Outstanding</span>';
        }

        async function loadOrders() {
            const host = document.getElementById('rows');
            host.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>';
            try {
                const r = await fetch('/api/phase0/orders', { credentials: 'include' });
                if (r.status === 401) {
                    host.innerHTML = '<div class="alert alert-warning">Your session has expired. <a href="/login.html">Please sign in again.</a></div>';
                    return;
                }
                if (!r.ok) throw new Error('Failed to load orders');
                allOrders = await r.json();
                allOrders.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

                // Populate FY filter
                const fySet = new Set(allOrders.map(o => o.financialYear).filter(Boolean));
                const sel = document.getElementById('filterFy');
                sel.innerHTML = '<option value="">All years</option>' +
                    [...fySet].sort().map(fy => `<option value="${escape(fy)}">${escape(fy)}</option>`).join('');

                renderRows();
            } catch (e) {
                host.innerHTML = `<div class="alert alert-danger">${escape(e.message || 'Failed to load orders.')}</div>`;
            }
        }

        function renderRows() {
            const host = document.getElementById('rows');
            const filterText = (document.getElementById('filterText').value || '').toLowerCase().trim();
            const filterFy = document.getElementById('filterFy').value;
            const filterStatus = document.getElementById('filterStatus').value;

            let list = allOrders.slice();
            if (filterText) {
                list = list.filter(o =>
                    (o.poNumber || '').toLowerCase().includes(filterText) ||
                    (o.projectName || '').toLowerCase().includes(filterText)
                );
            }
            if (filterFy) list = list.filter(o => o.financialYear === filterFy);
            if (filterStatus === 'Balanced') list = list.filter(o => String(o.financialBalanceStatus).toLowerCase() === 'balanced' && Number(o.outstandingBalance) === 0);
            if (filterStatus === 'Outstanding') list = list.filter(o => String(o.financialBalanceStatus).toLowerCase() !== 'balanced' || Number(o.outstandingBalance) !== 0);

            if (list.length === 0) {
                host.innerHTML = '<div class="alert alert-info"><i class="bi bi-info-circle"></i> No procurement orders match the filters.</div>';
                return;
            }

            host.innerHTML = list.map(o => `
                <div class="report-card">
                    <div class="d-flex flex-wrap justify-content-between align-items-start gap-2">
                        <div>
                            <div class="fw-bold navy">${escape(o.poNumber)}</div>
                            <div class="report-meta">${escape(o.projectName)}</div>
                            <div class="report-meta">FY ${escape(o.financialYear)} · ${(o.schools || []).length} school(s)</div>
                        </div>
                        <div class="text-end">
                            <div class="report-meta">Total order value</div>
                            <div class="fw-semibold">${escape(fmtMoney(o.totalOrderValue))}</div>
                            <div class="mt-1">${statusPill(o)}</div>
                        </div>
                    </div>
                    <div class="row g-3 mt-2 small">
                        <div class="col-md-3">
                            <div class="text-muted">School totals</div>
                            <div class="fw-semibold">${escape(fmtMoney(o.schoolTotals))}</div>
                        </div>
                        <div class="col-md-3">
                            <div class="text-muted">Invoiced</div>
                            <div class="fw-semibold">${escape(fmtMoney(o.totalInvoicedToDepartment))}</div>
                        </div>
                        <div class="col-md-3">
                            <div class="text-muted">Paid to suppliers</div>
                            <div class="fw-semibold">${escape(fmtMoney(o.totalPaidToSuppliers))}</div>
                        </div>
                        <div class="col-md-3">
                            <div class="text-muted">Outstanding</div>
                            <div class="fw-semibold">${escape(fmtMoney(o.outstandingBalance))}</div>
                        </div>
                    </div>
                    <div class="d-flex justify-content-end gap-2 mt-3">
                        <button class="btn btn-outline-secondary btn-sm" onclick="window.location.href='/phase0/order-detail.html?id=${encodeURIComponent(o.id)}'">
                            <i class="bi bi-eye"></i> View details
                        </button>
                        <button class="btn btn-primary btn-sm" onclick="downloadReport('${o.id}', '${escape(o.poNumber)}', '${escape(o.financialYear)}', this)">
                            <i class="bi bi-file-earmark-word"></i> Generate Report
                        </button>
                    </div>
                    <div class="alert alert-danger small mt-2 mb-0 d-none" data-err="${o.id}"></div>
                </div>
            `).join('');
        }

        async function downloadReport(id, poNumber, financialYear, btn) {
            const errEl = document.querySelector(`[data-err="${id}"]`);
            if (errEl) errEl.classList.add('d-none');
            const originalHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Generating…';
            try {
                const res = await fetch(`/api/phase0/orders/${encodeURIComponent(id)}/close-out-report`, {
                    credentials: 'include'
                });
                if (!res.ok) {
                    const ct = res.headers.get('content-type') || '';
                    let msg = res.statusText;
                    if (ct.includes('application/json')) {
                        try {
                            const data = await res.json();
                            if (Array.isArray(data.errors)) {
                                msg = data.errors.map(e => e.message || e.field).filter(Boolean).join('; ') || msg;
                            } else {
                                msg = data.details || data.message || data.error || msg;
                            }
                        } catch {}
                    }
                    throw new Error(msg);
                }
                const blob = await res.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `CloseOut_${safeFilePart(poNumber)}_${safeFilePart(financialYear)}.docx`;
                a.rel = 'noopener';
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);
            } catch (e) {
                if (errEl) {
                    errEl.textContent = e.message || 'Report generation failed.';
                    errEl.classList.remove('d-none');
                } else {
                    alert(e.message || 'Report generation failed.');
                }
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalHtml;
            }
        }
    </script>
</body>
</html>
