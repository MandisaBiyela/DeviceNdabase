<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase 3 – Dispatch</title>
</head>
<body>
    <p>Checking access and redirecting to Dispatch Queue…</p>
    <p>If nothing happens, you may be redirected to the login page.</p>
    <script>
        async function initDispatchHome() {
            try {
                const res = await fetch('/api/auth/current-user', {
                    credentials: 'include'
                });
                
                if (!res.ok) {
                    window.location.href = '/login.html?returnUrl=/dispatch/index.html';
                    return;
                }

                const user = await res.json().catch(() => null);
                if (!user) {
                    window.location.href = '/login.html?returnUrl=/dispatch/index.html';
                    return;
                }

                const roles = Array.isArray(user.roles) ? user.roles : [];
                const isDispatchUser = roles.some((r) =>
                    ['DispatchClerk', 'DispatchDriver', 'DispatchQA', 'DispatchManager'].includes(r)
                );

                if (!isDispatchUser) {
                    window.location.href = '/';
                    return;
                }

                window.location.href = '/dispatch/dispatch-queue.html';
            } catch (err) {
                console.error('Error in Phase 3 index guard:', err);
                window.location.href = '/login.html?returnUrl=/dispatch/index.html';
            }
        }
        document.addEventListener('DOMContentLoaded', initDispatchHome);
    </script>
</body>
</html>
