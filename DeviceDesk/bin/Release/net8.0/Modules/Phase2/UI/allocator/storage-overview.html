<div class="container-fluid py-4">
    <h2 class="mb-3">Storage Overview</h2>
    <small class="text-muted d-block mb-3">
        Physical storage zones in the ICT centre and how many devices are currently stored there.
    </small>
    
    <!-- Filters and Summary -->
    <div class="card shadow-sm mb-3">
        <div class="card-body">
            <div class="row mb-3">
                <div class="col-md-4">
                    <label for="schoolFilter" class="form-label">Filter by School</label>
                    <select class="form-select" id="schoolFilter">
                        <option value="">Show All Schools</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="sortBy" class="form-label">Sort By</label>
                    <select class="form-select" id="sortBy">
                        <option value="building">Building</option>
                        <option value="room">Room</option>
                        <option value="rack">Rack</option>
                        <option value="shelf">Shelf</option>
                        <option value="bin">Bin</option>
                        <option value="count">Device Count</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">&nbsp;</label>
                    <div>
                        <button type="button" class="btn btn-outline-secondary" id="clearFiltersBtn">
                            <i class="bi bi-x-circle"></i> Clear Filters
                        </button>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-3">
                    <strong>Total Locations:</strong> <span id="totalLocations">0</span>
                </div>
                <div class="col-md-3">
                    <strong>Total Devices:</strong> <span id="totalDevices">0</span>
                </div>
                <div class="col-md-3">
                    <strong>Unique Schools:</strong> <span id="uniqueSchools">0</span>
                </div>
                <div class="col-md-3">
                    <strong>Filtered Devices:</strong> <span id="filteredDevices">0</span>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-sm table-striped align-middle" id="overviewTable">
                    <thead>
                        <tr>
                            <th style="width: 30px;"></th>
                            <th>Building</th>
                            <th>Room</th>
                            <th>Rack</th>
                            <th>Shelf</th>
                            <th>Bin</th>
                            <th class="text-end">Devices</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <div id="overviewEmptyState" class="text-center text-muted py-4 d-none">
                No devices currently stored.
            </div>
        </div>
    </div>
</div>

<style>
    .expand-icon {
        cursor: pointer;
        user-select: none;
        font-size: 0.9em;
        color: #666;
    }
    .expand-icon:hover {
        color: #000;
    }
    .device-detail-row {
        background-color: #f8f9fa;
    }
    .device-detail-row td {
        padding-left: 50px !important;
        font-size: 0.9em;
    }
    .device-detail-row td:first-child {
        padding-left: 50px !important;
    }
</style>

<script>
(function() {
    'use strict';
    const apiBase = '/api/phase2/allocation';
    let allData = [];
    let expandedRows = new Set();

    function showLoading() {
        const tbody = document.querySelector('#overviewTable tbody');
        if (tbody) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4"><div class="spinner-border spinner-border-sm me-2"></div>Loading...</td></tr>';
        }
        const empty = document.getElementById('overviewEmptyState');
        if (empty) {
            empty.classList.add('d-none');
        }
    }

    function showError(message) {
        const tbody = document.querySelector('#overviewTable tbody');
        if (tbody) {
            tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger py-4"><i class="bi bi-exclamation-triangle me-2"></i>${message}</td></tr>`;
        }
        const empty = document.getElementById('overviewEmptyState');
        if (empty) {
            empty.classList.add('d-none');
        }
    }

    function toggleRow(locationKey) {
        if (expandedRows.has(locationKey)) {
            expandedRows.delete(locationKey);
        } else {
            expandedRows.add(locationKey);
        }
        renderTable(allData);
    }

    function getLocationKey(location) {
        return `${location.building || ''}|${location.room || ''}|${location.rack || ''}|${location.shelf || ''}|${location.bin || ''}`;
    }

    function renderTable(data) {
        const tbody = document.querySelector('#overviewTable tbody');
        const empty = document.getElementById('overviewEmptyState');
        if (!tbody) return;

        tbody.innerHTML = '';

        if (!data || data.length === 0) {
            if (empty) {
                empty.classList.remove('d-none');
            }
            return;
        }

        if (empty) {
            empty.classList.add('d-none');
        }

        data.forEach(location => {
            const locationKey = getLocationKey(location);
            const isExpanded = expandedRows.has(locationKey);
            
            // Main location row
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="expand-icon" onclick="window.toggleStorageRow('${locationKey}')">
                    <i class="bi bi-chevron-${isExpanded ? 'down' : 'right'}"></i>
                </td>
                <td>${location.building || '-'}</td>
                <td>${location.room || '-'}</td>
                <td>${location.rack || '-'}</td>
                <td>${location.shelf || '-'}</td>
                <td>${location.bin || '-'}</td>
                <td class="text-end">
                    <span class="badge bg-primary">${location.deviceCount ?? 0}</span>
                </td>
            `;
            tbody.appendChild(tr);

            // Device detail rows (if expanded)
            if (isExpanded && location.devices && location.devices.length > 0) {
                location.devices.forEach(device => {
                    const detailTr = document.createElement('tr');
                    detailTr.className = 'device-detail-row';
                    detailTr.innerHTML = `
                        <td></td>
                        <td colspan="5">
                            <strong>Serial:</strong> ${device.serial || 'N/A'} | 
                            <strong>School:</strong> ${device.schoolName || 'No School Linked'}
                        </td>
                        <td></td>
                    `;
                    tbody.appendChild(detailTr);
                });
            }
        });
    }

    function updateSummary(data) {
        const totalDevices = data.reduce((sum, item) => sum + (item.deviceCount || 0), 0);
        const uniqueSchools = new Set();
        data.forEach(location => {
            if (location.devices) {
                location.devices.forEach(device => {
                    if (device.schoolName && device.schoolName !== 'No School Linked') {
                        uniqueSchools.add(device.schoolName);
                    }
                });
            }
        });

        const totalLocationsEl = document.getElementById('totalLocations');
        const totalDevicesEl = document.getElementById('totalDevices');
        const uniqueSchoolsEl = document.getElementById('uniqueSchools');
        const filteredDevicesEl = document.getElementById('filteredDevices');

        if (totalLocationsEl) totalLocationsEl.textContent = data.length;
        if (totalDevicesEl) totalDevicesEl.textContent = totalDevices;
        if (uniqueSchoolsEl) uniqueSchoolsEl.textContent = uniqueSchools.size;
        if (filteredDevicesEl) filteredDevicesEl.textContent = totalDevices;
    }

    function updateSchoolFilter(data) {
        const schoolFilter = document.getElementById('schoolFilter');
        if (!schoolFilter) return;

        const schools = new Set();
        data.forEach(location => {
            if (location.devices) {
                location.devices.forEach(device => {
                    if (device.schoolName && device.schoolName !== 'No School Linked') {
                        schools.add(device.schoolName);
                    }
                });
            }
        });

        const currentValue = schoolFilter.value;
        schoolFilter.innerHTML = '<option value="">Show All Schools</option>';
        Array.from(schools).sort().forEach(school => {
            const option = document.createElement('option');
            option.value = school;
            option.textContent = school;
            schoolFilter.appendChild(option);
        });
        schoolFilter.value = currentValue;
    }

    function filterAndSortData(data) {
        let filtered = [...data];
        const schoolFilter = document.getElementById('schoolFilter');
        const sortBy = document.getElementById('sortBy');

        // Filter by school
        if (schoolFilter && schoolFilter.value) {
            const selectedSchool = schoolFilter.value;
            filtered = filtered.map(location => {
                const filteredDevices = location.devices?.filter(device => 
                    device.schoolName === selectedSchool
                ) || [];
                return {
                    ...location,
                    devices: filteredDevices,
                    deviceCount: filteredDevices.length
                };
            }).filter(location => location.deviceCount > 0);
        }

        // Sort
        if (sortBy && sortBy.value) {
            const sortField = sortBy.value;
            filtered.sort((a, b) => {
                if (sortField === 'count') {
                    return (b.deviceCount || 0) - (a.deviceCount || 0);
                }
                const aVal = a[sortField] || '';
                const bVal = b[sortField] || '';
                return aVal.localeCompare(bVal);
            });
        }

        return filtered;
    }

    function applyFilters() {
        const filtered = filterAndSortData(allData);
        renderTable(filtered);
        updateSummary(filtered);
    }

    // Expose toggle function globally for onclick
    window.toggleStorageRow = function(locationKey) {
        toggleRow(locationKey);
    };

    async function loadStorageOverview() {
        showLoading();
        
        try {
            const timestamp = new Date().getTime();
            const resp = await fetch(`${apiBase}/storage-overview?t=${timestamp}`, {
                cache: 'no-cache',
                headers: { 'Cache-Control': 'no-cache', 'Pragma': 'no-cache' }
            });
            
            if (!resp.ok) {
                throw new Error(`Failed to load: ${resp.status} ${resp.statusText}`);
            }
            
            const data = await resp.json();
            allData = data || [];
            
            updateSchoolFilter(allData);
            applyFilters();
        } catch (error) {
            console.error('Error loading storage overview:', error);
            showError(`Error loading storage overview: ${error.message}`);
        }
    }

    // Event listeners
    const schoolFilter = document.getElementById('schoolFilter');
    const sortBy = document.getElementById('sortBy');
    const clearFiltersBtn = document.getElementById('clearFiltersBtn');

    if (schoolFilter) {
        schoolFilter.addEventListener('change', applyFilters);
    }
    if (sortBy) {
        sortBy.addEventListener('change', applyFilters);
    }
    if (clearFiltersBtn) {
        clearFiltersBtn.addEventListener('click', () => {
            if (schoolFilter) schoolFilter.value = '';
            if (sortBy) sortBy.value = 'building';
            applyFilters();
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadStorageOverview);
    } else {
        loadStorageOverview();
    }
})();
</script>
