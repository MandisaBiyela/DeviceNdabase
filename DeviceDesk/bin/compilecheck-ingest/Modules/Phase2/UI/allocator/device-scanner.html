<div class="container-fluid py-4">
    <h2 class="mb-4">Device location</h2>

    <div class="row">
        <div class="col-md-6">
            <!-- Scanner Input -->
            <div class="card mb-3 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Locate Device</h5>
                    <div class="input-group">
                        <input type="text" id="scannerInput" class="form-control form-control-lg" 
                               placeholder="Scan device barcode..." autocomplete="off" autofocus>
                        <button class="btn btn-primary" onclick="deviceScanner.scanDevice()">
                            <i class="bi bi-search"></i> Locate
                        </button>
                    </div>
                    <div class="form-text mt-2">
                        <i class="bi bi-info-circle"></i>
                        Scan or enter device serial number to locate and view device details
                    </div>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="card shadow-sm">
                <div class="card-body">
                    <h6 class="card-title">Quick Actions</h6>
                    <div class="d-grid gap-2">
                        <button id="printPickingSlipBtn" class="btn btn-primary" onclick="deviceScanner.printPickingSlip()" disabled>
                            <i class="bi bi-printer"></i> Print Picking Slip
                        </button>
                        <button id="historyBtn" class="btn btn-outline-info" onclick="deviceScanner.showFullHistory()" disabled>
                            <i class="bi bi-clock-history"></i> View Full History
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <!-- Device Details -->
            <div id="deviceDetails" class="card mb-3 shadow-sm" style="display: none;">
                <div class="card-body">
                    <h5 class="card-title">Device Details</h5>
                    
                    <!-- Basic Info -->
                    <div class="row mb-3">
                        <div class="col-6">
                            <strong>Serial:</strong>
                            <div id="detailSerial" class="fw-bold"></div>
                        </div>
                        <div class="col-6">
                            <strong>Model:</strong>
                            <div id="detailModel"></div>
                        </div>
                    </div>

                    <!-- School Info -->
                    <div class="row mb-3">
                        <div class="col-12">
                            <strong>School:</strong>
                            <div id="detailSchool" class="fw-bold text-primary"></div>
                        </div>
                    </div>

                    <!-- Current Allocation -->
                    <div class="row mb-3">
                        <div class="col-12">
                            <strong>Current Location:</strong>
                            <div id="detailLocation" class="fw-bold text-success"></div>
                            <small id="detailAllocatedInfo" class="text-muted"></small>
                        </div>
                    </div>

                    <!-- Timeline -->
                    <div class="row">
                        <div class="col-6">
                            <strong>First Placed:</strong>
                            <div id="detailFirstAllocated" class="text-muted small"></div>
                        </div>
                        <div class="col-6">
                            <strong>Last Scanned:</strong>
                            <div id="detailLastScanned" class="text-muted small"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Scan History -->
            <div id="scanHistory" class="card shadow-sm" style="display: none;">
                <div class="card-body">
                    <h6 class="card-title">Recent Scan History</h6>
                    <div id="scanHistoryList" style="max-height: 200px; overflow-y: auto;">
                        <!-- Scan history items -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Full History Modal -->
<div class="modal fade" id="historyModal" tabindex="-1" aria-labelledby="historyModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="historyModalLabel">
                    <i class="bi bi-clock-history"></i> Full Device History
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="historyLoading" class="text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-3 text-muted">Loading history...</p>
                </div>
                <div id="historyContent" style="display: none;">
                    <div class="mb-3">
                        <strong>Serial:</strong> <span id="historySerial" class="fw-bold"></span>
                        <span class="ms-3 text-muted">Total Events: <span id="historyCount">0</span></span>
                    </div>
                    <div id="historyTimeline" class="timeline">
                        <!-- History items will be inserted here -->
                    </div>
                </div>
                <div id="historyError" class="alert alert-danger" style="display: none;">
                    <!-- Error message will be shown here -->
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<style>
    .timeline {
        position: relative;
        padding-left: 30px;
    }
    
    .timeline-item {
        position: relative;
        padding-bottom: 20px;
        padding-left: 30px;
    }
    
    .timeline-item::before {
        content: '';
        position: absolute;
        left: -21px;
        top: 8px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background-color: var(--timeline-color, #6c757d);
        border: 2px solid #fff;
        box-shadow: 0 0 0 2px var(--timeline-color, #6c757d);
    }
    
    .timeline-item::after {
        content: '';
        position: absolute;
        left: -15px;
        top: 20px;
        width: 2px;
        height: calc(100% - 8px);
        background-color: #dee2e6;
    }
    
    .timeline-item:last-child::after {
        display: none;
    }
    
    .timeline-card {
        background: #f8f9fa;
        border-left: 3px solid var(--timeline-color, #6c757d);
        padding: 12px 15px;
        border-radius: 4px;
    }
    
    .timeline-card .card-title {
        font-size: 0.95rem;
        font-weight: 600;
        margin-bottom: 5px;
        color: var(--timeline-color, #6c757d);
    }
    
    .timeline-card .card-text {
        font-size: 0.85rem;
        color: #6c757d;
        margin-bottom: 5px;
    }
    
    .timeline-card .card-footer {
        font-size: 0.75rem;
        color: #adb5bd;
        padding-top: 5px;
        border-top: 1px solid #dee2e6;
        margin-top: 8px;
    }
</style>

<script>
(function() {
    class DeviceScanner {
        constructor() {
            this.currentDevice = null;
            this.init();
        }

        init() {
            this.setupEventListeners();
        }

        setupEventListeners() {
            const scannerInput = document.getElementById('scannerInput');
            
            scannerInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    this.scanDevice();
                }
            });
            
            // Auto-focus and clear on load
            scannerInput.focus();
            scannerInput.value = '';
        }

        async scanDevice() {
            const serialInput = document.getElementById('scannerInput');
            const serial = serialInput.value.trim();
            
            if (!serial) {
                this.showAlert('Please enter a device serial', 'warning');
                return;
            }

            const btn = scannerInput.nextElementSibling;
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';

            try {
                const response = await fetch(`/api/phase2/allocation/device-details/${encodeURIComponent(serial)}`);
                
                if (!response.ok) {
                    this.showAlert('Device not found', 'danger');
                    this.hideDetails();
                    return;
                }

                const result = await response.json();
                
                // Check if response has success flag and device object
                if (result.success === false || !result.device) {
                    this.showAlert('Device not found', 'danger');
                    this.hideDetails();
                    return;
                }

                const deviceData = result.device;
                
                // Transform API response to match expected structure
                // Ensure we have the Phase2 device ID (required for picking slips)
                const phase2DeviceId = result.phase2Id || deviceData.id;
                if (!phase2DeviceId) {
                    this.showAlert('Device ID not found in response', 'danger');
                    this.hideDetails();
                    return;
                }

                this.currentDevice = {
                    id: phase2DeviceId,
                    serial: deviceData.serial || result.serial,
                    model: deviceData.model || result.model || 'Unknown',
                    school: {
                        id: deviceData.school?.id || result.schoolId,
                        name: deviceData.school?.name || result.schoolName || 'Unknown School'
                    },
                    currentAllocation: deviceData.currentAllocation || (result.phase2Storage ? {
                        building: result.phase2Storage.building,
                        room: result.phase2Storage.room,
                        rack: result.phase2Storage.rack,
                        shelf: result.phase2Storage.shelf,
                        bin: result.phase2Storage.bin,
                        allocatedAt: result.phase2Storage.createdAt,
                        allocatedBy: 'ICT Allocator'
                    } : null),
                    firstAllocation: deviceData.firstAllocation || (result.phase2Storage ? {
                        allocatedAt: result.phase2Storage.createdAt
                    } : null),
                    lastScanned: deviceData.lastScanned || null,
                    scanHistory: deviceData.scanHistory || []
                };
                
                this.displayDeviceDetails();
                this.enableActions();

                // Clear input and refocus for next scan
                serialInput.value = '';
                serialInput.focus();
            } catch (error) {
                console.error('Scan failed:', error);
                this.showAlert('Scan failed - please try again', 'danger');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        displayDeviceDetails() {
            const device = this.currentDevice;
            
            // Basic info
            document.getElementById('detailSerial').textContent = device.serial;
            document.getElementById('detailModel').textContent = device.model || 'Unknown';
            document.getElementById('detailSchool').textContent = device.school ? device.school.name : 'No school assigned';

            // Current location
            if (device.currentAllocation) {
                const loc = device.currentAllocation;
                const locationParts = [loc.building, loc.room, loc.rack].filter(Boolean);
                document.getElementById('detailLocation').textContent = locationParts.join(' / ') || 'Not allocated';
                
                if (loc.allocatedAt && loc.allocatedBy) {
                    const date = new Date(loc.allocatedAt).toLocaleDateString();
                    document.getElementById('detailAllocatedInfo').textContent = 
                        `Allocated by ${loc.allocatedBy} on ${date}`;
                } else {
                    document.getElementById('detailAllocatedInfo').textContent = '';
                }
            } else {
                document.getElementById('detailLocation').textContent = 'Not allocated';
                document.getElementById('detailAllocatedInfo').textContent = '';
            }

            // Timeline
            document.getElementById('detailFirstAllocated').textContent = 
                device.firstAllocation ? new Date(device.firstAllocation.allocatedAt).toLocaleDateString() : 'Never';
            
            document.getElementById('detailLastScanned').textContent = 
                device.lastScanned ? new Date(device.lastScanned).toLocaleDateString() : 'Never';

            // Scan history
            this.displayScanHistory(device.scanHistory);

            // Show sections
            document.getElementById('deviceDetails').style.display = 'block';
            document.getElementById('scanHistory').style.display = 'block';
        }

        displayScanHistory(scanHistory) {
            const container = document.getElementById('scanHistoryList');
            container.innerHTML = '';
            
            if (!scanHistory || scanHistory.length === 0) {
                container.innerHTML = '<div class="text-muted">No scan history</div>';
                return;
            }

            scanHistory.forEach(scan => {
                // Format purpose to be more user-friendly
                const purpose = this.formatPurpose(scan.purpose || 'Unknown');
                
                // Format location to be more user-friendly
                const location = this.formatLocation(scan.location || '');
                
                // Format scannedBy - if it looks like a GUID or email, show a friendly name
                const scannedBy = this.formatUserDisplay(scan.scannedBy || 'Unknown');
                
                // Format date/time
                const scanDate = scan.scanTime ? new Date(scan.scanTime) : null;
                const dateStr = scanDate ? scanDate.toLocaleDateString() : 'Unknown date';
                const timeStr = scanDate ? scanDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';

                const scanElement = document.createElement('div');
                scanElement.className = 'border-bottom py-2';
                scanElement.innerHTML = `
                    <div class="d-flex justify-content-between align-items-start">
                        <div class="flex-grow-1">
                            <div class="fw-semibold mb-1">${this.escapeHtml(purpose)}</div>
                            ${location ? `<div class="text-muted small mb-1"><i class="bi bi-geo-alt"></i> ${this.escapeHtml(location)}</div>` : ''}
                            <div class="text-muted small"><i class="bi bi-person"></i> ${this.escapeHtml(scannedBy)}</div>
                        </div>
                        <div class="text-end ms-3">
                            <div class="small fw-medium">${dateStr}</div>
                            ${timeStr ? `<div class="text-muted small">${timeStr}</div>` : ''}
                        </div>
                    </div>
                `;
                container.appendChild(scanElement);
            });
        }

        formatPurpose(purpose) {
            // Convert technical purposes to user-friendly text
            const purposeMap = {
                'Details View': 'Device Details Viewed',
                'Allocation': 'Device Allocated',
                'Scan Out': 'Device Scanned Out',
                'Quality Assessment': 'Quality Assessment',
                'Pre-Assessment': 'Pre-Assessment',
                'Inspection': 'Device Inspected',
                'Dispatch': 'Device Dispatched'
            };
            
            return purposeMap[purpose] || purpose;
        }

        formatLocation(location) {
            // If location is empty or looks like a technical string, format it better
            if (!location || location.trim() === '') {
                return '';
            }
            
            // If it's a technical location like "Device Details Page", make it more friendly
            if (location.includes('Page') || location.includes('Details')) {
                return 'Device Location Page';
            }
            
            // If it contains slashes (like "ICT Centre Main / Room 1 / Rack 01"), return as-is
            if (location.includes('/')) {
                return location;
            }
            
            return location;
        }

        formatUserDisplay(userId) {
            // If it looks like a GUID, return a generic name
            const guidPattern = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
            if (guidPattern.test(userId)) {
                return 'ICT Staff';
            }
            
            // If it looks like an email, extract the name part
            if (userId.includes('@')) {
                const emailParts = userId.split('@');
                if (emailParts[0]) {
                    // Capitalize first letter and replace dots/underscores with spaces
                    return emailParts[0]
                        .replace(/[._]/g, ' ')
                        .split(' ')
                        .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                        .join(' ');
                }
            }
            
            // If it's already a readable name, return as-is
            return userId;
        }

        enableActions() {
            document.getElementById('printPickingSlipBtn').disabled = false;
            document.getElementById('historyBtn').disabled = false;
        }

        hideDetails() {
            document.getElementById('deviceDetails').style.display = 'none';
            document.getElementById('scanHistory').style.display = 'none';
            document.getElementById('printPickingSlipBtn').disabled = true;
            document.getElementById('historyBtn').disabled = true;
        }

        async printPickingSlip() {
            if (!this.currentDevice) {
                this.showAlert('No device selected', 'warning');
                return;
            }

            const btn = document.getElementById('printPickingSlipBtn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Creating...';

            try {
                // Check if device has a school ID (required for picking slip)
                if (!this.currentDevice.school || !this.currentDevice.school.id) {
                    this.showAlert('Device must be associated with a school to create a picking slip', 'warning');
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                    return;
                }

                // Create a picking slip for this single device
                // Note: schoolId needs to be converted to long if it's an int
                const schoolId = typeof this.currentDevice.school.id === 'number' 
                    ? this.currentDevice.school.id 
                    : parseInt(this.currentDevice.school.id);

                // Ensure deviceId is an integer (Phase2 device ID)
                const deviceId = typeof this.currentDevice.id === 'number' 
                    ? this.currentDevice.id 
                    : parseInt(this.currentDevice.id);

                if (isNaN(deviceId)) {
                    this.showAlert('Invalid device ID. Cannot create picking slip.', 'danger');
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                    return;
                }

                const response = await fetch('/api/phase2/picking/slips', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        schoolId: schoolId,
                        deviceIds: [deviceId],
                        requestedCollectionDate: null,
                        notes: `Single device picking slip for ${this.currentDevice.serial}`,
                        reference: `LOCATE-${this.currentDevice.serial}`
                    })
                });

                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error(result.message || 'Failed to create picking slip');
                }

                // Open the picking slip detail page in a new window with print parameter
                const slipId = result.slip.id;
                window.open(`/phase2/picking-slip-detail.html?id=${slipId}&print=1`, '_blank');

                this.showAlert('Picking slip created and opened for printing', 'success');
            } catch (error) {
                console.error('Failed to create picking slip:', error);
                this.showAlert(`Failed to create picking slip: ${error.message}`, 'danger');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        async showFullHistory() {
            if (!this.currentDevice) {
                this.showAlert('No device selected', 'warning');
                return;
            }

            const modal = new bootstrap.Modal(document.getElementById('historyModal'));
            const historyContent = document.getElementById('historyContent');
            const historyLoading = document.getElementById('historyLoading');
            const historyError = document.getElementById('historyError');
            const historyTimeline = document.getElementById('historyTimeline');
            const historySerial = document.getElementById('historySerial');
            const historyCount = document.getElementById('historyCount');

            // Reset modal state
            historyContent.style.display = 'none';
            historyLoading.style.display = 'block';
            historyError.style.display = 'none';
            historyTimeline.innerHTML = '';
            historySerial.textContent = this.currentDevice.serial;

            // Show modal
            modal.show();

            try {
                const response = await fetch(`/api/phase2/allocation/device-history/${encodeURIComponent(this.currentDevice.serial)}`);
                const result = await response.json();

                historyLoading.style.display = 'none';

                if (!result.success) {
                    historyError.textContent = result.message || 'Failed to load history';
                    historyError.style.display = 'block';
                    return;
                }

                if (!result.history || result.history.length === 0) {
                    historyTimeline.innerHTML = '<div class="text-center text-muted py-4">No history found for this device.</div>';
                    historyContent.style.display = 'block';
                    historyCount.textContent = '0';
                    return;
                }

                // Display history
                historyCount.textContent = result.totalItems || result.history.length;
                historyTimeline.innerHTML = this.renderHistoryTimeline(result.history);
                historyContent.style.display = 'block';
            } catch (error) {
                console.error('Failed to load history:', error);
                historyLoading.style.display = 'none';
                historyError.textContent = 'Failed to load history. Please try again.';
                historyError.style.display = 'block';
            }
        }

        renderHistoryTimeline(history) {
            if (!history || history.length === 0) {
                return '<div class="text-center text-muted py-4">No history available.</div>';
            }

            return history.map(item => {
                const timestamp = new Date(item.timestamp);
                const dateStr = timestamp.toLocaleDateString();
                const timeStr = timestamp.toLocaleTimeString();
                const colorClass = this.getColorClass(item.color || 'secondary');
                const icon = item.icon || 'bi-circle';

                return `
                    <div class="timeline-item" style="--timeline-color: ${this.getColorValue(item.color || 'secondary')}">
                        <div class="timeline-card">
                            <div class="card-title">
                                <i class="bi ${icon}"></i> ${this.escapeHtml(item.title || 'Event')}
                            </div>
                            <div class="card-text">
                                ${this.escapeHtml(item.description || '')}
                                ${item.location ? `<br><small><i class="bi bi-geo-alt"></i> ${this.escapeHtml(item.location)}</small>` : ''}
                                ${item.reason ? `<br><small><i class="bi bi-info-circle"></i> Reason: ${this.escapeHtml(item.reason)}</small>` : ''}
                            </div>
                            <div class="card-footer">
                                <i class="bi bi-person"></i> ${this.escapeHtml(item.user || 'Unknown')} 
                                <span class="ms-3"><i class="bi bi-calendar"></i> ${dateStr} ${timeStr}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        getColorClass(color) {
            const colorMap = {
                'primary': 'primary',
                'success': 'success',
                'info': 'info',
                'warning': 'warning',
                'danger': 'danger',
                'secondary': 'secondary'
            };
            return colorMap[color] || 'secondary';
        }

        getColorValue(color) {
            const colorMap = {
                'primary': '#0d6efd',
                'success': '#198754',
                'info': '#0dcaf0',
                'warning': '#ffc107',
                'danger': '#dc3545',
                'secondary': '#6c757d'
            };
            return colorMap[color] || '#6c757d';
        }

        escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        showAlert(message, type) {
            // Create temporary alert
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type} alert-dismissible fade show position-fixed top-0 start-50 translate-middle-x mt-3`;
            alertDiv.style.zIndex = '9999';
            alertDiv.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            document.body.appendChild(alertDiv);
            
            setTimeout(() => {
                if (alertDiv.parentNode) {
                    alertDiv.classList.remove('show');
                    setTimeout(() => alertDiv.remove(), 150);
                }
            }, 3000);
        }
    }

    // Initialize scanner
    window.deviceScanner = new DeviceScanner();
})();
</script>
