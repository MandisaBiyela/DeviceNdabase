<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-0">Storage Overview</h2>
            <small class="text-muted">
                View all storage locations and device counts.
            </small>
        </div>
        <button class="btn btn-outline-primary" id="btnRefresh">
            <i class="bi bi-arrow-clockwise me-1"></i> Refresh
        </button>
    </div>

    <div class="row mb-3">
        <div class="col-md-4">
            <input type="text" id="searchInput" class="form-control" 
                   placeholder="Search by building, room, rack..." />
        </div>
        <div class="col-md-4">
            <select id="filterBuilding" class="form-select">
                <option value="">All Buildings</option>
            </select>
        </div>
        <div class="col-md-4">
            <select id="filterRoom" class="form-select">
                <option value="">All Rooms</option>
            </select>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle" id="overviewTable">
                    <thead class="table-light">
                        <tr>
                            <th>Building</th>
                            <th>Room</th>
                            <th>Rack</th>
                            <th>Shelf</th>
                            <th>Bin</th>
                            <th class="text-end">Device Count</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="6" class="text-center text-muted py-4">
                                <div class="spinner-border spinner-border-sm me-2" role="status"></div>
                                Loading storage overview...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="mt-3">
        <div class="card bg-light">
            <div class="card-body">
                <h6 class="mb-2">Summary</h6>
                <div class="row">
                    <div class="col-md-4">
                        <strong>Total Locations:</strong> <span id="totalLocations">0</span>
                    </div>
                    <div class="col-md-4">
                        <strong>Total Devices:</strong> <span id="totalDevices">0</span>
                    </div>
                    <div class="col-md-4">
                        <strong>Unique Buildings:</strong> <span id="uniqueBuildings">0</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let allData = [];

    async function loadStorageOverview() {
        const tbody = document.querySelector('#overviewTable tbody');
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4"><div class="spinner-border spinner-border-sm me-2"></div>Loading...</td></tr>';

        try {
            const response = await fetch('/api/phase2/allocation/storage-overview');
            if (!response.ok) {
                throw new Error('Failed to load storage overview');
            }

            allData = await response.json();
            applyFilters();
        } catch (error) {
            console.error('Error loading storage overview:', error);
            tbody.innerHTML = `
                <tr>
                    <td colspan="6" class="text-center text-danger py-4">
                        <i class="bi bi-exclamation-triangle me-2"></i>
                        Error loading storage overview: ${error.message}
                    </td>
                </tr>
            `;
        }
    }

    function applyFilters() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const buildingFilter = document.getElementById('filterBuilding').value;
        const roomFilter = document.getElementById('filterRoom').value;

        let filtered = allData;

        if (searchTerm) {
            filtered = filtered.filter(item =>
                (item.building || '').toLowerCase().includes(searchTerm) ||
                (item.room || '').toLowerCase().includes(searchTerm) ||
                (item.rack || '').toLowerCase().includes(searchTerm) ||
                (item.shelf || '').toLowerCase().includes(searchTerm) ||
                (item.bin || '').toLowerCase().includes(searchTerm)
            );
        }

        if (buildingFilter) {
            filtered = filtered.filter(item => item.building === buildingFilter);
        }

        if (roomFilter) {
            filtered = filtered.filter(item => item.room === roomFilter);
        }

        renderTable(filtered);
        updateSummary(filtered);
        updateFilters(allData);
    }

    function renderTable(data) {
        const tbody = document.querySelector('#overviewTable tbody');
        
        if (data.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="6" class="text-center text-muted py-4">
                        No storage locations found.
                    </td>
                </tr>
            `;
            return;
        }

        tbody.innerHTML = '';
        data.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${item.building || '-'}</td>
                <td>${item.room || '-'}</td>
                <td>${item.rack || '-'}</td>
                <td>${item.shelf || '-'}</td>
                <td>${item.bin || '-'}</td>
                <td class="text-end">
                    <span class="badge bg-primary">${item.deviceCount}</span>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function updateSummary(data) {
        const totalDevices = data.reduce((sum, item) => sum + item.deviceCount, 0);
        const uniqueBuildings = new Set(data.map(item => item.building).filter(b => b)).size;

        document.getElementById('totalLocations').textContent = data.length;
        document.getElementById('totalDevices').textContent = totalDevices;
        document.getElementById('uniqueBuildings').textContent = uniqueBuildings;
    }

    function updateFilters(data) {
        const buildings = [...new Set(data.map(item => item.building).filter(b => b))].sort();
        const rooms = [...new Set(data.map(item => item.room).filter(r => r))].sort();

        const buildingSelect = document.getElementById('filterBuilding');
        const currentBuilding = buildingSelect.value;
        buildingSelect.innerHTML = '<option value="">All Buildings</option>';
        buildings.forEach(b => {
            const opt = document.createElement('option');
            opt.value = b;
            opt.textContent = b;
            if (b === currentBuilding) opt.selected = true;
            buildingSelect.appendChild(opt);
        });

        const roomSelect = document.getElementById('filterRoom');
        const currentRoom = roomSelect.value;
        roomSelect.innerHTML = '<option value="">All Rooms</option>';
        rooms.forEach(r => {
            const opt = document.createElement('option');
            opt.value = r;
            opt.textContent = r;
            if (r === currentRoom) opt.selected = true;
            roomSelect.appendChild(opt);
        });
    }

    document.getElementById('btnRefresh').addEventListener('click', loadStorageOverview);
    document.getElementById('searchInput').addEventListener('input', applyFilters);
    document.getElementById('filterBuilding').addEventListener('change', applyFilters);
    document.getElementById('filterRoom').addEventListener('change', applyFilters);

    // Initial load
    loadStorageOverview();
</script>
