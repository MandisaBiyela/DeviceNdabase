<div class="container-fluid py-4">
    <!-- Tabs -->
    <ul class="nav nav-tabs mb-4" id="pickingTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="create-tab" data-bs-toggle="tab" data-bs-target="#create-panel" type="button" role="tab">
                <i class="bi bi-plus-circle me-1"></i>Create Picking Slip
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="existing-tab" data-bs-toggle="tab" data-bs-target="#existing-panel" type="button" role="tab">
                <i class="bi bi-list-ul me-1"></i>Existing Picking Slips
            </button>
        </li>
    </ul>

    <div class="tab-content" id="pickingTabContent">
        <!-- Create Picking Slip Panel -->
        <div class="tab-pane fade show active" id="create-panel" role="tabpanel">
            <div class="row">
                <!-- Left: Search Filters & Results -->
                <div class="col-lg-8">
                    <div class="card shadow-sm mb-4">
                        <div class="card-header bg-white">
                            <h5 class="mb-0">Search Devices</h5>
                        </div>
                        <div class="card-body">
                            <!-- Filters -->
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label for="schoolSearch" class="form-label">School</label>
                                    <input type="text" id="schoolSearch" class="form-control" 
                                           placeholder="Search by name or EMIS..." autocomplete="off">
                                    <input type="hidden" id="schoolId">
                                    <div id="schoolSearchResults" class="list-group position-absolute" style="z-index: 1000; max-height: 200px; overflow-y: auto; display: none; width: calc(100% - 30px);"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="districtFilter" class="form-label">District</label>
                                    <input type="text" id="districtFilter" class="form-control" 
                                           placeholder="Filter by district...">
                                </div>
                                <div class="col-md-6">
                                    <label for="serialFilter" class="form-label">Serial</label>
                                    <input type="text" id="serialFilter" class="form-control" 
                                           placeholder="Serial number (exact or partial)...">
                                </div>
                                <div class="col-md-6">
                                    <label for="stageFilter" class="form-label">Stage</label>
                                    <select id="stageFilter" class="form-select">
                                        <option value="">All Stages</option>
                                        <option value="Received">Received</option>
                                        <option value="PreAssessment">Pre-Assessment</option>
                                        <option value="DetailedInspection">Detailed Inspection</option>
                                        <option value="HardwareDept">Hardware Dept</option>
                                        <option value="SoftwareDept">Software Dept</option>
                                        <option value="QualityAssessment">Quality Assessment</option>
                                        <option value="Dispatch">Dispatch</option>
                                        <option value="AwaitingDispatch">Awaiting Dispatch</option>
                                    </select>
                                </div>
                            </div>
                            <button class="btn btn-primary" id="searchBtn">
                                <i class="bi bi-search me-1"></i>Search
                            </button>
                            <button class="btn btn-outline-secondary" id="clearFiltersBtn">
                                <i class="bi bi-x-circle me-1"></i>Clear
                            </button>

                            <!-- Results Table -->
                            <div class="mt-4">
                                <div class="table-responsive">
                                    <table class="table table-hover align-middle" id="devicesTable">
                                        <thead>
                                            <tr>
                                                <th style="width: 40px;">
                                                    <input type="checkbox" id="selectAllDevices" title="Select All">
                                                </th>
                                                <th>Serial</th>
                                                <th>School</th>
                                                <th>Stage</th>
                                                <th>Model</th>
                                                <th>Location</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr>
                                                <td colspan="6" class="text-center text-muted py-4">
                                                    Use filters above to search for devices
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right: Current Picking Slip Panel -->
                <div class="col-lg-4">
                    <div class="card shadow-sm sticky-top" style="top: 20px;">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0">Current Picking Slip</h5>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label for="slipReference" class="form-label">Reference (optional)</label>
                                <input type="text" id="slipReference" class="form-control" 
                                       placeholder="e.g. ADAMS COLLEGE – 2025-11-27">
                            </div>
                            <div class="mb-3">
                                <label for="requestedCollectionDate" class="form-label">Requested Collection Date</label>
                                <input type="date" id="requestedCollectionDate" class="form-control">
                            </div>
                            <div class="mb-3">
                                <label for="slipNotes" class="form-label">Notes</label>
                                <textarea id="slipNotes" class="form-control" rows="3" 
                                          placeholder="Additional notes about this picking slip..."></textarea>
                            </div>
                            <div class="mb-3">
                                <div class="d-flex justify-content-between align-items-center">
                                    <strong>Selected Devices:</strong>
                                    <span class="badge bg-primary" id="selectedCount">0</span>
                                </div>
                            </div>
                            <div id="selectedDevicesList" class="mb-3" style="max-height: 300px; overflow-y: auto;">
                                <p class="text-muted small">No devices selected</p>
                            </div>
                            <button class="btn btn-success w-100" id="createSlipBtn" disabled>
                                <i class="bi bi-check-circle me-1"></i>Create Picking Slip
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Existing Slips Panel -->
        <div class="tab-pane fade" id="existing-panel" role="tabpanel">
            <div class="card shadow-sm">
                <div class="card-header bg-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Existing Picking Slips</h5>
                    <button class="btn btn-outline-secondary btn-sm" id="refreshSlipsBtn">
                        <i class="bi bi-arrow-clockwise"></i> Refresh
                    </button>
                </div>
                <div class="card-body">
                    <!-- Filters -->
                    <div class="row g-3 mb-3">
                        <div class="col-md-3">
                            <label for="slipStatusFilter" class="form-label">Status</label>
                            <select id="slipStatusFilter" class="form-select">
                                <option value="">All Statuses</option>
                                <option value="Draft">Draft</option>
                                <option value="ReadyForPicking">Ready for Picking</option>
                                <option value="PickingInProgress">Picking In Progress</option>
                                <option value="Completed">Completed</option>
                                <option value="Cancelled">Cancelled</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="slipSchoolFilter" class="form-label">School</label>
                            <input type="text" id="slipSchoolFilter" class="form-control" 
                                   placeholder="Filter by school...">
                        </div>
                        <div class="col-md-3">
                            <label for="slipDateFrom" class="form-label">Date From</label>
                            <input type="date" id="slipDateFrom" class="form-control">
                        </div>
                        <div class="col-md-3">
                            <label for="slipDateTo" class="form-label">Date To</label>
                            <input type="date" id="slipDateTo" class="form-control">
                        </div>
                    </div>

                    <!-- Slips Table -->
                    <div class="table-responsive">
                        <table class="table table-hover align-middle" id="slipsTable">
                            <thead>
                                <tr>
                                    <th>Slip Number</th>
                                    <th>School</th>
                                    <th>District</th>
                                    <th>Created</th>
                                    <th>Status</th>
                                    <th>Devices</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td colspan="7" class="text-center text-muted py-4">
                                        <div class="spinner-border spinner-border-sm me-2"></div>Loading...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div id="slipsEmptyState" class="text-center text-muted py-4 d-none">
                        No picking slips found.
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    'use strict';
    const apiBase = '/api/phase2/picking';
    let selectedDevices = [];
    let schoolSearchTimeout = null;
    let currentSchool = null;

    // School search functionality
    const schoolSearchInput = document.getElementById('schoolSearch');
    const schoolIdInput = document.getElementById('schoolId');
    const schoolResultsBox = document.getElementById('schoolSearchResults');
    const districtFilter = document.getElementById('districtFilter');
    const slipReference = document.getElementById('slipReference');
    const requestedCollectionDate = document.getElementById('requestedCollectionDate');

    // Format date for reference (dd-MM-yyyy)
    function formatDateForRef(date) {
        const d = String(date.getDate()).padStart(2, '0');
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const y = date.getFullYear();
        return `${d}-${m}-${y}`;
    }

    // Handle school selection
    function onSchoolSelected(school) {
        currentSchool = school;
        schoolSearchInput.value = school.name;
        schoolIdInput.value = school.schoolId;
        schoolResultsBox.style.display = 'none';

        // Auto-populate district
        if (districtFilter) {
            districtFilter.value = school.district || '';
            districtFilter.readOnly = true; // Lock district field
        }

        // Auto-generate or update reference
        updateReferenceField();

        // Auto-fill date if empty
        if (requestedCollectionDate && !requestedCollectionDate.value) {
            const today = new Date();
            const iso = today.toISOString().slice(0, 10);
            requestedCollectionDate.value = iso;
            updateReferenceField(); // Update reference with the new date
        }
    }

    // Update reference field based on school and date
    function updateReferenceField() {
        if (!slipReference || !currentSchool) return;
        
        // Only auto-update if reference is empty or matches the pattern (user hasn't customized it)
        const currentRef = slipReference.value.trim();
        const schoolNameUpper = currentSchool.name.toUpperCase();
        const dateStr = requestedCollectionDate && requestedCollectionDate.value 
            ? formatDateForRef(new Date(requestedCollectionDate.value))
            : formatDateForRef(new Date());
        const expectedRef = `${schoolNameUpper} – ${dateStr}`;
        
        // If empty or matches expected pattern, update it
        if (!currentRef || currentRef === expectedRef || currentRef.startsWith(schoolNameUpper + ' –')) {
            slipReference.value = expectedRef;
        }
    }

    async function searchSchools(term) {
        if (term.length < 2) {
            schoolResultsBox.style.display = 'none';
            return [];
        }
        try {
            const resp = await fetch(`/api/phase1/schools/search?term=${encodeURIComponent(term)}`);
            if (!resp.ok) return [];
            return await resp.json();
        } catch (error) {
            console.error('School search error:', error);
            return [];
        }
    }

    function renderSchoolResults(results) {
        schoolResultsBox.innerHTML = '';
        if (results.length === 0) {
            schoolResultsBox.style.display = 'none';
            return;
        }
        results.forEach(school => {
            const item = document.createElement('a');
            item.href = '#';
            item.className = 'list-group-item list-group-item-action';
            item.innerHTML = `
                <div><strong>${school.name}</strong></div>
                <small class="text-muted">EMIS: ${school.emisCode} | District: ${school.district || 'N/A'}</small>
            `;
            item.addEventListener('click', (e) => {
                e.preventDefault();
                onSchoolSelected(school);
            });
            schoolResultsBox.appendChild(item);
        });
        schoolResultsBox.style.display = 'block';
    }

    schoolSearchInput.addEventListener('input', () => {
        clearTimeout(schoolSearchTimeout);
        const term = schoolSearchInput.value.trim();
        if (term.length < 2) {
            schoolResultsBox.style.display = 'none';
            // If school input is cleared, reset related fields
            if (!term && schoolIdInput.value) {
                schoolIdInput.value = '';
                currentSchool = null;
                if (districtFilter) {
                    districtFilter.value = '';
                    districtFilter.readOnly = false;
                }
                if (slipReference) {
                    slipReference.value = '';
                }
            }
            return;
        }
        schoolSearchTimeout = setTimeout(async () => {
            const results = await searchSchools(term);
            renderSchoolResults(results);
        }, 300);
    });

    // Update reference when date changes
    if (requestedCollectionDate) {
        requestedCollectionDate.addEventListener('change', () => {
            if (currentSchool) {
                updateReferenceField();
            }
        });
    }

    document.addEventListener('click', (e) => {
        if (!schoolSearchInput.contains(e.target) && !schoolResultsBox.contains(e.target)) {
            schoolResultsBox.style.display = 'none';
        }
    });

    // Search devices
    async function searchDevices() {
        const schoolId = schoolIdInput.value ? parseInt(schoolIdInput.value) : null;
        const district = document.getElementById('districtFilter').value.trim() || null;
        const serial = document.getElementById('serialFilter').value.trim() || null;
        const stage = document.getElementById('stageFilter').value || null;

        const tbody = document.querySelector('#devicesTable tbody');
        tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4"><div class="spinner-border spinner-border-sm me-2"></div>Searching...</td></tr>';

        try {
            const params = new URLSearchParams();
            if (schoolId) params.append('schoolId', schoolId);
            if (district) params.append('district', district);
            if (serial) params.append('serial', serial);
            if (stage) params.append('stage', stage);

            const resp = await fetch(`${apiBase}/search-devices?${params.toString()}`);
            if (!resp.ok) throw new Error('Search failed');

            const devices = await resp.json();
            tbody.innerHTML = '';

            if (devices.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">No devices found</td></tr>';
                return;
            }

            devices.forEach(device => {
                const tr = document.createElement('tr');
                const location = [device.building, device.room, device.rack, device.shelf, device.bin]
                    .filter(x => x).join(' / ') || 'Not set';
                
                tr.innerHTML = `
                    <td>
                        <input type="checkbox" class="device-checkbox" 
                               data-device-id="${device.phase2DeviceId}" 
                               data-serial="${device.serial}">
                    </td>
                    <td><code class="text-primary">${device.serial}</code></td>
                    <td>${device.schoolName || 'No School'}</td>
                    <td><span class="badge bg-secondary">${device.stage}</span></td>
                    <td>${device.model || 'N/A'}</td>
                    <td><small class="text-muted">${location}</small></td>
                `;
                tbody.appendChild(tr);
            });

            // Attach checkbox handlers
            document.querySelectorAll('.device-checkbox').forEach(cb => {
                cb.addEventListener('change', updateSelectedDevices);
            });
        } catch (error) {
            console.error('Search error:', error);
            tbody.innerHTML = `<tr><td colspan="6" class="text-center text-danger py-4">Error: ${error.message}</td></tr>`;
        }
    }

    function updateSelectedDevices() {
        selectedDevices = [];
        document.querySelectorAll('.device-checkbox:checked').forEach(cb => {
            selectedDevices.push({
                phase2DeviceId: parseInt(cb.dataset.deviceId),
                serial: cb.dataset.serial
            });
        });

        // Update UI
        document.getElementById('selectedCount').textContent = selectedDevices.length;
        const listDiv = document.getElementById('selectedDevicesList');
        if (selectedDevices.length === 0) {
            listDiv.innerHTML = '<p class="text-muted small">No devices selected</p>';
            document.getElementById('createSlipBtn').disabled = true;
        } else {
            listDiv.innerHTML = selectedDevices.map(d => 
                `<div class="d-flex justify-content-between align-items-center mb-2">
                    <code class="text-primary">${d.serial}</code>
                    <button class="btn btn-sm btn-outline-danger" onclick="removeDevice(${d.phase2DeviceId})">
                        <i class="bi bi-x"></i>
                    </button>
                </div>`
            ).join('');
            document.getElementById('createSlipBtn').disabled = false;
        }
    }

    window.removeDevice = function(deviceId) {
        document.querySelector(`.device-checkbox[data-device-id="${deviceId}"]`).checked = false;
        updateSelectedDevices();
    };

    document.getElementById('selectAllDevices').addEventListener('change', (e) => {
        document.querySelectorAll('.device-checkbox').forEach(cb => {
            cb.checked = e.target.checked;
        });
        updateSelectedDevices();
    });

    // Create picking slip
    document.getElementById('createSlipBtn').addEventListener('click', async () => {
        if (selectedDevices.length === 0) {
            alert('Please select at least one device');
            return;
        }

        const btn = document.getElementById('createSlipBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Creating...';

        try {
            const schoolId = schoolIdInput.value ? parseInt(schoolIdInput.value) : null;
            const requestedDate = document.getElementById('requestedCollectionDate').value || null;
            const notes = document.getElementById('slipNotes').value.trim() || null;
            const reference = slipReference ? slipReference.value.trim() || null : null;

            const resp = await fetch(`${apiBase}/slips`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    schoolId: schoolId,
                    requestedCollectionDate: requestedDate,
                    notes: notes,
                    reference: reference,
                    deviceIds: selectedDevices.map(d => d.phase2DeviceId)
                })
            });

            const result = await resp.json();

            if (!resp.ok) {
                throw new Error(result.message || 'Failed to create picking slip');
            }

            alert(`Picking slip ${result.slip.slipNumber} created successfully!`);
            
            // Reset form
            selectedDevices = [];
            updateSelectedDevices();
            if (slipReference) slipReference.value = '';
            if (requestedCollectionDate) requestedCollectionDate.value = '';
            document.getElementById('slipNotes').value = '';
            schoolSearchInput.value = '';
            schoolIdInput.value = '';
            currentSchool = null;
            if (districtFilter) {
                districtFilter.value = '';
                districtFilter.readOnly = false;
            }

            // Switch to existing slips tab and refresh
            document.getElementById('existing-tab').click();
            loadExistingSlips();
        } catch (error) {
            alert(`Error: ${error.message}`);
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-check-circle me-1"></i>Create Picking Slip';
        }
    });

    // Load existing slips
    async function loadExistingSlips() {
        const tbody = document.querySelector('#slipsTable tbody');
        tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4"><div class="spinner-border spinner-border-sm me-2"></div>Loading...</td></tr>';

        try {
            const params = new URLSearchParams();
            const status = document.getElementById('slipStatusFilter').value;
            const dateFrom = document.getElementById('slipDateFrom').value;
            const dateTo = document.getElementById('slipDateTo').value;
            
            if (status) params.append('status', status);
            if (dateFrom) params.append('dateFrom', dateFrom);
            if (dateTo) params.append('dateTo', dateTo);

            const resp = await fetch(`${apiBase}/slips?${params.toString()}`);
            if (!resp.ok) throw new Error('Failed to load slips');

            const slips = await resp.json();
            tbody.innerHTML = '';

            if (slips.length === 0) {
                document.getElementById('slipsEmptyState').classList.remove('d-none');
                return;
            }

            document.getElementById('slipsEmptyState').classList.add('d-none');

            slips.forEach(slip => {
                const tr = document.createElement('tr');
                const createdDate = new Date(slip.createdAt).toLocaleDateString();
                const statusBadge = getStatusBadge(slip.status);
                
                tr.innerHTML = `
                    <td><code class="text-primary">${slip.slipNumber}</code></td>
                    <td>${slip.schoolName || 'N/A'}</td>
                    <td>${slip.district || 'N/A'}</td>
                    <td>${createdDate}</td>
                    <td>${statusBadge}</td>
                    <td><span class="badge bg-info">${slip.deviceCount}</span></td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary" onclick="openSlipDetail('${slip.id}')">
                            <i class="bi bi-eye"></i> Open
                        </button>
                        <button class="btn btn-sm btn-outline-secondary" onclick="printSlip('${slip.id}')">
                            <i class="bi bi-printer"></i> Print
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (error) {
            console.error('Error loading slips:', error);
            tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger py-4">Error: ${error.message}</td></tr>`;
        }
    }

    function getStatusBadge(status) {
        const badges = {
            'Draft': 'bg-secondary',
            'ReadyForPicking': 'bg-success',
            'PickingInProgress': 'bg-warning',
            'Completed': 'bg-primary',
            'Cancelled': 'bg-danger'
        };
        return `<span class="badge ${badges[status] || 'bg-secondary'}">${status}</span>`;
    }

    window.openSlipDetail = function(slipId) {
        // Use relative path since we're in the Phase 2 UI structure
        window.location.href = `picking-slip-detail.html?id=${slipId}`;
    };

    window.printSlip = function(slipId) {
        // Use relative path since we're in the Phase 2 UI structure
        window.open(`picking-slip-detail.html?id=${slipId}&print=1`, '_blank');
    };

    // Event listeners
    document.getElementById('searchBtn').addEventListener('click', searchDevices);
    document.getElementById('clearFiltersBtn').addEventListener('click', () => {
        schoolSearchInput.value = '';
        schoolIdInput.value = '';
        currentSchool = null;
        if (districtFilter) {
            districtFilter.value = '';
            districtFilter.readOnly = false; // Unlock district field
        }
        document.getElementById('serialFilter').value = '';
        document.getElementById('stageFilter').value = '';
        document.querySelector('#devicesTable tbody').innerHTML = 
            '<tr><td colspan="6" class="text-center text-muted py-4">Use filters above to search for devices</td></tr>';
    });

    document.getElementById('refreshSlipsBtn').addEventListener('click', loadExistingSlips);
    document.getElementById('slipStatusFilter').addEventListener('change', loadExistingSlips);
    document.getElementById('slipDateFrom').addEventListener('change', loadExistingSlips);
    document.getElementById('slipDateTo').addEventListener('change', loadExistingSlips);

    // Load existing slips on tab switch
    document.getElementById('existing-tab').addEventListener('shown.bs.tab', loadExistingSlips);

    // Initial load
    loadExistingSlips();
})();
</script>

<style>
#schoolSearchResults {
    border: 1px solid #dee2e6;
    border-radius: 0.375rem;
    box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
}
.sticky-top {
    position: sticky;
    top: 20px;
}
</style>
