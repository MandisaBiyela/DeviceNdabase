<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-0">Pending Allocations</h2>
            <small class="text-muted">
                Devices in Receipting or Pre-Assessment stages that need storage allocation.
            </small>
        </div>
        <button class="btn btn-outline-primary" id="btnRefresh">
            <i class="bi bi-arrow-clockwise me-1"></i> Refresh
        </button>
    </div>

    <div id="alertContainer"></div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle" id="pendingTable">
                    <thead class="table-light">
                        <tr>
                            <th>Serial</th>
                            <th>Stage</th>
                            <th>School</th>
                            <th>Model</th>
                            <th>Received</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="6" class="text-center text-muted py-4">
                                <div class="spinner-border spinner-border-sm me-2" role="status"></div>
                                Loading pending allocations...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    let currentSerial = null;

    function showAlert(message, type = 'info') {
        const container = document.getElementById('alertContainer');
        container.innerHTML = `
            <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        `;
    }

    function clearAlert() {
        document.getElementById('alertContainer').innerHTML = '';
    }

    async function loadPendingAllocations() {
        const tbody = document.querySelector('#pendingTable tbody');
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4"><div class="spinner-border spinner-border-sm me-2"></div>Loading...</td></tr>';

        try {
            const response = await fetch('/api/phase2/allocation/pending');
            if (!response.ok) {
                throw new Error('Failed to load pending allocations');
            }

            const items = await response.json();
            
            if (!items || items.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center text-muted py-4">
                            <i class="bi bi-check-circle me-2"></i>
                            No pending allocations. All devices have been allocated.
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = '';
            items.forEach(item => {
                const tr = document.createElement('tr');
                const receivedDate = item.receivingDate 
                    ? new Date(item.receivingDate).toLocaleDateString()
                    : 'N/A';
                
                tr.innerHTML = `
                    <td><strong>${item.serial || ''}</strong></td>
                    <td><span class="badge bg-secondary">${item.stage || ''}</span></td>
                    <td>${item.schoolName || 'N/A'}</td>
                    <td>${item.model || 'N/A'}</td>
                    <td>${receivedDate}</td>
                    <td>
                        <button class="btn btn-sm btn-primary" onclick="allocateDevice('${item.serial}', ${item.phase2DeviceId})">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Allocate Now
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (error) {
            console.error('Error loading pending allocations:', error);
            tbody.innerHTML = `
                <tr>
                    <td colspan="6" class="text-center text-danger py-4">
                        <i class="bi bi-exclamation-triangle me-2"></i>
                        Error loading pending allocations: ${error.message}
                    </td>
                </tr>
            `;
        }
    }

    function allocateDevice(serial, phase2DeviceId) {
        currentSerial = serial;
        // Open allocation dashboard with this device pre-selected
        if (typeof loadAllocationView === 'function') {
            loadAllocationView();
            // Set a global variable that the allocation dashboard can check
            window.pendingAllocationSerial = serial;
            window.pendingAllocationPhase2Id = phase2DeviceId;
        } else {
            // Fallback: navigate to external page
            window.location.href = `/phase2/ict-allocation-dashboard.html?serial=${encodeURIComponent(serial)}`;
        }
    }

    document.getElementById('btnRefresh').addEventListener('click', () => {
        clearAlert();
        loadPendingAllocations();
    });

    // Initial load
    loadPendingAllocations();

    // Auto-refresh every 30 seconds
    setInterval(() => {
        loadPendingAllocations();
    }, 30000);
</script>
