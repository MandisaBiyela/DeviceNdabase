<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Stock Batches - Phase 0</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="/css/dashboard-shell.css" />
    
    <style>
        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            font-size: 0.875rem;
            font-weight: 500;
        }
        .status-pending { background-color: #ffc107; color: #000; }
        .status-scanning { background-color: #0dcaf0; color: #000; }
        .status-ready { background-color: #198754; color: #fff; }
        .status-mismatch { background-color: #dc3545; color: #fff; }
        .status-completed { background-color: #6c757d; color: #fff; }
        .item-row {
            background: #f8f9fa;
            padding: 1rem;
            margin-bottom: 0.5rem;
            border-radius: 0.5rem;
            border: 1px solid #dee2e6;
        }
        .item-row:hover {
            background: #e9ecef;
        }
    </style>
</head>
<body class="app-shell">
    <aside class="app-sidebar" id="phase0Sidebar"></aside>

    <div class="app-main">
      <header class="app-header"><div><div class="welcome-line">Phase 0 · NEW</div><div class="welcome-date">New Stock Batches</div></div><div class="header-right"><button class="avatar-btn"><span class="avatar-initials">P0</span></button></div></header>
      <main class="app-content">
    <div class="container-fluid">
        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2><i class="bi bi-box"></i> New Stock Batches</h2>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createBatchModal">
                        <i class="bi bi-plus-circle"></i> Create Batch
                    </button>
                </div>

                <!-- Alert -->
                <div id="alertContainer"></div>

                <!-- Batches List -->
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">All Batches</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>Batch Number</th>
                                        <th>Supplier</th>
                                        <th>Invoice</th>
                                        <th>Expected Qty</th>
                                        <th>Scanned Qty</th>
                                        <th>Status</th>
                                        <th>Created</th>
                                        <th>GRV</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="batchesTableBody">
                                    <tr>
                                        <td colspan="9" class="text-center">
                                            <div class="spinner-border text-primary" role="status">
                                                <span class="visually-hidden">Loading...</span>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Batch Modal -->
    <div class="modal fade" id="createBatchModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Create New Stock Batch</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="createBatchForm">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Supplier Name</label>
                                <input type="text" class="form-control" id="supplierName" placeholder="e.g., HP South Africa">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Invoice Number</label>
                                <input type="text" class="form-control" id="invoiceNumber" placeholder="e.g., INV-2025-001">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Expected Delivery Date</label>
                            <input type="date" class="form-control" id="expectedDeliveryDate">
                        </div>

                        <hr>
                        <h6>Item Lines</h6>
                        <div id="itemsContainer">
                            <!-- Items will be added here -->
                        </div>
                        <button type="button" class="btn btn-sm btn-outline-primary" id="addItemBtn">
                            <i class="bi bi-plus"></i> Add Item
                        </button>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveBatchBtn">
                        <i class="bi bi-save"></i> Create Batch
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- View Batch Modal -->
    <div class="modal fade" id="viewBatchModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Batch Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="batchDetailsContent">
                    <!-- Batch details will be loaded here -->
                </div>
            </div>
        </div>
    </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/phase0/js/sidebar.js"></script>
    <script src="/phase0/js/new-stock-batch.js"></script>
</body>
    
</html>
