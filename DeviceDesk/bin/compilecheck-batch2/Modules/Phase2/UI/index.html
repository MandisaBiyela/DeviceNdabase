<!DOCTYPE html>
<html lang="en">

<body class="app-shell">
    <aside class="app-sidebar">
        <div class="sidebar-brand-global">

        <!-- Profile Block -->

        </main>

    <!-- Global Phase 2 helpers: must load BEFORE dynamic views -->
    <script>
    window.formatLocalTime = function(dateString) {
        if (!dateString) return "—";
        const d = new Date(dateString);
        if (isNaN(d.getTime())) return dateString;
        return d.toLocaleString([], {
            year: "numeric",
            month: "short",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
        });
    };
    console.log("Global formatLocalTime loaded:", typeof window.formatLocalTime);
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentUser = null;

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', async () => {
            await loadCurrentUser();
        });

        async function loadCurrentUser() {
            try {
                const response = await fetch('/api/auth/current-user');
                if (!response.ok) {
                    window.location.href = '/login.html';
                    return;
                }
                currentUser = await response.json();
                document.getElementById('userInfo').textContent = `${currentUser.fullName} (${currentUser.role})`;
                
                // Update profile block
                const initials = currentUser.fullName ? currentUser.fullName.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase() : 'U';
                document.getElementById('profileInitials').textContent = initials;
                document.getElementById('profileName').textContent = currentUser.fullName || 'User';
                document.getElementById('profileRole').textContent = currentUser.role || 'User';
                const pSk = document.getElementById('profileNameSkeleton');
                if (pSk) pSk.style.display = 'none';
                document.getElementById('sidebarProfile')?.classList.remove('p2-loading');
                
                // Load role-specific UI
                loadRoleBasedUI();
            } catch (error) {
                console.error('Error loading user:', error);
                window.location.href = '/index.html';
            }
        }

        function loadRoleBasedUI() {
            const role = currentUser.role;
            
            // Load sidebar menu
            const sidebar = document.getElementById('sidebar');
            
            if (role === 'IctClerk') {
                sidebar.innerHTML = `
                    <span class="sidebar-section">CLERK MENU</span>
                    <a href="#" class="sidebar-link active" data-clerk-link="receipting" onclick="setActiveClerkNav('receipting'); loadReceiptingView(); return false;">
                        <i data-lucide="clipboard-check"></i><span>To Receipting</span>
                    </a>
                    <a href="#" class="sidebar-link" data-clerk-link="devices" onclick="setActiveClerkNav('devices'); loadDevicesView(); return false;">
                        <i data-lucide="monitor"></i><span>View Devices</span>
                    </a>
                    <a href="#" class="sidebar-link" data-clerk-link="scanout" onclick="setActiveClerkNav('scanout'); loadScanOutView(); return false;">
                        <i data-lucide="scan-line"></i><span>Scan Out</span>
                    </a>
                    <a href="#" class="sidebar-link" data-clerk-link="dispatch" onclick="setActiveClerkNav('dispatch'); loadScanOutView(); return false;">
                        <i data-lucide="truck"></i><span>Dispatch</span>
                    </a>
                    <a href="/phase2/users.html" class="sidebar-link" data-clerk-link="incidents">
                        <i data-lucide="alert-triangle"></i><span>Manage Incidents</span>
                    </a>
                `;
                loadReceiptingView();
            } else if (role === 'IctInspector') {
                sidebar.innerHTML = `
                    <h6 class="text-muted mb-3">INSPECTOR MENU</h6>
                    <div class="list-group list-group-flush">
                        <a href="#" class="list-group-item list-group-item-action" onclick="loadPreAssessmentView(); return false;">
                            <i class="bi bi-search"></i> Pre-Assessment
                        </a>
                        <a href="#" class="list-group-item list-group-item-action" onclick="loadQualityView(); return false;">
                            <i class="bi bi-check-circle"></i> Quality Assessment
                        </a>
                        <a href="#" class="list-group-item list-group-item-action" onclick="loadInspectorMyWorkView(); return false;">
                            <i class="bi bi-clock-history"></i> My Work (Inspector)
                        </a>
                    </div>
                `;
                loadPreAssessmentView();
            } else if (role === 'IctTechnician') {
                sidebar.innerHTML = `
                    <h6 class="text-muted mb-3">TECHNICIAN MENU</h6>
                    <div class="list-group list-group-flush">
                        <a href="#" class="list-group-item list-group-item-action" onclick="loadDetailedInspectionView(); return false;">
                            <i class="bi bi-tools"></i> Detailed Inspection
                        </a>
                        <a href="#" class="list-group-item list-group-item-action" onclick="loadTechMyWorkView(); return false;">
                            <i class="bi bi-clock-history"></i> My Work (Technician)
                        </a>
                        <a href="#" class="list-group-item list-group-item-action" onclick="loadDisposalRequestView(); return false;">
                            <i class="bi bi-trash"></i> Request Disposal
                        </a>
                    </div>
                `;
                loadTechMyWorkView();
            } else if (role === 'IctAllocator') {
                sidebar.innerHTML = `
                    <a href="#" class="sidebar-link active" onclick="loadPendingAllocationsView(); return false;">
                        <i class="bi bi-list-check"></i>
                        <span>Pending Allocations</span>
                    </a>
                    <a href="#" class="sidebar-link" onclick="loadAllocationView(); return false;">
                        <i class="bi bi-search"></i>
                        <span>Allocate Storage</span>
                    </a>
                    <a href="#" class="sidebar-link" onclick="loadStorageOverviewView(); return false;">
                        <i class="bi bi-grid-3x3-gap"></i>
                        <span>Storage Overview</span>
                    </a>
                    <a href="#" class="sidebar-link" onclick="loadUnallocatedDevicesView(); return false;">
                        <i class="bi bi-exclamation-triangle"></i>
                        <span>Unallocated Devices</span>
                    </a>
                    <a href="#" class="sidebar-link" onclick="loadSchoolsInStorageView(); return false;">
                        <i class="bi bi-building"></i>
                        <span>Schools in Storage</span>
                    </a>
                    <a href="#" class="sidebar-link" onclick="loadStorageTemplatesView(); return false;">
                        <i class="bi bi-gear"></i>
                        <span>Zones</span>
                    </a>
                    <a href="#" class="sidebar-link" onclick="loadBulkAllocationView(); return false;">
                        <i class="bi bi-stack"></i>
                        <span>Bulk Allocation</span>
                    </a>
                    <a href="#" class="sidebar-link" onclick="loadDeviceScannerView(); return false;">
                        <i class="bi bi-upc-scan"></i>
                        <span>Device Location</span>
                    </a>
                    <a href="#" class="sidebar-link" onclick="loadPickingSlipsView(); return false;">
                        <i class="bi bi-clipboard-list"></i>
                        <span>Picking Slips</span>
                    </a>
                `;
                loadPendingAllocationsView();
            } else {
                sidebar.innerHTML = `<p class="text-muted">No menu available for this role.</p>`;
                document.getElementById('mainContent').innerHTML = `
                    <div class="alert alert-warning">
                        <i class="bi bi-exclamation-triangle"></i> Your role (${role}) does not have access to this dashboard.
                    </div>
                `;
            }
            if (window.lucide && typeof window.lucide.createIcons === 'function') window.lucide.createIcons();
        }

        function setActiveClerkNav(key) {
            document.querySelectorAll('[data-clerk-link]').forEach((link) => {
                link.classList.toggle('active', link.getAttribute('data-clerk-link') === key);
            });
        }

        async function logout() {
            try {
                await fetch('/api/auth/logout', { method: 'POST' });
            } catch (e) {
                console.warn('Logout request aborted or failed:', e);
            } finally {
                window.location.href = '/login.html';
            }
        }

        // Helper: render HTML and execute embedded <script> tags in order
        async function renderWithScripts(targetId, html) {
            const container = document.getElementById(targetId);
            const temp = document.createElement('div');
            temp.innerHTML = html;

            // Remove previously injected view scripts to avoid accumulation
            document.querySelectorAll('script[data-view-script="true"]').forEach(s => s.remove());

            // Extract scripts from the fetched fragment
            const scripts = Array.from(temp.querySelectorAll('script'));
            scripts.forEach(s => s.parentNode.removeChild(s));

            // Inject remaining HTML
            container.innerHTML = temp.innerHTML;

            // Re-insert scripts sequentially; await external script loads
            for (const oldScript of scripts) {
                const newScript = document.createElement('script');
                newScript.setAttribute('data-view-script', 'true');
                if (oldScript.type) newScript.type = oldScript.type;
                if (oldScript.src) {
                    newScript.src = oldScript.src;
                    newScript.async = false;
                    const loaded = new Promise(resolve => {
                        newScript.onload = () => resolve();
                        newScript.onerror = () => { console.error('Failed to load script:', newScript.src); resolve(); };
                    });
                    container.appendChild(newScript);
                    await loaded;
                } else {
                    newScript.textContent = oldScript.textContent;
                    container.appendChild(newScript);
                }
            }

            // Initialize only when expected containers exist to avoid cross-view errors
            if (typeof window.initReceiptingView === 'function' &&
                document.getElementById('grvListContainer')) {
                try { window.initReceiptingView(); } catch (e) { console.error('initReceiptingView error:', e); }
            }

            if (typeof window.loadPendingGRVs === 'function' &&
                document.getElementById('grvListContainer')) {
                try { window.loadPendingGRVs(); } catch (e) { console.error('loadPendingGRVs init error:', e); }
            }

            if (typeof window.loadDevices === 'function' &&
                (document.getElementById('filterStage') || document.getElementById('devicesList'))) {
                try { window.loadDevices(); } catch (e) { console.error('loadDevices init error:', e); }
            }
            if (window.lucide && typeof window.lucide.createIcons === 'function') window.lucide.createIcons();
        }

        // View loaders - implemented via HTML fragments that may contain scripts
        async function loadReceiptingView() {
            try {
                const r = await fetch('receipting.html');
                const html = await r.text();
                await renderWithScripts('mainContent', html);
            } catch { showPlaceholder('Receipting'); }
        }

        async function loadPreAssessmentView() {
            try {
                const r = await fetch('pre-assessment.html');
                const html = await r.text();
                await renderWithScripts('mainContent', html);
            } catch { showPlaceholder('Pre-Assessment'); }
        }

        // Globals for read-only context when opening detail views from history
        window.currentDetailedDeviceId = null;
        window.currentDetailedReadOnly = false;

        async function loadDetailedInspectionView(deviceId, readOnly) {
            window.currentDetailedDeviceId = deviceId || null;
            window.currentDetailedReadOnly = !!readOnly;
            try {
                const r = await fetch('detailed-inspection.html');
                const html = await r.text();
                await renderWithScripts('mainContent', html);
            } catch { showPlaceholder('Detailed Inspection'); }
        }

        window.currentQaDeviceId = null;

        async function loadQualityView(deviceId, readOnly) {

        // New: My Work loaders
        async function loadTechMyWorkView() {

                const r = await fetch('my-work-technician.html');

            } catch { showPlaceholder('My Work (Technician)'); }
        }

        async function loadInspectorMyWorkView() {

                const r = await fetch('my-work-inspector.html');
                const html = await r.text();
                await renderWithScripts('mainContent', html);
            } catch { showPlaceholder('My Work (Inspector)'); }
        }

        // ICT Allocator view loaders
        function setActiveAllocatorNav(linkSelector) {
            const links = document.querySelectorAll('#sidebar .sidebar-link');
            links.forEach(l => l.classList.remove('active'));
            const activeLink = typeof linkSelector === 'string' 
                ? document.querySelector(linkSelector)
                : linkSelector;
            if (activeLink) activeLink.classList.add('active');
        }

        async function loadPendingAllocationsView() {
            setActiveAllocatorNav('#sidebar .sidebar-link:first-child');
            try {
                const r = await fetch('allocator/pending-allocations.html');
                const html = await r.text();
                await renderWithScripts('mainContent', html);
            } catch { showPlaceholder('Pending Allocations'); }
        }

        async function loadAllocationView(serial = '') {
            const links = document.querySelectorAll('#sidebar .sidebar-link');
            setActiveAllocatorNav(links[1]); // Second link (Allocate Storage)
            window.pendingSerial = serial;
            try {
                const r = await fetch('allocator/allocate-storage.html');
                let html = await r.text();
                if (serial) {
                    html = html.replace('id="serialInput"', `id="serialInput" value="${serial}"`);
                }
                await renderWithScripts('mainContent', html);
            } catch { 
                showPlaceholder('Allocate Storage');
            }
        }

        async function loadStorageOverviewView() {

            try {

            try {

        async function loadBulkAllocationView() {
            const links = document.querySelectorAll('#sidebar .sidebar-link');

            try {

                const html = await r.text();
                await renderWithScripts('mainContent', html);
            } catch { showPlaceholder('Bulk Allocation'); }
        }
        
        // Expose to window for access from loaded views
        window.loadBulkAllocationView = loadBulkAllocationView;

        async function loadDeviceScannerView() {
            const links = document.querySelectorAll('#sidebar .sidebar-link');
            setActiveAllocatorNav(links[7]); // Eighth link (Device Location)
            try {
                const r = await fetch('allocator/device-scanner.html');

                await renderWithScripts('mainContent', html);
            } catch { showPlaceholder('Device Location'); }
        }

        async function loadPickingSlipsView() {
            const links = document.querySelectorAll('#sidebar .sidebar-link');
            setActiveAllocatorNav(links[8]); // Ninth link (Picking Slips)
            try {
                const r = await fetch('allocator/picking-slips.html');
                const html = await r.text();
                await renderWithScripts('mainContent', html);
            } catch { showPlaceholder('Picking Slips'); }
        }

        // Make loadAllocationView globally available for cross-page navigation
        window.loadAllocationView = loadAllocationView;

        // Global function for opening allocate storage with serial pre-filled
        function openAllocateForSerial(serial) {
            if (!serial) return;
            // Use the existing loadAllocationView function which handles serial pre-filling
            if (typeof loadAllocationView === 'function') {
                loadAllocationView(serial);
            } else {
                // Fallback: navigate to allocate storage page with query param
                window.location.href = '/phase2/allocator/allocate-storage.html?serial=' + encodeURIComponent(serial);
            }
        }
        window.openAllocateForSerial = openAllocateForSerial;

        // Hook used by My Work views to open technician detail inside dashboard (supports read-only)
        async function loadTechDetailFromHistory(deviceId, readOnly = true) {
            const numericId = Number.parseInt(String(deviceId), 10);
            window.currentDetailedDeviceId = Number.isNaN(numericId) ? (deviceId || null) : numericId;
            window.currentDetailedReadOnly = !!readOnly;
            const idForUrl = Number.isNaN(numericId) ? deviceId : numericId;
            const url = `technician-detail.html?deviceId=${encodeURIComponent(idForUrl)}`;
            try {
                const r = await fetch(url);
                const html = await r.text();
                await renderWithScripts('mainContent', html);
            } catch { showPlaceholder('Detailed Inspection'); }
        }

        // Inspector detail from history → reuse technician detail in read-only mode
        async function loadInspectorDetailFromHistory(deviceId, readOnly = true) {
            const numericId = Number.parseInt(String(deviceId), 10);
            window.currentDetailedDeviceId = Number.isNaN(numericId) ? (deviceId || null) : numericId;
            window.currentDetailedReadOnly = !!readOnly;
            const idForUrl = Number.isNaN(numericId) ? deviceId : numericId;
            const url = `technician-detail.html?deviceId=${encodeURIComponent(idForUrl)}&readOnly=1`;
            try {
                const r = await fetch(url);
                const html = await r.text();
                await renderWithScripts('mainContent', html);
            } catch { showPlaceholder('Inspector Device Detail'); }
        }

        // Initialize dashboard from query string when accessed via redirected detail pages
        (function initFromQuery() {
            try {
                const qs = new URLSearchParams(location.search);
                const view = qs.get('view');
                const deviceId = qs.get('deviceId');
                const readOnly = qs.get('readOnly') === '1';

                if (view === 'technician-detail' && deviceId) {
                    loadTechDetailFromHistory(deviceId, readOnly);
                    return;
                }
                if (view === 'inspector-detail' && deviceId) {
                    // Inspector detail is always read-only in this flow
                    loadInspectorDetailFromHistory(deviceId, true);
                    return;
                }
            } catch {}
        })();

        function showPlaceholder(viewName) {
            document.getElementById('mainContent').innerHTML = `
                <div class="alert alert-info">
                    <i class="bi bi-info-circle"></i> ${viewName} view is loading...
                </div>
            `;
        }
    </script>
</body>
