<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h2 class="mb-0">Pending Allocations</h2>
            <small class="text-muted">
                Devices in Receipting / Pre-Assessment without storage allocation in the ICT centre.
            </small>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-success btn-sm" id="batchAllocateBtn" style="display:none;">
                <i class="bi bi-check2-square"></i> Batch Allocate Selected
            </button>
            <button class="btn btn-outline-secondary btn-sm" id="refreshBtn">
                <i class="bi bi-arrow-clockwise"></i> Refresh
            </button>
        </div>
    </div>
    <div class="card shadow-sm">
        <div class="card-body">
            <div class="mb-3 d-flex">
                <input type="text" class="form-control me-2" id="filterInput"
                       placeholder="Filter by serial, school or model">
                <button class="btn btn-primary btn-sm" id="filterClearBtn">
                    Clear
                </button>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle" id="pendingTable">
                    <thead>
                        <tr>
                            <th style="width: 40px;">
                                <input type="checkbox" id="selectAllCheckbox" title="Select All">
                            </th>
                            <th>Serial</th>
                            <th>Model</th>
                            <th>School</th>
                            <th>Stage</th>
                            <th>Received</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Rows injected by JS -->
                    </tbody>
                </table>
            </div>
            <div id="emptyState" class="text-center text-muted py-4 d-none">
                No devices currently need allocation.
            </div>
        </div>
    </div>
</div>

<!-- Batch Allocation Modal - REMOVED: Direct navigation to bulk-allocation.html instead -->

<!-- Batch Allocation Results Modal -->
<div class="modal fade" id="batchAllocationResultsModal" tabindex="-1">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title">
                    <i class="bi bi-check-circle me-2"></i>Batch Allocation Results
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="batchAllocationResults">
                    <!-- Results will be injected here -->
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" id="printAllLabelsBtn" style="display:none;">
                    <i class="bi bi-printer me-1"></i>Print All Labels
                </button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    <i class="bi bi-x-circle me-1"></i>Close
                </button>
            </div>
        </div>
    </div>
</div>

<style>

    border-radius: 0.375rem;
}

<script>
(function() {
    'use strict';
    const apiBase = '/api/phase2/allocation';
    let isLoading = false;
    let currentPendingDevices = []; // Store current devices for batch operations
    let refreshInterval = null;
    let initRetryCount = 0;
    const MAX_INIT_RETRIES = 10; // Stop retrying after 10 attempts (1 second)
    
    // Debug logs to verify script loaded
    console.log('Pending allocations script loaded');
    console.log('Batch allocate button exists:', !!document.getElementById('batchAllocateBtn'));
    console.log('Current pending devices count:', currentPendingDevices?.length || 0);
    
    // CRITICAL: Prevent any Batch Allocation Summary modal from appearing
    // Override Bootstrap Modal.show() to block the summary modal
    if (typeof bootstrap !== 'undefined' && bootstrap.Modal) {
        const originalModalShow = bootstrap.Modal.prototype.show;
        bootstrap.Modal.prototype.show = function() {
            const modalElement = this._element;
            // Block ANY modal with "Batch Allocation Summary" in the title
            if (modalElement) {
                const title = modalElement.querySelector('.modal-title');
                const titleText = title ? title.textContent || title.innerText || '' : '';
                const modalId = modalElement.id || '';
                
                if (titleText.includes('Batch Allocation Summary') || 
                    modalId.includes('batchAllocate') ||
                    modalElement.querySelector('[id*="batchAllocationSummary"]')) {
                    console.warn('[PendingAllocations] BLOCKED: Attempt to show Batch Allocation Summary modal');
                    console.warn('[PendingAllocations] Modal element:', modalElement);
                    return; // Block the modal
                }
            }
            return originalModalShow.call(this);
        };
        console.log('[PendingAllocations] Modal blocker installed');
    }
    
    // Also prevent modals from being created/shown via direct DOM manipulation
    const observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
            mutation.addedNodes.forEach(function(node) {
                if (node.nodeType === 1) { // Element node
                    // Check if it's a modal with Batch Allocation Summary
                    if (node.classList && node.classList.contains('modal')) {
                        const title = node.querySelector('.modal-title');
                        if (title && (title.textContent || title.innerText || '').includes('Batch Allocation Summary')) {
                            console.warn('[PendingAllocations] BLOCKED: Modal with Batch Allocation Summary detected, removing');
                            node.remove();
                        }
                    }
                    // Check children too
                    const batchModals = node.querySelectorAll && node.querySelectorAll('.modal');
                    if (batchModals) {
                        batchModals.forEach(function(modal) {
                            const title = modal.querySelector('.modal-title');
                            if (title && (title.textContent || title.innerText || '').includes('Batch Allocation Summary')) {
                                console.warn('[PendingAllocations] BLOCKED: Child modal with Batch Allocation Summary detected, removing');
                                modal.remove();
                            }
                        });
                    }
                }
            });
        });
    });
    
    // Start observing
    observer.observe(document.body, {
        childList: true,
        subtree: true
    });
    console.log('[PendingAllocations] MutationObserver installed to block Batch Allocation Summary modals');

    // Check if this view is actually active
    function isViewActive() {
        const tbody = document.querySelector('#pendingTable tbody');
        return tbody !== null;
    }

    function showLoading() {
        const tbody = document.querySelector('#pendingTable tbody');
        const emptyState = document.getElementById('emptyState');
        if (!tbody) {
            return; // Silently return if view not active
        }
        tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4"><div class="spinner-border spinner-border-sm me-2"></div>Loading...</td></tr>';
        if (emptyState) {
            emptyState.classList.add('d-none');
        }
    }

    function showError(message) {
        const tbody = document.querySelector('#pendingTable tbody');
        const emptyState = document.getElementById('emptyState');
        if (!tbody) {
            return; // Silently return if view not active
        }
        tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger py-4"><i class="bi bi-exclamation-triangle me-2"></i>${message}</td></tr>`;
        if (emptyState) {
            emptyState.classList.add('d-none');
        }
    }

    async function loadPendingAllocations() {
        // Only run if view is active
        if (!isViewActive()) {
            return;
        }
        
        if (isLoading) return; // Prevent concurrent loads
        isLoading = true;
        showLoading();

        try {
            // Add cache-busting to prevent stale data
            const timestamp = new Date().getTime();
            const resp = await fetch(`${apiBase}/pending?t=${timestamp}`, {
                cache: 'no-cache',
                headers: { 'Cache-Control': 'no-cache', 'Pragma': 'no-cache' }
            });
            
            if (!resp.ok) {
                throw new Error(`Failed to load: ${resp.status} ${resp.statusText}`);
            }
            
            const data = await resp.json();
            const tbody = document.querySelector('#pendingTable tbody');
            const emptyState = document.getElementById('emptyState');
            
            // Double-check view is still active after async operation
            if (!tbody || !isViewActive()) {
                isLoading = false;
                return;
            }
            
            tbody.innerHTML = '';

            if (!data || data.length === 0) {
                if (emptyState) {
                    emptyState.classList.remove('d-none');
                }
                isLoading = false;
                return;
            }

            if (emptyState) {
                emptyState.classList.add('d-none');
            }

            // Store devices for batch operations
            currentPendingDevices = data;

            data.forEach((item, index) => {
                const tr = document.createElement('tr');
                const receivedDate = item.receivingDate 
                    ? new Date(item.receivingDate).toLocaleDateString()
                    : '-';
                const daysInPhase2 = item.receivingDate 
                    ? Math.floor((new Date() - new Date(item.receivingDate)) / (1000 * 60 * 60 * 24))
                    : '-';

                tr.innerHTML = `
                    <td>
                        <input type="checkbox" class="device-checkbox" data-phase2-id="${item.phase2DeviceId}" data-index="${index}">
                    </td>
                    <td>${item.serial || item.serialNumber || '-'}</td>
                    <td>${item.model || '-'}</td>
                    <td>${item.schoolName || '-'}</td>
                    <td><span class="badge bg-secondary">${item.stage || '-'}</span></td>
                    <td>${receivedDate} ${daysInPhase2 !== '-' ? `(${daysInPhase2} days)` : ''}</td>
                    <td class="text-end">
                        <button class="btn btn-sm btn-outline-primary"
                                onclick="if (typeof openAllocateForSerial === 'function') { 
                                             openAllocateForSerial('${(item.serial || item.serialNumber || '').replace(/'/g, "\\'")}'); 
                                         } else if (typeof loadAllocationView === 'function') { 
                                             loadAllocationView('${(item.serial || item.serialNumber || '').replace(/'/g, "\\'")}'); 
                                         } else { 
                                             window.location.href = '/phase2/index.html'; 
                                         }">
                            Allocate
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            // Update batch allocate button visibility
            updateBatchAllocateButton();
        } catch (error) {
            console.error('Error loading pending allocations:', error);
            showError(`Error loading pending allocations: ${error.message}`);
        } finally {
            isLoading = false;
        }
    }

    const refreshBtn = document.getElementById('refreshBtn');
    if (refreshBtn) {
        refreshBtn.addEventListener('click', () => {
            loadPendingAllocations();
        });
    }
    
    const filterInput = document.getElementById('filterInput');
    if (filterInput) {
        filterInput.addEventListener('input', () => {
            const term = filterInput.value.toLowerCase();
            const rows = document.querySelectorAll('#pendingTable tbody tr');
            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(term) ? '' : 'none';
            });
        });
    }
    
    const filterClearBtn = document.getElementById('filterClearBtn');
    if (filterClearBtn) {
        filterClearBtn.addEventListener('click', () => {
            if (filterInput) {
                filterInput.value = '';
            }
            const rows = document.querySelectorAll('#pendingTable tbody tr');
            rows.forEach(row => row.style.display = '');
        });
    }

    // Select all checkbox handler
    const selectAllCheckbox = document.getElementById('selectAllCheckbox');
    if (selectAllCheckbox) {
        selectAllCheckbox.addEventListener('change', (e) => {
            const checkboxes = document.querySelectorAll('.device-checkbox');
            checkboxes.forEach(cb => cb.checked = e.target.checked);
            updateBatchAllocateButton();
        });
    }

    // Individual checkbox handlers
    document.addEventListener('change', (e) => {
        if (e.target.classList.contains('device-checkbox')) {
            updateBatchAllocateButton();
            updateSelectAllCheckbox();
        }
    });

    function updateBatchAllocateButton() {
        const batchBtn = document.getElementById('batchAllocateBtn');
        const checked = document.querySelectorAll('.device-checkbox:checked').length;
        if (batchBtn) {
            batchBtn.style.display = checked > 0 ? 'block' : 'none';
            if (checked > 0) {
                batchBtn.textContent = `Batch Allocate (${checked} selected)`;
            }
        }
    }

    function updateSelectAllCheckbox() {
        const selectAll = document.getElementById('selectAllCheckbox');
        const checkboxes = document.querySelectorAll('.device-checkbox');
        const checked = document.querySelectorAll('.device-checkbox:checked').length;
        if (selectAll && checkboxes.length > 0) {
            selectAll.checked = checked === checkboxes.length;
            selectAll.indeterminate = checked > 0 && checked < checkboxes.length;
        }
    }

    // Batch allocate button handler - Navigate to bulk allocation page
    // Use a more robust approach to ensure only our handler is attached
    // SIMPLIFIED getSelectedDevices function with better logging
    function getSelectedDevices() {
        const selectedDevices = [];
        const checkboxes = document.querySelectorAll('.device-checkbox:checked');
        
        console.log('Found checked checkboxes:', checkboxes.length);
        
        checkboxes.forEach(checkbox => {
            const phase2Id = parseInt(checkbox.getAttribute('data-phase2-id'));
            console.log('Processing checkbox with phase2Id:', phase2Id);
            
            if (isNaN(phase2Id)) {
                console.warn('Invalid phase2Id found');
                return;
            }
            
            // Find device in currentPendingDevices
            const device = currentPendingDevices?.find(d => d.phase2DeviceId === phase2Id);
            if (device) {
                selectedDevices.push({
                    id: device.phase2DeviceId,
                    serial: device.serial || device.serialNumber || '',
                    phase2Id: device.phase2DeviceId,
                    schoolId: device.schoolId,
                    schoolName: device.schoolName || 'No School Linked',
                    model: device.model || 'Unknown Model',
                    stage: device.stage || 'Unknown'
                });
                console.log('Added device:', device.serial || device.serialNumber);
            } else {
                console.warn('Device not found in currentPendingDevices for phase2Id:', phase2Id);
            }
        });
        
        console.log('Final selected devices:', selectedDevices);
        return selectedDevices;
    }

    // SIMPLIFIED BATCH ALLOCATION NAVIGATION - DIRECT REDIRECT
    function setupBatchAllocateButton() {
        const batchAllocateBtn = document.getElementById('batchAllocateBtn');
        if (!batchAllocateBtn) {
            console.warn('Batch allocate button not found');
            return;
        }

        // Remove ALL existing event listeners and attributes
        const newBtn = batchAllocateBtn.cloneNode(true);
        batchAllocateBtn.parentNode.replaceChild(newBtn, batchAllocateBtn);

        // Clean all attributes that might interfere
        newBtn.removeAttribute('data-bs-toggle');
        newBtn.removeAttribute('data-bs-target');
        newBtn.removeAttribute('data-toggle');
        newBtn.removeAttribute('data-target');
        newBtn.removeAttribute('onclick');
        newBtn.removeAttribute('href');

        // Add DIRECT click handler - IMMEDIATE REDIRECT, NO DELAYS
        newBtn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            
            console.log('[BATCH ALLOCATE] Button clicked - starting immediate redirect');
            
            // IMMEDIATELY prevent any modal from showing
            const allModals = document.querySelectorAll('.modal');
            allModals.forEach(modal => {
                if (modal.classList.contains('show') || modal.style.display !== 'none') {
                    modal.classList.remove('show');
                    modal.style.display = 'none';
                    const backdrop = document.querySelector('.modal-backdrop');
                    if (backdrop) backdrop.remove();
                }
            });
            
            // Get selected devices
            const selectedDevices = getSelectedDevices();
            console.log('[BATCH ALLOCATE] Selected devices:', selectedDevices);
            
            // Basic validation
            if (selectedDevices.length === 0) {
                alert('Please select at least one device to allocate.');
                return false;
            }

            // School validation
            const schools = [...new Set(selectedDevices.map(d => d.schoolId).filter(id => id != null))];
            if (schools.length > 1) {
                alert('Selected devices belong to different schools. Please select devices from the same school.');
                return false;
            }

            // Store devices in localStorage for bulk allocation page
            try {
                localStorage.setItem('bulkAllocationDevices', JSON.stringify(selectedDevices));
                if (schools.length === 1) {
                    localStorage.setItem('bulkAllocationSchoolId', schools[0].toString());
                }
                console.log('[BATCH ALLOCATE] Devices stored in localStorage:', selectedDevices.length);
            } catch (storageError) {
                console.error('[BATCH ALLOCATE] LocalStorage error:', storageError);
                alert('Error saving selection. Please try again.');
                return false;
            }

            // IMMEDIATE REDIRECT - Use correct path for SPA
            console.log('[BATCH ALLOCATE] Redirecting NOW to bulk allocation page');
            
            // Try SPA navigation first (if available)
            if (typeof window.loadBulkAllocationView === 'function') {
                console.log('[BATCH ALLOCATE] Using SPA navigation');
                try {
                    window.loadBulkAllocationView();
                    return false;
                } catch (err) {
                    console.error('[BATCH ALLOCATE] SPA navigation failed:', err);
                }
            }
            
            // Fallback: Use correct absolute path
            const currentPath = window.location.pathname;
            let redirectPath = '/phase2/allocator/bulk-allocation.html';
            
            // If we're already in phase2, use relative path
            if (currentPath.includes('/phase2/')) {
                redirectPath = 'allocator/bulk-allocation.html';
            }
            
            console.log('[BATCH ALLOCATE] Using direct redirect to:', redirectPath);
            window.location.href = redirectPath;
            
            return false;
        }, true); // Use capture phase to run before any other handlers

        console.log('Batch allocate button setup complete');
    }
    
    // Setup the button when DOM is ready
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', setupBatchAllocateButton);
    } else {
        setupBatchAllocateButton();
    }

    // Print storage label function (adapted from allocate-storage.html)
    async function printStorageLabel(allocationData, deviceInfo) {
        try {
            console.log('[PrintLabel] Starting print for device:', deviceInfo.serial);
            const building = allocationData.building || '';
            const room = allocationData.room || '';
            const rack = allocationData.rack || '';
            const shelf = allocationData.shelf || '';
            const bin = allocationData.bin || '';
            const serial = deviceInfo.serial || 'N/A';
            const school = deviceInfo.schoolName || 'No School Linked';
            const date = new Date().toLocaleDateString('en-US', { 
                year: 'numeric', 
                month: 'short', 
                day: 'numeric' 
            });

            // Build URL with parameters
            const labelUrl = `/phase2/allocator/storage-label.html?` +
                `serial=${encodeURIComponent(serial)}&` +
                `school=${encodeURIComponent(school)}&` +
                `building=${encodeURIComponent(building)}&` +
                `room=${encodeURIComponent(room)}&` +
                `rack=${encodeURIComponent(rack)}&` +
                `shelf=${encodeURIComponent(shelf)}&` +
                `bin=${encodeURIComponent(bin)}&` +
                `date=${encodeURIComponent(date)}`;

            console.log('[PrintLabel] Label URL:', labelUrl);

            // Open label in new window and print
            const printWindow = window.open(labelUrl, '_blank', 'width=400,height=300');
            
            if (printWindow) {
                console.log('[PrintLabel] Print window opened successfully');
                // Wait for window to load, then trigger print
                return new Promise((resolve) => {
                    let resolved = false;
                    printWindow.onload = function() {
                        if (resolved) return;
                        console.log('[PrintLabel] Print window loaded, triggering print');
                        setTimeout(() => {
                            try {
                                printWindow.print();
                                console.log('[PrintLabel] Print dialog triggered');
                                // Close window after a delay (user may cancel print)
                                setTimeout(() => {
                                    printWindow.close();
                                    if (!resolved) {
                                        resolved = true;
                                        resolve(true);
                                    }
                                }, 1000);
                        } catch (err) {
                                console.error('[PrintLabel] Error triggering print:', err);
                                if (!resolved) {
                                    resolved = true;
                                    resolve(false);
                                }
                            }
                        }, 500);
                    };
                    // Fallback timeout
                    setTimeout(() => {
                        if (!resolved) {
                            resolved = true;
                            console.warn('[PrintLabel] Timeout waiting for print window');
                            resolve(false);
                        }
                    }, 5000);
                });
            } else {
                console.warn('[PrintLabel] Popup blocked. Please allow popups to print labels automatically.');
                return false;
            }
        } catch (err) {
            console.error('[PrintLabel] Print label error:', err);
            return false;
        }
    }

    // Show batch allocation results with label printing
    function showBatchAllocationResults(result, deviceInfoMap) {
        const modal = new bootstrap.Modal(document.getElementById('batchAllocationResultsModal'));
        const resultsDiv = document.getElementById('batchAllocationResults');
        
        if (!resultsDiv) return;

        const succeeded = result.results.filter(r => r.success);
        const failed = result.results.filter(r => !r.success);

        let html = `
            <div class="mb-4">
                <div class="row g-3">
                    <div class="col-md-4">
                        <div class="card border-primary">
                            <div class="card-body text-center">
                                <h3 class="text-primary mb-0">${result.total}</h3>
                                <small class="text-muted">Total Devices</small>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card border-success">
                            <div class="card-body text-center">
                                <h3 class="text-success mb-0">${result.succeeded}</h3>
                                <small class="text-muted">Succeeded</small>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card border-danger">
                            <div class="card-body text-center">
                                <h3 class="text-danger mb-0">${result.failed}</h3>
                                <small class="text-muted">Failed</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `;

        // Successful allocations
        if (succeeded.length > 0) {
            html += `
                <div class="card mb-3 border-success">
                    <div class="card-header bg-success text-white">
                        <h6 class="mb-0">
                            <i class="bi bi-check-circle me-2"></i>Successfully Allocated (${succeeded.length})
                        </h6>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-sm table-hover mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th style="width: 30px;">#</th>
                                        <th>Serial Number</th>
                                        <th>Model</th>
                                        <th>School</th>
                                        <th>Storage Location</th>
                                        <th style="width: 100px;">Print Status</th>
                                    </tr>
                                </thead>
                                <tbody>
            `;

            succeeded.forEach((item, idx) => {
                const deviceInfo = deviceInfoMap[item.serial] || {};
                // Format location with proper labels
                const location = item.building && item.room && item.rack && item.shelf && item.bin
                    ? `${item.building} > ${item.room} > Rack ${item.rack} > Shelf ${item.shelf} > Bin ${item.bin}`
                    : 'Location not specified';
                const printStatusId = `printStatus_${item.phase2DeviceId}`;
                
                html += `
                                    <tr>
                                        <td class="text-muted">${idx + 1}</td>
                                        <td><code class="text-primary">${item.serial}</code></td>
                                        <td>${deviceInfo.model || '<span class="text-muted">N/A</span>'}</td>
                                        <td>${deviceInfo.schoolName || 'Unknown'}</td>
                                        <td>
                                            <small class="text-success">
                                                <i class="bi bi-geo-alt-fill me-1"></i><strong>${location}</strong>
                                            </small>
                                        </td>
                                        <td id="${printStatusId}">
                                            <span class="badge bg-secondary">Pending</span>
                                        </td>
                                    </tr>
                `;
            });

            html += `
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        // Failed allocations
        if (failed.length > 0) {
            html += `
                <div class="card mb-3 border-danger">
                    <div class="card-header bg-danger text-white">
                        <h6 class="mb-0">
                            <i class="bi bi-x-circle me-2"></i>Failed Allocations (${failed.length})
                        </h6>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-sm table-hover mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th style="width: 30px;">#</th>
                                        <th>Serial Number</th>
                                        <th>Model</th>
                                        <th>School</th>
                                        <th>Error</th>
                                    </tr>
                                </thead>
                                <tbody>
            `;

            failed.forEach((item, idx) => {
                const deviceInfo = deviceInfoMap[item.serial] || {};
                html += `
                                    <tr>
                                        <td class="text-muted">${idx + 1}</td>
                                        <td><code class="text-danger">${item.serial}</code></td>
                                        <td>${deviceInfo.model || '<span class="text-muted">N/A</span>'}</td>
                                        <td>${deviceInfo.schoolName || 'Unknown'}</td>
                                        <td><small class="text-danger">${item.error || 'Unknown error'}</small></td>
                                    </tr>
                `;
            });

            html += `
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        resultsDiv.innerHTML = html;

        // Store results for label printing
        window.batchAllocationResults = {
            succeeded: succeeded,
            deviceInfoMap: deviceInfoMap
        };

        modal.show();

        // Automatically print labels for successful allocations
        // Wait a moment for modal to fully render before starting print
        if (succeeded.length > 0) {
            setTimeout(() => {
                console.log('[BatchAllocation] Starting automatic label printing for', succeeded.length, 'devices');
                printAllLabelsSequentially(succeeded, deviceInfoMap);
            }, 500);
        }
    }

    // Print all labels sequentially with delays
    async function printAllLabelsSequentially(succeeded, deviceInfoMap) {
        console.log('[BatchAllocation] printAllLabelsSequentially called with', succeeded.length, 'devices');
        const printAllBtn = document.getElementById('printAllLabelsBtn');
        if (printAllBtn) {
            printAllBtn.style.display = 'none'; // Hide button during auto-print
        }

        for (let i = 0; i < succeeded.length; i++) {
            const item = succeeded[i];
            const deviceInfo = deviceInfoMap[item.serial] || {};
            const printStatusId = `printStatus_${item.phase2DeviceId}`;
            const printStatusEl = document.getElementById(printStatusId);

            console.log(`[BatchAllocation] Printing label ${i + 1}/${succeeded.length} for device ${item.serial}`);

            if (printStatusEl) {
                printStatusEl.innerHTML = '<span class="badge bg-warning">Printing...</span>';
            }

            const allocationData = {
                building: item.building || '',
                room: item.room || '',
                rack: item.rack || '',
                shelf: item.shelf || '',
                bin: item.bin || ''
            };

            console.log('[BatchAllocation] Allocation data:', allocationData);
            console.log('[BatchAllocation] Device info:', deviceInfo);

            const printed = await printStorageLabel(allocationData, {
                serial: item.serial,
                schoolName: deviceInfo.schoolName || 'Unknown'
            });
            
            console.log(`[BatchAllocation] Print result for ${item.serial}:`, printed);

            if (printStatusEl) {
                if (printed) {
                    printStatusEl.innerHTML = '<span class="badge bg-success">Printed</span>';
                } else {
                    printStatusEl.innerHTML = '<span class="badge bg-danger">Blocked</span>';
                    // Show print all button if any print was blocked
                    if (printAllBtn) {
                        printAllBtn.style.display = 'inline-block';
                    }
                }
            }

            // Delay between prints to avoid popup blocking
            if (i < succeeded.length - 1) {
                await new Promise(resolve => setTimeout(resolve, 800));
            }
        }

        // Show print all button if it wasn't shown already
        if (printAllBtn && printAllBtn.style.display === 'none') {
            printAllBtn.style.display = 'inline-block';
        }
    }

    // Print all labels button handler
    const printAllLabelsBtn = document.getElementById('printAllLabelsBtn');
    if (printAllLabelsBtn) {
        printAllLabelsBtn.addEventListener('click', async () => {
            const results = window.batchAllocationResults;
            if (results && results.succeeded && results.succeeded.length > 0) {
                printAllLabelsBtn.disabled = true;
                printAllLabelsBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Printing...';
                await printAllLabelsSequentially(results.succeeded, results.deviceInfoMap);
                printAllLabelsBtn.disabled = false;
                printAllLabelsBtn.innerHTML = '<i class="bi bi-printer me-1"></i>Print All Labels';
            }
        });
    }

    // Get occupied locations from API
    async function getOccupiedLocations() {
        try {
            const resp = await fetch(`${apiBase}/occupied-locations`);
            if (!resp.ok) {
                console.warn('[BatchAllocation] Failed to fetch occupied locations, continuing without check');
                return new Set();
            }
            const occupied = await resp.json();
            
            // Create Set of location keys for fast lookup
            const occupiedSet = new Set();
            occupied.forEach(loc => {
                if (loc.building && loc.room && loc.rack && loc.shelf && loc.bin) {
                    const key = `${loc.building}|${loc.room}|${loc.rack}|${loc.shelf}|${loc.bin}`;
                    occupiedSet.add(key);
                }
            });
            
            console.log('[BatchAllocation] Loaded', occupiedSet.size, 'occupied locations');
            return occupiedSet;
            } catch (error) {
            console.error('[BatchAllocation] Error fetching occupied locations:', error);
            return new Set(); // Return empty set on error, will still generate locations
        }
    }

    // Generate unique sequential locations for batch allocation, skipping occupied ones
    function generateUniqueLocations(baseLocation, deviceCount, occupiedLocations) {
        const locations = [];
        const { building, room, rack, shelf, bin } = baseLocation;
        
        // Parse starting shelf and bin (handle both string and number formats)
        let currentShelf = parseInt(shelf) || 1;
        let currentBin = parseInt(bin) || 1;
        
        const maxShelf = 10; // Maximum shelf number
        const maxBin = 10;   // Maximum bin number
        const maxRack = 10;  // Maximum rack number (if needed to expand)
        let currentRack = parseInt(rack) || 1;
        
        let attempts = 0;
        const maxAttempts = deviceCount * 100; // Safety limit to prevent infinite loops
        
        for (let i = 0; i < deviceCount && attempts < maxAttempts; attempts++) {
            const locationKey = `${building}|${room}|${currentRack.toString().padStart(2, '0')}|${currentShelf.toString().padStart(2, '0')}|${currentBin.toString().padStart(2, '0')}`;
            
            // Check if location is occupied
            if (!occupiedLocations.has(locationKey)) {
                // Location is available, assign it
                locations.push({
                    building: building,
                    room: room,
                    rack: currentRack.toString().padStart(2, '0'),
                    shelf: currentShelf.toString().padStart(2, '0'),
                    bin: currentBin.toString().padStart(2, '0')
                });
                i++; // Only increment device counter when we assign a location
            }
            
            // Move to next bin
            currentBin++;
            
            // If we reach max bin, move to next shelf and reset bin to 01
            if (currentBin > maxBin) {
                currentBin = 1;
                currentShelf++;
            }
            
            // If we reach max shelf, move to next rack and reset shelf to 01
            if (currentShelf > maxShelf) {
                currentShelf = 1;
                currentRack++;
            }
            
            // Safety check: if we've tried too many locations, throw error
            if (currentRack > maxRack) {
                throw new Error(`Not enough available storage locations. Found ${locations.length} available locations for ${deviceCount} devices.`);
            }
        }
        
        if (locations.length < deviceCount) {
            throw new Error(`Could not find enough unique storage locations. Found ${locations.length} available locations for ${deviceCount} devices.`);
        }
        
        console.log('[BatchAllocation] Generated', locations.length, 'unique locations');
        return locations;
    }

    // Get location range summary text
    function getLocationRangeSummary(locations) {
        if (locations.length === 0) return 'No locations';
        
        const first = locations[0];
        const last = locations[locations.length - 1];
        
        const building = first.building;
        const room = first.room;
        const rack = first.rack;
        
        if (locations.length === 1) {
            return `${building} > ${room} > Rack ${rack} > Shelf ${first.shelf} > Bin ${first.bin}`;
        } else {
            const shelfRange = first.shelf === last.shelf ? 
                `Shelf ${first.shelf}` : 
                `Shelves ${first.shelf}-${last.shelf}`;
                
            const binRange = first.bin === last.bin ? 
                `Bin ${first.bin}` : 
                `Bins ${first.bin}-${last.bin}`;
                
            return `${building} > ${room} > Rack ${rack} > ${shelfRange} > ${binRange}`;
        }
    }

    // REMOVED: showBatchAllocationSummary function - batch allocation now navigates directly to bulk-allocation.html
    // This function has been completely removed to prevent the modal from appearing

    // Confirm batch allocate button
    // REMOVED: confirmBatchAllocateBtn handler - no longer needed as we navigate directly to bulk-allocation.html

    // Initial load - wait for DOM to be ready
    function initialize() {
        const tbody = document.querySelector('#pendingTable tbody');
        if (!tbody) {
            initRetryCount++;
            if (initRetryCount < MAX_INIT_RETRIES) {
            setTimeout(initialize, 100);
            }
            return;
        }
        // View is active, proceed with initialization
        initRetryCount = 0;
        loadPendingAllocations();
        
        // SETUP THE BATCH BUTTON
        setupBatchAllocateButton();
        
        // Set up auto-refresh only if view is active
        if (refreshInterval) {
            clearInterval(refreshInterval);
        }
        refreshInterval = setInterval(() => {
            if (isViewActive() && !isLoading) {
                loadPendingAllocations();
            }
        }, 30000);
    }

    // Clean up interval when view is unloaded
    function cleanup() {
        if (refreshInterval) {
            clearInterval(refreshInterval);
            refreshInterval = null;
        }
    }

    // Initialize when DOM is ready
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initialize);
    } else {
        initialize();
    }
    
    // Cleanup on page unload
    window.addEventListener('beforeunload', cleanup);
    
    // Export cleanup function for view switching
    window.cleanupPendingAllocations = cleanup;
})();
</script>
